      - logical_table
      - query_id
      - bytes_scanned
      - queue_millis
      - planning_millis
      - engine_millis
      - total_millis
      - reuse
      - error_type
      - error_class
      - error_code
      - alarms
    propagation: current
    purpose: Explain one reusable semantic-storage Athena statement without statement text or parameters.

