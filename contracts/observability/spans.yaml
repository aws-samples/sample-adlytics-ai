  - constant: INSIGHT_GENERATION
    name: insight.model.call
    parent: current
    # run_id, task_id and cohort_revision are conditionally required: a call beneath precompute
    # cohort correlation carries all three; a serve-time chat call records them absent.
    required_attributes: [slot_id, model_route, model_id]
    allowed_attributes:
      - slot_id
      - model_route
      - model_id
      - run_id
      - task_id
      - cohort_revision
      - configured_timeout_ms
      - observed_timeout
      - prompt_version
      - output_class
      - outcome
      - stop_reason
      # ADR-076 tiering attributes.
      - tier
      - horizon_role
      # Model token-usage counts; the redaction vocabulary reserves the word "token".
      - usage_input
      - usage_output
      - total_millis
      # ADR-076 decision 1 (2026-10-05): digests of the exact model input and of the cache
      # row identity, never their content or the scope id.
      - input_sha256
      - cache_identity_sha256
      - error_type
      - error_class
      - error_code
      - alarms
    propagation: current
    purpose: >-
      Explain one Bedrock insight-generation call's latency, token usage, stop reason, and
      outcome without prompt or narration content, under whichever serving, continuation, or
      precompute boundary invoked it.
