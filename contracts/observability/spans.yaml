# Static hand-authored span names, hierarchy, metadata boundary, and purpose.
# Generated Python constants are committed at src/adapters/outbound/telemetry/generated_spans.py.
version: 1
spans:
  - constant: ATHENA_QUERY
    name: athena.query
    parent: current
    # run_id, task_id and cohort_revision are conditionally required: every query beneath bake
    # or precompute cohort correlation carries all three, and a serve-time chat query records
    # them absent (owner decision 2026-10-15 ~04:25Z, the insight.model.call pattern). Bake
    # trace completeness enforces the cohort case.
    required_attributes: [metric, facts, max_rows]
    allowed_attributes:
      - metric
      - facts
      - max_rows
      - bytes_scanned
      - cache_hit
      - engine_millis
      - planning_millis
      - queue_millis
      - total_millis
      - rows_returned
      - truncated
      - query_id
      - workgroup
      - statement_kind
      - state
      - service_processing_millis
      - admission_wait_millis
      - statistics_unavailable
      - wait_policy
      - wait_limit_s
      - start_throttled_attempts
      - run_id
      - task_id
      - cohort_revision
      - error_type
      - error_class
      - error_code
      - alarms
    propagation: current
    purpose: Explain one Athena query execution's latency, scan cost, reuse, admission wait and bounded result shape, including a failed or cancelled one.

  - constant: ATHENA_STATEMENT
    name: athena.statement
    parent: current
    required_attributes: [operation_kind, logical_table]
    allowed_attributes:
