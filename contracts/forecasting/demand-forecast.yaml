# The demand-forecast policy (design §3a). Baked into the job image, so the image identity covers
# it; every run records each section's version and this file's SHA-256.
# Validated by `make validate-contracts` against demand-forecast.schema.json and loaded by
# src/adapters/outbound/demand_forecast_policy.py into src/domain/forecasting/policy.py.
schema_version: 1

input:
  version: 1
  facts:
    sales: fct_retail_sales
    traffic: fct_product_page_views
  # Titles only.
  product_metadata: dim_product
  selectors:
    distributor_view: MANUFACTURING
    selling_program: RETAIL
  # Sunday, in the date.weekday() convention (src/domain/semantics/time.py).
  week_starts_on: 6
  targets: [units_shipped, units_ordered, revenue_shipped, cogs_shipped]
  covariates: [glance_views]

missing_weeks:
  version: 1
  # The trailing window in which one observed day makes a product active (P-4).
  activity_window_weeks: 13
  # A product gap longer than this restarts that product's context (design §3d).
  max_unknown_run_weeks: 2
  # An uncovered day younger than this doesn't count as unknown yet (P-14).
  unknown_day_grace_days: 7

eligibility:
  version: 1
  min_context_weeks: 13
  holdout_weeks: 13
  min_scored_holdout_weeks: 10
  horizon_weeks: 13
  quantiles: [0.1, 0.5, 0.9]
  history_weeks_max: 104
  ets_min_known_weeks: 13
  min_seasonal_residuals: 13

engine:
  version: 1
  # Chronos-2 forecasts each batch jointly, so batch membership is policy (design §4c, P-12).
  cross_learning: true
  batch_size: 256
  batch_scope: one_target_one_origin
  sort_key: [target, origin, marketplace_key, distributor_view, selling_program, canonical_asin]
  # The largest of 2,000, 1,000 or 500 whose measured shard time is at most 1,800 s (P-18).
  shard_max_asins: 2000

numeric:
  version: 1
  stored_decimal_places: 4
  stored_rounding: half_even
  check_order: [finite, band_unordered, negative]
  display: whole_half_away_from_zero

# Owner decision 4: show Chronos-2 only where it beats SeasonalNaive and ETS on the backtest,
# otherwise the simpler model (design §5c, ADR-157; P-1, P-2, P-10).
gate:
  version: 1
  # WQL decides; MASE is reported only.
  metric: wql
  # Chronos-2 shows only when WQL_chronos < (1 - margin) x min(WQL_seasonal_naive, WQL_ets).
  margin: 0.0
  # On equal WQL the simpler model is shown.
  simplicity_order: [seasonal_naive, ets, chronos2]
  # Chronos-2 is eligible only when both comparators are valid (COMPARATOR_UNAVAILABLE).
  comparator_fallback: require_all
  # No valid simple model shows nothing (ACCURACY_NOT_TESTABLE).
  no_valid_simple_model: withhold
  # Comparator bands are censored at zero (design §5a).
  comparator_quantiles: censor_at_zero
  # A model whose origin forecast fails design §4d steps 1 to 3 is skipped for the next in order.
  not_publishable: next_in_order

serving:
  version: 1
  stale_after_days: 16
  page_rows: 50
  tool_list_max: 50
  compare_max_asins: 5
  views: [4, 8, 13]
  title_max_bytes: 400
  item_max_bytes: 350000
  rank_by: units_ordered_p50_13w
  status_target: units_ordered
  search: exact_asin

# When a failed or held run re-runs, and when a new input is admitted (design §6d; P-6, P-17).
retry:
  version: 1
  # Deterministic outcomes: the same input gives the same result, so the next check no-ops.
  # Every other failure gets `retry`.
  suppressed_outcomes:
    - held_quality
    - failed(target_empty)
    - failed(job:MODEL_ARTIFACT_MISMATCH)
    - failed(job:RUN_IDENTITY_MISMATCH)
    - failed(job:INPUT_SCHEMA_MISMATCH)
    - failed(job:INPUT_SHARD_MISMATCH)
    - failed(input_build:MARKETPLACE_UNKNOWN)
    - failed(input_build:statement_too_large)
    - failed(input_build:SHARD_PLAN_MISMATCH)
    - failed(input_build:ROSTER_TOO_LARGE)
    - rolled_back
  # Daily re-runs of one fingerprint after a transient failure; the next failure suppresses
  # (`retry_exhausted`).
  max_transient_retries: 3
  # The UTC weekday whose scheduled check admits a new run fingerprint (the weekly slot).
  admission_weekday: thursday
