# amc-audience-performance — DSP delivery and attributed outcomes per campaign and segment (C1).
#
# Pack 8 of the audience family (ADR-103; design §5.2 row 8, §5.5 "Audience performance", §6.5).
# Route C1-a (P-BO-2 failed on the Sandbox, design §8): one row per calendar month, DSP campaign
# and matched DSP behaviour segment, from dsp_impressions_by_matched_segments filtered by the
# governed campaign_country, joined to that shopper's DSP-attributed purchases of the same
# campaign (amazon_attributed_events_by_conversion_time, ad_product_type IS NULL) on
# (user_id, campaign_id_string). Chat-only in this slice; the Audiences page reads it in a later
# one.
#
# Segment figures never add up: a shopper and an impression repeat once per matched segment, so
# no measure here is summed across segments or campaigns (D-4). Purchases are summed within one
# campaign only, which the attributed-table rule allows (design §5.1).
#
# Follows pack 5 (owner decision 3, 2026-10-09; plan D14): discard_suppressed_rows, with AC-E1.5
# "pending Step B", and pack 5's pre-built alternative only; no variant SQL of its own. The
# dsp_currency_min and purchase_currency_min twins are pack 5's currency check: a delivery whose
# rows disagree on a currency is refused (CURRENCY_DISAGREEMENT).
contract_id: amc-audience-performance
contract_version: 1
source_system: amc
source_dataset: dsp_impressions_by_matched_segments
source_format: csv
target_table: fct_segment_delivery
source_tables:
  - dsp_impressions_by_matched_segments
  - amazon_attributed_events_by_conversion_time
# One row per month, grain set, marketplace, campaign and segment. The namespace is in the grain
# so a later writer in another namespace can't collide with these rows; this pack writes only
# amc_dsp_behavior. rows_suppressed is not in the grain: no suppressed row reaches the fact.
grain:
  - period_start
  - period_end
  - time_grain
  - grain_set
  - marketplace_key
  - campaign_key
  - segment_namespace
  - segment_id
key_unique_among_unsuppressed_only: true
partition_keys:
  - marketplace_key
  - period_start
measurement_basis: ad_attributed
source_timezone: UTC
ecosystem_key: amazon
platform_key: amazon_ads
restatement_window_days: 30
staleness_threshold_hours: 840
grain_feasibility_note: >
  Every output column is NONE or LOW or derived in a CTE, so the bar is 2 distinct users per row.
  campaign_country, campaign_id_string and behavior_segment_id are LOW; the counts are
  COUNT(DISTINCT user_id) and user_id (VERY_HIGH) never appears in output; the sums read
  impressions, total_cost, purchases and product_sales (NONE). The bar applies per data-source
  path, so a row can be withheld with two or more shoppers when the outcome path has fewer; it is
  discarded like any withheld row.
# The cells a delivery must return: its marketplace, one row per returned campaign and segment.
# The segments expected are the segment roster serving applies (the campaign's segments returned
# the month before, design §6.5), so campaign and segment are open slices and the load writes no
# not_returned cell for them.
expected_cells:
  cells:
    - column: marketplace_key
      from: delivery
  open_slices: [campaign_key, segment_id]
currency_minimums:
  dsp_currency: dsp_currency_min
  purchase_currency: purchase_currency_min
suppression:
  discriminator_column: rows_suppressed
  reason_column: suppression_reason
  distinct_user_count_column: distinct_user_count
fields:
  # --- grain -----------------------------------------------------------------
  - target_column: period_start
    assigned_by_load: true
    target_type: date
  - target_column: period_end
    assigned_by_load: true
    target_type: date
  - target_column: time_grain
    assigned_by_load: true
    target_type: string
    value_domain: [month]
  - target_column: grain_set
    literal_value: campaign
    target_type: string
    value_domain: [campaign]
  - source_path: campaign_country
    target_column: marketplace_key
    # LOW. Filtered on the governed dsp_campaign_country parameter, so one marketplace.
  - source_path: campaign_id_string
    target_column: campaign_key
    # LOW. The DSP campaign; the same identifier dim_campaign's DSP rows carry.
  - target_column: segment_namespace
    target_type: string
    literal_value: amc_dsp_behavior
    value_domain: [amc_dsp_behavior]
    # The DSP behaviour namespace of dim_audience_segment; never compared with amc_asi.
  - source_path: behavior_segment_id
    target_column: segment_id
    target_type: string
    # LOW. INTEGER in AMC; stored as decimal text, the key dim_audience_segment carries.
  # --- media resolved from the DSP profile literal -----------------------------
  - target_column: channel_group_key
    assigned_by_load: true
    target_type: string
  - target_column: channel_key
    assigned_by_load: true
    target_type: string
  - target_column: ad_product_key
    assigned_by_load: true
    target_type: string
  # --- shopper-aggregate shape (design §4.2) ----------------------------------
  - target_column: identity_unit
    literal_value: amazon_user_id
    target_type: string
  - target_column: cell_state
    assigned_by_load: true
    target_type: string
    value_domain: [returned, not_returned]
  # --- measures: distinct counts -----------------------------------------------
  - source_path: COUNT(DISTINCT user_id)
    target_column: segment_reach
    target_type: bigint
    derived_from:
      - user_id
      - behavior_segment_id
    non_additive: true
    nullable: true
    null_meaning: not_returned
    # Distinct shoppers with at least one impression of the campaign matched to the segment.
  - source_path: COUNT(DISTINCT CASE WHEN purchases > 0 THEN user_id END)
    target_column: segment_purchasers
    target_type: bigint
    derived_from:
      - user_id
      - purchases
    non_additive: true
    nullable: true
    null_meaning: not_returned
  # --- measures: additive within one row ----------------------------------------
  - source_path: SUM(impressions)
    target_column: impressions
    target_type: bigint
    derived_from:
      - impressions
    nullable: true
    null_meaning: not_returned
    # Impressions repeat once per matched segment: summable only within this row.
  - source_path: SUM(total_cost)
    target_column: dsp_spend
    derived_from:
      - total_cost
    scale_divisor: 100000
    currency_column: dsp_currency
    nullable: true
    null_meaning: not_returned
  - source_path: SUM(purchases)
    target_column: segment_purchases
    target_type: bigint
    derived_from:
      - purchases
    nullable: true
    null_meaning: not_returned
    # NULL on a returned row with no attributed purchase (the LEFT JOIN found none);
    # segment_purchasers reads 0 there.
  - source_path: SUM(product_sales)
    target_column: segment_attributed_revenue
    derived_from:
      - product_sales
    scale_divisor: 1
    currency_column: purchase_currency
    nullable: true
    null_meaning: not_returned
  - source_path: MAX(currency_iso_code)
    target_column: dsp_currency
    target_type: string
    derived_from:
      - currency_iso_code
    nullable: true
    null_meaning: not_returned
  - source_path: MAX(purchase_currency)
    target_column: purchase_currency
    target_type: string
    derived_from:
      - purchase_currency
    nullable: true
    null_meaning: not_returned
tags:
  - amc
  - shopper-aggregate
  - audience-segment
