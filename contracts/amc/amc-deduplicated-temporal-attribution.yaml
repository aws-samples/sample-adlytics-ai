# Deduplicated temporal attribution at conversion date × channel × marketplace × model.
#
# Sensitive conversion/user identities and exact touch timestamps remain inside AMC. The final
# aggregate contains only registered model keys, additive fractional purchase credit, and
# halo-inclusive allocated revenue. Suppressed output is refused because AMC nulls currency and all
# LOW dimensions, leaving monetary residuals that cannot be stored without inventing context.

contract_id: amc-deduplicated-temporal-attribution
contract_version: 1

source_system: amc
source_dataset: deduplicated_temporal_attribution
source_format: csv

target_table: fct_deduplicated_temporal_attribution

source_tables:
  - conversions
  - dsp_impressions
  - dsp_clicks
  - sponsored_ads_traffic

grain:
  - date_key
  - channel_key
  - marketplace_key
  - currency_code
  - attribution_model_key
  - rows_suppressed

partition_keys:
  - marketplace_key
  - date_key

measurement_basis: ad_attributed
source_timezone: UTC
ecosystem_key: amazon
platform_key: amazon_ads
restatement_window_days: 30
staleness_threshold_hours: 72

grain_feasibility_note: >
  Every final dimension is LOW or a repository literal, so each clean row needs two distinct users.
  Sandbox accepted this channel/model grain without suppression; the internal Standard instance
  returned one fully nulled residual row per model. The governed producer therefore rejects any
  suppressed delivery and records the capability as unavailable for that customer/window rather
  than publishing monetary rows whose currency and channel were removed.

suppression:
  discriminator_column: rows_suppressed
  reason_column: suppression_reason
  distinct_user_count_column: distinct_user_count

fields:
  - source_path: event_date_utc
    target_column: date_key

  - source_path: ad_product_type
    target_column: channel_key
    value_domain:
      - amazon_dsp
      - sponsored_products
      - sponsored_brands
      - sponsored_display
      - sponsored_television

  - source_path: ad_product_type
    target_column: ad_product_key

  - source_path: >-
      CASE WHEN ad_product_type IN ('sponsored_products', 'sponsored_brands') THEN 'search'
      WHEN ad_product_type = 'sponsored_television' THEN 'video' ELSE 'display' END
    target_column: channel_group_key
    target_type: string
    derived_from: [ad_product_type]
    value_domain: [search, display, video]

  - source_path: marketplace_name
    target_column: marketplace_key

  - source_path: temporal attribution model selected inside AMC
    target_column: attribution_model_key
    target_type: string
    derived_from:
      - conversion_id
      - user_id
      - event_dt_utc
      - impression_dt_utc
      - click_dt_utc
      - campaign_id_string
    value_domain: [first_touch_v1, last_touch_v1, linear_v1]

  - source_path: SUM(temporal conversion credit)
    target_column: matched_purchase_credit
    target_type: decimal(38,4)
    derived_from:
      - conversion_id
      - user_id
      - campaign_id_string

  - source_path: SUM(total_product_sales * temporal conversion credit)
    target_column: revenue_attributed_deduplicated_incl_halo
    scale_divisor: 1
    currency_column: currency_code
    derived_from:
      - conversion_id
      - user_id
      - total_product_sales
      - campaign_id_string

  - source_path: purchase_currency
    target_column: currency_code

  - source_path: values_removed
    target_column: rows_suppressed
    target_type: boolean
    from_extraction_option: true

  - source_path: filtered_reason
    target_column: suppression_reason
    target_type: string
    from_extraction_option: true
    nullable: true
    null_meaning: suppressed

  - source_path: distinct_user_count
    target_column: distinct_user_count
    target_type: int
    from_extraction_option: true
    nullable: true
    null_meaning: suppressed

tags:
  - phase-1
  - amc
  - attribution
  - deduplicated
