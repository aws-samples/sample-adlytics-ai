# amc-segment-buyer-profile-dsp-exposed — which DSP behaviour segments the month's ad-touched
# buyers belonged to, beside the shoppers DSP reached (C2, the standard path).
#
# Pack 12 of the audience family (ADR-103; design §5.2 row 12, §5.5 "Buyer profile", §6.5 C2).
# The fallback that ships without the paid feature: "DSP-exposed buyers only", the path the
# Audiences page defaults to when Audience Segment Insights hasn't been observed (ADR-107).
#
# Same shape as packs 10-11 with no fence: both bases come from dsp_impressions_by_user_segments
# in the month, filtered on the governed campaign_country, so no ID-space restriction is needed
# (design §5.5). profiled_exposed_total counts the shoppers with a DSP impression in the period
# and a segment row there; profiled_buyers_total those of them with a purchase in conversions in
# the month (an inner join, so buyers are a subset). A segment row counts the same two sets
# inside the DSP behaviour segment the shopper belonged to at an impression, targeted or not.
# Buyers are any ad-touched purchasers in the month and may have bought before their first ad.
# Shares and the index are computed inside one delivery, on read; never summed across segments
# or compared with the paid path as one series.
#
# Follows pack 5 (owner decision 3, 2026-10-09; plan D14): discard_suppressed_rows, AC-E1.5
# "pending Step B", pack 5's alternative only. cadenceLagDays is AMC's 2-day default.
contract_id: amc-segment-buyer-profile-dsp-exposed
contract_version: 1
source_system: amc
source_dataset: dsp_impressions_by_user_segments
source_format: csv
target_table: fct_segment_profile
source_tables:
  - dsp_impressions_by_user_segments
  - conversions
# One row per month, grain set, marketplace, profile path, namespace, segment and row kind, as
# packs 10-11 (design §6.5). segment_id is NULL on the total row.
grain:
  - period_start
  - period_end
  - time_grain
  - grain_set
  - marketplace_key
  - profile_path
  - segment_namespace
  - segment_id
  - row_kind
key_unique_among_unsuppressed_only: true
partition_keys:
  - marketplace_key
  - period_start
measurement_basis: ad_attributed
source_timezone: UTC
ecosystem_key: amazon
platform_key: amazon_ads
restatement_window_days: 30
staleness_threshold_hours: 840
grain_feasibility_note: >
  Every output column is NONE or LOW or derived in a CTE, so the bar is 2 distinct users per row.
  behavior_segment_id and campaign_country are LOW; marketplace_name echoes the governed
  parameter; the row kind is a literal; the counts are COUNT(DISTINCT user_id) and user_id (VERY_HIGH) never
  appears in output. The bar applies per data-source path (the segment table, conversions),
  so a segment row can be withheld with two or more shoppers when one path has fewer; it is
  discarded like any withheld row (plan D19). The total row counts every profiled shopper, so it
  shouldn't be withheld if the bar counts the row's whole population [unverified, P-BO-1
  criterion 7]; if it is, every share and index of the delivery reads not available.
# The cells a delivery must return: its marketplace's one profiled_total row, required, and one
# row per returned segment. Segments are an open domain graded at serve against the previous
# month's segments of the same path (the segment roster, design §6.5), so they are an open
# slice and the load writes no not_returned cell for them. A missing total row is written
# not_returned. `serves` names the measures each row kind carries, so serving reads a figure
# from the rows that hold it.
expected_cells:
  sets:
    - cells:
        - column: marketplace_key
          from: delivery
        - column: row_kind
          values: [profiled_total]
      measures: [profiled_exposed_total, profiled_buyers_total]
      serves: [profiled_exposed_total, profiled_buyers_total]
    - cells:
        - column: marketplace_key
          from: delivery
        - column: row_kind
          values: [segment]
      open_slices: [segment_id]
      measures: [segment_exposed_shoppers, segment_buyers, segment_buyers_new_to_brand]
      serves: [segment_exposed_shoppers, segment_buyers, segment_buyers_new_to_brand]
suppression:
  discriminator_column: rows_suppressed
  reason_column: suppression_reason
  distinct_user_count_column: distinct_user_count
fields:
  # --- grain -----------------------------------------------------------------
  - target_column: period_start
    assigned_by_load: true
    target_type: date
  - target_column: period_end
    assigned_by_load: true
    target_type: date
  - target_column: time_grain
    assigned_by_load: true
    target_type: string
    value_domain: [month]
  - target_column: grain_set
    literal_value: platform
    target_type: string
    value_domain: [platform]
  - source_path: marketplace_name
    target_column: marketplace_key
    # LOW. The pack echoes its governed sponsored_marketplace_name parameter, so a delivery
    # carries one marketplace.
  - target_column: profile_path
    target_type: string
    literal_value: dsp_exposed_only
    value_domain: [asi_in_market, asi_lifestyle, dsp_exposed_only]
    # An exact selector: "DSP-exposed buyers only". Never compared with a paid profile path as
    # one series: each has its own base.
  - target_column: segment_namespace
    target_type: string
    literal_value: amc_dsp_behavior
    value_domain: [amc_asi, amc_dsp_behavior]
    # The DSP behaviour namespace of dim_audience_segment; never compared with amc_asi.
  - source_path: behavior_segment_id
    target_column: segment_id
    target_type: string
    nullable: true
    null_meaning: not_applicable_under_options
    # LOW. INTEGER in AMC; stored as decimal text, the key dim_audience_segment carries. NULL on
    # the profiled_total row.
  - source_path: row_kind
    target_column: row_kind
    target_type: string
    derived_from:
      - user_id
    value_domain: [segment, profiled_total]
    # The branch of the pack's UNION ALL that emitted the row.
  # --- media, NULL at the platform grain set (ADR-099 point 2) -----------------
  - target_column: channel_group_key
    assigned_by_load: true
    target_type: string
    nullable: true
    null_meaning: not_applicable_under_options
  - target_column: channel_key
    assigned_by_load: true
    target_type: string
    nullable: true
    null_meaning: not_applicable_under_options
  - target_column: ad_product_key
    assigned_by_load: true
    target_type: string
    nullable: true
    null_meaning: not_applicable_under_options
  - target_column: campaign_key
    assigned_by_load: true
    target_type: string
    nullable: true
    null_meaning: not_applicable_under_options
  # --- shopper-aggregate shape (design §4.2) ----------------------------------
  - target_column: identity_unit
    literal_value: amazon_user_id
    target_type: string
  - target_column: cell_state
    assigned_by_load: true
    target_type: string
    value_domain: [returned, not_returned]
  # --- measures: exact distinct counts, never summed ---------------------------
  # Each row kind carries its own counts and NULL in the other kind's (`serves` says which
  # rows hold a figure); a not_returned total row has NULL totals, read as not available.
  - source_path: COUNT(DISTINCT s.user_id)
    target_column: segment_exposed_shoppers
    target_type: bigint
    derived_from:
      - user_id
      - behavior_segment_id
    non_additive: true
    nullable: true
    null_meaning: not_returned
  - source_path: COUNT(DISTINCT b.user_id)
    target_column: segment_buyers
    target_type: bigint
    derived_from:
      - user_id
      - event_category
    non_additive: true
    nullable: true
    null_meaning: not_returned
  - source_path: COUNT(DISTINCT CASE WHEN b.ntb = 1 THEN b.user_id END)
    target_column: segment_buyers_new_to_brand
    target_type: bigint
    derived_from:
      - user_id
      - new_to_brand
    non_additive: true
    nullable: true
    null_meaning: not_returned
  - source_path: COUNT(DISTINCT p.user_id)
    target_column: profiled_exposed_total
    target_type: bigint
    derived_from:
      - user_id
    non_additive: true
    nullable: true
    null_meaning: not_returned
  - source_path: COUNT(DISTINCT b.user_id) over the profiled shoppers
    target_column: profiled_buyers_total
    target_type: bigint
    derived_from:
      - user_id
      - event_category
    non_additive: true
    nullable: true
    null_meaning: not_returned
tags:
  - amc
  - shopper-aggregate
  - audience-segment
