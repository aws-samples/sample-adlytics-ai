  # A grain set with no media split: platform-level shopper aggregates (ADR-099). Channel,
  # channel group and ad product stay NULL, the same way amazon_retail resolves vendor rows.
  - source: {namespace: adlytics.media_profile, value: amazon_ads}
    ecosystem: amazon
    platform: amazon_ads
    channel_group: null
    channel: null
    ad_product: null
    mapping_version: 1
    valid_from: 2000-01-01
    evidence: docs/decisions/adr-099-treat-distinct-shopper-counts-as-a-new-kind-of-fact.md
# Version 2. A shopper-aggregate pack emits a source-set label, a source fact such as
# "touched in dsp_impressions and in sponsored_ads_traffic", never a canonical key (AC-BR.9).
# Each label resolves here, within one platform, to both disjoint grouping axes (ADR-101).
exposure_source_sets:
  - platform: amazon_ads
    source_set: dsp
    exposure_group: dsp_only
    acquisition_channel_group: dsp_only
    mapping_version: 1
    valid_from: 2000-01-01
    evidence: docs/decisions/adr-101-model-shopper-groupings-as-disjoint-axes-with-one-window-per-shopper.md
  - platform: amazon_ads
    source_set: sponsored
    exposure_group: sponsored_only
    acquisition_channel_group: sponsored_only
    mapping_version: 1
    valid_from: 2000-01-01
    evidence: docs/decisions/adr-101-model-shopper-groupings-as-disjoint-axes-with-one-window-per-shopper.md
  - platform: amazon_ads
    source_set: dsp+sponsored
    exposure_group: dsp_and_sponsored
    acquisition_channel_group: dsp_and_sponsored
    mapping_version: 1
    valid_from: 2000-01-01
    evidence: docs/decisions/adr-101-model-shopper-groupings-as-disjoint-axes-with-one-window-per-shopper.md
