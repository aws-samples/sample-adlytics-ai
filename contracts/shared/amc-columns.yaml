        note: >
          Closed value set the page enumerates: ROAS, TOTAL_ROAS, REACH, CPVC, COMPLETION_RATE,
          CTR, CPC, DPVR, PAGE_VISIT, CPDPV, CPA, OTHER, NONE.
      campaign_sales_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Values are BILLABLE and BONUS; BONUS rows are non-billable and skew any cost ratio.
      campaign_source: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_start_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_status:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Values are ENDED, RUNNING, ENABLED, PAUSED, ADS_NOT_RUNNING.
      city_name: { type: STRING, kind: DIMENSION, threshold: HIGH }
      click_cost:
