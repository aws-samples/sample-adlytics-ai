      creative_duration:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: NULL on non-video creative formats.
      creative_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      creative_is_link_in:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: A STRING holding Y or N, not a BOOLEAN, despite the page calling it a boolean field.
      creative_size: { type: STRING, kind: DIMENSION, threshold: LOW }
      creative_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      demand_channel_owner:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Present without the companion demand_channel column that dsp_clicks and dsp_impressions carry.
      device_make:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Page warns capitalisation varies for one manufacturer, so normalise before grouping.
      device_model:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Page warns capitalisation varies for one manufacturer, so normalise before grouping.
      entity_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      environment_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Values are Web, App, and NULL; NULL means the environment could not be determined.
      household_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Page states coverage begins 2026-04-10 and varies by region, so earlier windows have none.
          A user moving household gets a different ID.
      household_size:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: A STRING with buckets 1, 2, 3, 4+ and NULL, so it will not cast to a number.
      event_date:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        note: >
          Page says this and the rest of the event_* family populate for conversion events attributed
          to an ad view, wording that does not fit a view-event table; population semantics unconfirmed.
      event_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      event_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: MEDIUM }
      event_dt_hour: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      event_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      event_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: MEDIUM }
      event_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Values observed on a live instance 2026-08-21: MEASURABLE_IMP, VIEW, SYNTHETIC_VIEW.
          VIEWABLE_IMP does NOT exist — amc.md section 3 recorded it and was wrong, so a filter
          on that literal matches nothing and returns zero rows rather than erroring. The page's
          fourth value, UNMEASURABLE_IMP, did not appear in this data; absent here is not proof it
          does not exist, so do not filter on its absence either.
          Read viewability from the viewable_impressions column, never by filtering this one.
          Only a live-instance probe settles it.
        note: >
          Sum measurable_impressions for MEASURABLE_IMP, viewable_impressions for the viewable value,
          and unmeasurable_viewable_impressions for the two estimated kinds.
      events:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Always 1, and one impression can contribute several rows, so this is not an impression count.
      impression_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Carries the value that dsp_impressions and dsp_clicks expose as request_tag, and all view
          rows for one impression share it. Page warns duplicates occur, so prefer UNION ALL or
          user_id over joining on it.
      ip_address: { type: STRING, kind: DIMENSION, threshold: VERY_HIGH }
      line_item:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Line-item name, the DSP counterpart of ad_group on sponsored_ads_traffic; align the two
          when unioning platforms.
      line_item_end_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_end_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      line_item_price_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item_start_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_start_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_status:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Values are ENDED, ENABLED, RUNNING, PAUSED_BY_USER, SUSPENDED.
      line_item_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      manager_account_frequency_group_ids:
        type: "Array[LONG]"
        kind: DIMENSION
        threshold: LOW
        note: Array valued; one impression can sit in several frequency groups, so unnest before counting.
      measurable_impressions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: A 1 or 0 flag on the row, set when the row is the measurable event for an impression.
      merchant_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      operating_system: { type: STRING, kind: DIMENSION, threshold: LOW }
      os_version: { type: STRING, kind: DIMENSION, threshold: LOW }
      page_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      publisher_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      seller_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      seller_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      site: { type: STRING, kind: DIMENSION, threshold: LOW }
      slot_position:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Values are ATF, BTF, UNKNOWN.
      supply_source_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: Present without the companion supply_source name column that dsp_clicks and dsp_impressions carry.
      unmeasurable_viewable_impressions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: A 1 or 0 flag covering both the unmeasurable-viewable and synthetic-view kinds, which are estimated.
      user_id: { type: STRING, kind: DIMENSION, threshold: VERY_HIGH }
      user_id_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Values are adUserId, sisDeviceId, adBrowserId and NULL; NULL here pairs with a NULL
          user_id on the same row.
      view_definition:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Populated only on viewable rows; NULL on measurable, unmeasurable and synthetic rows.
      viewable_impressions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          A 1 or 0 flag on the row. Page states a viewable impression also has a measurable row, so
          this and measurable_impressions never both apply to the same row.
  dsp_video_events_feed:
    source_page: datasources/dsp_video_events_feed.md
    verified: 2026-08-19
    grain: One row per Amazon DSP impression, carrying the video-player events triggered for that impression.
    audience_twin: dsp_video_events_feed_for_audiences
    # The page documents ONLY the video columns added on top of dsp_impressions, so the
    # `columns` block below is a delta, not the table's full surface. A gate resolving a
    # contract column against this table must union in dsp_impressions or it rejects
    # user_id, impression_dt_utc, total_cost and 105 other legitimate columns. The
    # inherited set brings both money scales with it.
    inherits_columns_from: dsp_impressions
    notes: >
      The page lists only the columns added on top of dsp_impressions, so the whole dsp_impressions
      column set also resolves against this table; an allowlist built from this page alone rejects
      every base column.
      Docs carry an explicit warning that workflows on this table time out over extended periods,
      so date windows must be chunked.
      Every column here is a per-impression 1 or 0 flag typed LONG, and all are 0 on non-video
      impressions.
      The page writes the column type as Metric rather than METRIC; normalised to METRIC here to
      match the other DSP tables.
    columns:
      video_click:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          Page labels this video clicks but then describes the 1 case as the video being viewed to
          completion, which is the video_complete wording; the trigger is unconfirmed.
      video_complete: { type: LONG, kind: METRIC, threshold: NONE }
      video_creative_view:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Counts an extra ad element such as a companion ad or VPAID overlay, not the video itself.
      video_first_quartile: { type: LONG, kind: METRIC, threshold: NONE }
      video_impression:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: First frame shown, so it is narrower than the impressions column on dsp_impressions.
      video_midpoint: { type: LONG, kind: METRIC, threshold: NONE }
      video_mute: { type: LONG, kind: METRIC, threshold: NONE }
      video_pause: { type: LONG, kind: METRIC, threshold: NONE }
      video_replay: { type: LONG, kind: METRIC, threshold: NONE }
      video_resume: { type: LONG, kind: METRIC, threshold: NONE }
      video_skip_backward: { type: LONG, kind: METRIC, threshold: NONE }
      video_skip_forward: { type: LONG, kind: METRIC, threshold: NONE }
      video_start: { type: LONG, kind: METRIC, threshold: NONE }
      video_third_quartile: { type: LONG, kind: METRIC, threshold: NONE }
      video_unmute: { type: LONG, kind: METRIC, threshold: NONE }
  conversions:
    source_page: datasources/conversions.md
    verified: 2026-08-19
    columns_rechecked: 2026-10-08
    grain: One row per ad-attributed or pixel conversion event; conversion_id is unique per row.
    audience_twin: conversions_for_audiences
    notes: >
      Ad-attributed means a traffic event served to the same user in the 28 days
      before the conversion; the table holds only ad-attributed and pixel events,
      so it cannot separate organic. It carries no campaign or advertiser column
      at all, so per-campaign attribution needs conversions_with_relevance. Time
      columns are UTC-only here, with no advertiser-timezone variants and no
      advertiser_timezone column.
    columns:
      combined_sales:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: On-Amazon plus off-Amazon sales already in local currency; never apply a cost divisor.
      conversion_event_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      conversion_event_source_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      conversion_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Unique per row on this table but repeats on conversions_with_relevance; never output.
          VERIFIED 2026-08-29 on Sandbox and Standard with aggregation controls on: it can group
          inside a CTE and support privacy-safe aggregate temporal attribution without appearing
          in final output. Evidence: docs/sources/amc.md deduplicated temporal attribution.
      conversions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Always holds 1, so a conversion total is a SUM of this column or a row count.
      event_category:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [purchase, website, off-Amazon]
        note: Must be filtered to purchase before tracked_asin is treated as an ASIN.
      event_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      event_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      event_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: The only MEDIUM column on the table; selecting it needs 100 distinct users where the date and hour variants need 2.
      event_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_subtype:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [detailPageView, shoppingCart, order, searchConversion, brandStorePageView, wishList, babyRegistry, weddingRegistry, customerReview]
        note: On-Amazon events use the words listed; off-Amazon events instead carry numeric identifiers such as 134, 140, 141.
      event_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Constant CONVERSION on this table, so it carries no information and cannot discriminate anything.
      event_type_class:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [consideration, conversion, "NULL"]
        note: Documented as nullable, so treat a missing value as unclassified rather than as an error.
      event_type_description: { type: STRING, kind: DIMENSION, threshold: LOW }
      ip_address:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: NULL when no address was received; usable only inside a CTE, never in a final SELECT.
      marketplace_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      new_to_brand:
        type: BOOLEAN
        kind: DIMENSION
        threshold: LOW
        note: Applies to purchase events only and uses a 12-month no-prior-purchase lookback.
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      off_amazon_conversion_value:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        note: Explicitly a non-monetary value for non-purchase events, so it must never be added to revenue.
      off_amazon_product_sales:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: Advertiser-supplied purchase value from Conversion Builder, already in local currency.
      purchase_currency:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The currency for every monetary column here; AMC provides no FX, so no amount may be stored bare.
      purchase_retail_program:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [Amazon.com, Amazon Fresh, Whole Foods Market]
        note: Present on this table but absent from conversions_with_relevance, so it cannot be carried across a union of the two.
      purchase_unit_price:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: Price of one unit, not the line total, so it must not be summed as revenue.
      total_product_sales:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          On-Amazon purchase revenue in local currency; no divisor applies. VERIFIED 2026-08-29
          on Sandbox and Standard: currency-scoped first-touch, last-touch, and equal-linear
          allocation each reconciled to the unique portfolio amount. This column is halo-inclusive
          and cannot stand in for advertised-product-only product_sales.
      total_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      tracked_asin:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: NULL unless event_category is purchase, and it includes same-brand halo ASINs rather than only promoted ones.
      tracked_item:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Polymorphic across ASIN, brand store ID, branded search keyword and off-Amazon conversion-definition ID; matches tracked_asin only on purchase events.
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: NULL when Amazon cannot resolve an identifier; usable only inside a CTE, never in a final SELECT.
      user_id_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [adUserId, sisDeviceId, adBrowserId, "NULL"]
        note: Goes NULL on exactly the rows where user_id is NULL, so it identifies which ID space a row belongs to.
  conversions_with_relevance:
    source_page: datasources/conversions_with_relevance.md
    verified: 2026-08-19
    grain: One row per conversion event per relevant campaign, engagement scope and brand halo type, so a single conversion fans out across rows.
    audience_twin: conversions_with_relevance_for_audiences
    notes: >
      This is the multi-touch table and the only one of the conversion family
      carrying campaign columns. Because a conversion repeats per relevant
      campaign, summing conversions or total_product_sales across campaigns
      double-counts; dedupe on conversion_id inside a CTE first. Only
      ad-attributed and pixel events are present, so organic is not separable
      here. Unlike conversions, this table carries both UTC and
      advertiser-timezone time columns; never mix the two in one query.
    columns:
      advertiser:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      advertiser_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      advertiser_timezone:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Names the zone the non-UTC time columns are expressed in, so it must travel with them.
      campaign:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      campaign_budget_amount:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: Stated as millicents on the page and typed as a dimension rather than a metric, so it needs dividing before display and must not be aggregated as a measure.
      campaign_end_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      campaign_end_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      campaign_end_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_end_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: Holds DSP campaign IDs only; the page directs sponsored-ads IDs to campaign_id_string, so joining on this drops sponsored-ads rows silently.
      campaign_id_string:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The page explicitly recommends this over campaign_id because it covers both DSP and sponsored ads; use it as the join key to campaign metadata.
      campaign_sales_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_source: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_start_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      campaign_start_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      campaign_start_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_start_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      combined_sales:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: On-Amazon plus off-Amazon sales already in local currency; never apply a cost divisor.
      conversion_event_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      conversion_event_source_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      conversion_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Repeats on this table once per relevant campaign, engagement scope or halo type, unlike
          conversions where it is unique; never output. VERIFIED 2026-08-29 on Sandbox and
          Standard: conversion_id can group inside a CTE and collapse the relevance fan-out to
          aggregate counts. This proves structural deduplication, not temporal touch order.
      conversions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Described here only as a conversion count, without the always-1 wording the conversions page carries; because rows fan out, summing it across campaigns overstates conversions.
      engagement_scope:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [PROMOTED, BRAND_HALO, "NULL"]
        note: Separates promoted from brand-halo relevance and is the switch for halo-inclusive versus promoted-only measurement; always PROMOTED on pixel events.
      event_category:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [purchase, website, pixel]
        note: Must be filtered to purchase before tracked_asin is treated as an ASIN; search conversions land under website, and off-Amazon events read pixel here where the conversions page reads off-Amazon.
      event_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      event_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      event_day: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Needs 100 distinct users where the date and hour variants need 2; prefer event_date to avoid dropped rows.
      event_dt_hour: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      event_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      event_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Needs 100 distinct users where the date and hour variants need 2; prefer event_date_utc to avoid dropped rows.
      event_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_subtype:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [detailPageView, shoppingCart, order, searchConversion, brandStorePageView, wishList, babyRegistry, weddingRegistry, customerReview]
        note: On-Amazon events use the words listed; off-Amazon events instead carry numeric identifiers such as 134, 140, 141.
      event_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Constant CONVERSION on this table, so it carries no information and cannot discriminate anything.
      event_type_class:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Blank on pixel conversions and on search conversions, so absence is expected rather than a data fault.
      event_type_description:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Blank on search conversions, and on pixel conversions carries advertiser-defined setup text whose meaning must be confirmed with whoever configured the campaign.
      halo_code:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [TRACKED_ASIN, VARIATIONAL_ASIN, BRAND_KEYWORD, CATEGORY_KEYWORD, BRAND_MARKETPLACE, BRAND_GL_PRODUCT, BRAND_CATEGORY, BRAND_SUBCATEGORY, "NULL"]
        note: Classifies how a conversion relates to the campaign, so VARIATIONAL_ASIN marks a variation relationship and is not a parent ASIN or any product identifier; NULL on pixel conversions.
      ip_address:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: NULL when no address was received; usable only inside a CTE, never in a final SELECT.
      marketplace_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      new_to_brand: { type: BOOLEAN, kind: DIMENSION, threshold: LOW }
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      off_amazon_conversion_value:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        note: Explicitly a non-monetary value for non-purchase events, so it must never be added to revenue.
      off_amazon_product_sales:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: Advertiser-supplied purchase value from Conversion Builder, already in local currency.
      purchase_currency:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The currency for every monetary column here; AMC provides no FX, so no amount may be stored bare.
      purchase_unit_price:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: Price of one unit, not the line total, so it must not be summed as revenue.
      total_product_sales:
        type: DECIMAL(38,4)
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: Covers promoted and same-brand halo ASINs together, so it is halo-inclusive revenue unless engagement_scope is filtered.
      total_units_sold:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Halo-inclusive like total_product_sales, and a single purchase event can carry several units.
      tracked_asin:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Populated only when event_category is purchase, and it includes same-brand halo ASINs rather than only promoted ones.
      tracked_item:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Polymorphic across ASIN, brand store ID, branded search keyword and off-Amazon conversion-definition ID; matches tracked_asin only on purchase events.
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: Usable only inside a CTE, never in a final SELECT.
      user_id_type: { type: STRING, kind: DIMENSION, threshold: LOW }
  conversions_all:
    source_page: datasources/conversions_all_paid.md
    verified: 2026-08-19
    columns_rechecked: 2026-10-08
    grain: One row per conversion event for tracked ASINs, covering both ad-exposed and non-ad-exposed events.
    audience_twin: conversions_all_for_audiences
    paid_feature: true
    notes: >
      The page slug is conversions_all_paid, not conversions_all; the table-named
      URL 404s. Measurement queries need a paid subscription but the audience twin
      does not. This is the only conversion table containing non-ad-exposed events,
      so exposure_type is the sole route to organic versus ad-attributed. It has no
      campaign or advertiser column, no advertiser-timezone time columns, no
      user_id_type and no no_3p_trackers, so it cannot be unioned column-for-column
      with the other two conversion tables. The page writes some kind values as
      Dimension rather than DIMENSION; recorded verbatim, and a consumer comparing
      kind strings must fold case.
    columns:
      conversion_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: Usable only inside a CTE, never in a final SELECT.
      conversions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Described only as a conversion count here, without the always-1 wording the conversions page carries.
      event_category:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [purchase, website, pixel]
        note: Must be filtered to purchase before tracked_asin is treated as an ASIN; search conversions land under website.
      event_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      event_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      event_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: The only MEDIUM column on the table; selecting it needs 100 distinct users where the date and hour variants need 2.
      event_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_subtype:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [alexaSkillEnable, babyRegistry, customerReview, detailPageView, order, shoppingCart, snsSubscription, weddingRegistry, wishList, searchConversion]
        note: Lists alexaSkillEnable and snsSubscription which the other two conversion pages omit; pixel events carry a numeric identifier instead.
      event_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      event_type_class:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Blank on pixel conversions and on search conversions, so absence is expected rather than a data fault.
      event_type_description:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Blank on search conversions, and on pixel conversions carries advertiser-defined setup text whose meaning must be confirmed with whoever configured the campaign.
      exposure_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        values: [ad-exposed, non-ad-exposed, pixel]
        live:
          - instance: STANDARD
            date: 2026-10-08
            outcome: resolves
            scope: >
              Read alone with controls on, populated. The table's other columns were not read.
            source: validation/RESULTS.md#paid-feature-presence-and-forced-suppression--2026-10-08
        note: The organic split. A purchase or website event is ad-exposed when a traffic event preceded it within 28 days, otherwise non-ad-exposed; pixel events always read pixel, so they are neither and must be excluded from an organic-versus-ad comparison.
      ip_address:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: NULL when no address was received; usable only inside a CTE, never in a final SELECT.
      marketplace_id:
        type: INTEGER
        kind: Dimension
        threshold: INTERNAL
        note: INTERNAL, so it can never be selected or filtered; use marketplace_name instead.
      marketplace_name: { type: STRING, kind: Dimension, threshold: LOW }
      new_to_brand: { type: BOOLEAN, kind: DIMENSION, threshold: LOW }
      purchase_currency:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The currency for every monetary column here; AMC provides no FX, so no amount may be stored bare.
      purchase_unit_price:
        type: DecimalDataType
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: Type is written DecimalDataType on this page where the sibling pages write DECIMAL(38,4); read as a local-currency decimal with no divisor. Price of one unit, not the line total.
      sns_subscription_id:
        type: STRING
        kind: DIMENSION
        threshold: INTERNAL
        note: INTERNAL, so subscribe-and-save cohorts cannot be built from it even inside a CTE.
      total_product_sales:
        type: DecimalDataType
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: Type is written DecimalDataType on this page where the sibling pages write DECIMAL(38,4); read as a local-currency decimal with no divisor. Halo-inclusive, covering promoted and same-brand ASINs.
      total_units_sold:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Halo-inclusive like total_product_sales, and a single purchase event can carry several units.
      tracked_asin:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Populated only when event_category is purchase, and it includes same-brand halo ASINs rather than only promoted ones.
      tracked_item:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Polymorphic across ASIN, pixel ID, branded search keyword and app; matches tracked_asin only on purchase events.
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: Usable only inside a CTE, never in a final SELECT. This table has no user_id_type, so the ID space of a row cannot be identified here.
      conversion_event_source:
        type: STRING
        kind: Dimension
        threshold: LOW
        note: Named conversion_event_source here but conversion_event_source_name on the other two conversion tables; easily confused across a union.
      conversion_event_name: { type: STRING, kind: Dimension, threshold: LOW }
      off_amazon_product_sales:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: unresolved
        scale_divisor: null
        status: disputed
        dispute: >
          This page types the column LONG, while the conversions and
          conversions_with_relevance pages type the same column DECIMAL(38,4) and
          amc.md section 6 lists it as needing no divisor. An integer monetary
          column in AMC usually means a scaled integer, so applying no divisor
          could be wrong by five orders of magnitude. Only a probe against a live
          instance settles the scale.
      off_amazon_conversion_value:
        type: LONG
        kind: METRIC
        threshold: NONE
        status: disputed
        dispute: >
          This page types the column LONG and calls its value unitless and
          advertiser-defined, while the sibling pages type it DECIMAL(38,4). It is
          not currency either way and must never be added to revenue, but the type
          disagreement is unresolved and only a live-instance probe settles it.
      combined_sales:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: unresolved
        scale_divisor: null
        status: disputed
        dispute: >
          This page types the column LONG, yet defines it as the sum of
          total_product_sales, which the same page types as a decimal. The sibling
          pages type combined_sales DECIMAL(38,4) and amc.md section 6 lists it as
          needing no divisor. The page contradicts itself, so the scale is
          unresolved and only a live-instance probe settles it.
  amazon_attributed_events_by_conversion_time:
    source_page: datasources/amazon_attributed_events_by_conversion_time.md
    verified: 2026-08-19
    columns_rechecked: 2026-10-08
    grain: one row per attributed conversion event paired with the single traffic event it is credited to
    audience_twin: amazon_attributed_events_by_conversion_time_for_audiences
    notes: >
      No spend column exists here: click_cost, supply_cost, audience_fee,
      platform_fee and bid_price are the only cost columns, so ROAS must be
      assembled by UNION ALL against a traffic table at a shared aggregate grain.
      Conversions fall inside the query window while the traffic they are
      attributed to may sit up to 14 days earlier, so impression_* and click_*
      dates can precede the window.
      ad_product_type NULL means Amazon DSP, so an unfiltered query mixes display
      into sponsored-ads numbers.
      Modeled conversions are present and every grain below ad line is NULL for
      them; user_id IS NULL does not identify them.
    columns:
      ad_product_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          NULL means Amazon DSP on this table, not unknown. Filtering on it is
          mandatory before any sponsored-ads figure is reported.
      ad_slot_size:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          The ad slot on the page, populated for Amazon DSP. Easily confused with
          creative_size, which describes the ad itself rather than the slot.
      add_to_cart: { type: LONG, kind: METRIC, threshold: NONE }
      add_to_cart_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      add_to_cart_views: { type: LONG, kind: METRIC, threshold: NONE }
      advertiser:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      advertiser_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: Populated for Amazon DSP events only; NULL for sponsored ads is not unknown.
      advertiser_timezone:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Required to interpret every non-_utc time column on this table. Carry it
          onto every fact as source_timezone.
      appstore_first_opens: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_first_opens_clicks: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_first_opens_views: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_first_session_hours: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_first_session_hours_clicks: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_first_session_hours_views: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_opens: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_opens_clicks: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_opens_views: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_repeat_opens: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_repeat_opens_clicks: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_repeat_opens_views: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_repeat_session_hours: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_repeat_session_hours_clicks: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_repeat_session_hours_views: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_usage_hours:
        type: "DECIMAL(38,2)"
        kind: METRIC
        threshold: NONE
        note: Hours, not money. Equals the first-session plus repeat-session hours.
      appstore_usage_hours_clicks: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_usage_hours_views: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      audience_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
