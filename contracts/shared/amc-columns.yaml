      line_item_budget_amount:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: Millicents, unlike the microcent fee columns on this table. A budget, not spend.
      line_item_end_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: NULL for sponsored ads events, meaning not-applicable rather than missing.
      line_item_start_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_status: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      match_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: NULL for media that is not keyword-targeted, which is not an unknown match type.
      new_to_brand:
        type: BOOLEAN
        kind: DIMENSION
        threshold: LOW
        note: >
          A dimension, separate from the new_to_brand_* metric family. Applies only
          to purchase events, and rests on a 12-month no-prior-purchase lookback.
      new_to_brand_brand_halo_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. 12-month NTB lookback, and halo
          scope, so it is a subset of brand_halo_product_sales.
      new_to_brand_brand_halo_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_brand_halo_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_brand_halo_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. 12-month NTB lookback; a subset of
          product_sales, so it must not be added to it.
      new_to_brand_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Promoted plus halo for NTB
          customers on a 12-month lookback.
      new_to_brand_total_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_total_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_total_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      off_amazon_conversion_value:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        note: >
          NOT money. An advertiser-assigned weight for non-purchase off-Amazon
          events, so it must never be summed into revenue or divided by a scale.
      off_amazon_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Populated only where an Events
          Manager solution passes a sales value, so 0 and absent are not distinguishable.
      operating_system: { type: STRING, kind: DIMENSION, threshold: LOW }
      os_version: { type: STRING, kind: DIMENSION, threshold: LOW }
      page_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      placement_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      platform_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          Microcents, 1000x finer than the millicent columns here. Derived as a
          percentage of supply_cost, so it is not independent of it.
      postal_code:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: >
          HIGH, so literal filters on it are rejected and it needs 100 distinct users
          per row. Prefixed with the country code, and country-only when the postal
          code is unknown, so length varies.
      product_line:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Amazon's campaign categorisation, NOT a merchant brand. AMC never names the
          brand anywhere on this table.
      product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Applying a cost divisor here is a
          5-to-8 order-of-magnitude error in every ROAS numerator. Promoted ASINs only.
      product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      purchase_currency:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          The currency of every sales column here. AMC provides no FX, so never store
          a sales amount without it.
      purchase_retail_program: { type: STRING, kind: DIMENSION, threshold: LOW }
      purchase_unit_price:
        type: DECIMAL
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Typed as bare DECIMAL with no
          declared precision, unlike the DECIMAL(38,4) sales columns. Per unit, not
          per order, so it is not product_sales divided by units_sold.
      purchases: { type: LONG, kind: METRIC, threshold: NONE }
      purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      request_tag:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Never outputtable, and the page warns duplicates occur so it is not a safe
          JOIN key. Prefer UNION ALL, or user_id inside a CTE.
      site: { type: STRING, kind: DIMENSION, threshold: LOW }
      supply_cost:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          Microcents, 1000x finer than the millicent columns here. What Amazon DSP
          pays a publisher, so it excludes the fee columns and is not total spend.
      supply_source: { type: STRING, kind: DIMENSION, threshold: LOW }
      targeting:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The advertiser's keyword, distinct from the shopper text in customer_search_term.
      total_add_to_cart: { type: LONG, kind: METRIC, threshold: NONE }
      total_add_to_cart_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      total_add_to_cart_views: { type: LONG, kind: METRIC, threshold: NONE }
      total_detail_page_view: { type: LONG, kind: METRIC, threshold: NONE }
      total_detail_page_view_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      total_detail_page_view_views: { type: LONG, kind: METRIC, threshold: NONE }
      total_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Equals product_sales plus
          brand_halo_product_sales, so adding any of the three together double-counts.
      total_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      total_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      total_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      total_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      total_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      total_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      total_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      total_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      tracked_asin:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Populated only for on-Amazon purchase events; NULL elsewhere is
          not-applicable. Includes same-brand halo products, so it is not a list of
          advertised ASINs. It is a child ASIN; AMC has no parent ASIN here.
      tracked_item:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        do_not_model: true
        note: >
          Polymorphic: an ASIN, a brand store ID, a branded-search keyword, or an
          off-Amazon conversion-definition ID depending on event subtype. Never join
          it to an ASIN without first filtering to purchase events.
      traffic_event_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      traffic_event_date_utc:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: >
          On this table the traffic side is the lagging side and may fall up to 14
          days before the query window.
      traffic_event_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      traffic_event_dt_hour:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: The hourly grain that does not escalate. Never truncate traffic_event_dt instead.
      traffic_event_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      traffic_event_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      traffic_event_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      traffic_event_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      traffic_event_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Join key to sponsored_ads_traffic.event_id, and the documented route from
          attributed conversions back to traffic. VERY_HIGH, so the join must happen
          inside a CTE and the key can never reach output. Sponsored ads only.
      traffic_event_marketplace_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Where the traffic happened, and can differ from
          conversion_event_marketplace_name on the same row, so one row can span two
          marketplaces and neither column alone is a row-level marketplace.
      traffic_event_subtype:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: AD_IMP or AD_CLICK. The dimension form of the clicks and impressions flags.
      traffic_event_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      units_sold:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          Can exceed 1 on a single purchase row, unlike purchases, so the two are not
          interchangeable counts.
      units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          CTE use only, never in output. NULL when Amazon cannot resolve an
          identifier, which is neither a distinct user nor a modeled conversion.
      user_id_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          adUserId, sisDeviceId, adBrowserId or NULL. Mixes ID spaces, so a distinct
          count spans accounts, devices and browsers rather than people.
  amazon_retail_purchases:
    source_page: datasources/amazon_retail_purchase_paid.md
    verified: 2026-08-19
    columns_rechecked: 2026-10-08
    paid_feature: true
    grain: One row per retail purchase item event; event_id is unique per row.
    audience_twin: amazon_retail_purchase_for_audiences
    live:
      - instance: STANDARD
        date: 2026-10-08
        outcome: resolves
        scope: >
          purchase_date_utc, asin, marketplace_name, purchase_units_sold, currency_code,
          unit_price, purchase_id, user_id and user_id_type read with controls on; the
          September 2026 month held no purchase rows. The other columns were not read.
        source: validation/RESULTS.md#paid-feature-presence-and-forced-suppression--2026-10-08
    notes: >
      The page's schema table has no Metric/Dimension column, so kind is left
      unset here rather than guessed for any column.
      Page lists 26 columns.
      Time columns are UTC-only: no advertiser-timezone twins and no
      advertiser_timezone column, unlike the traffic tables.
      No revenue or order-total column, so any sales figure must be derived
      from unit_price times purchase_units_sold.
    columns:
      asin:
        type: STRING
        threshold: LOW
        note: "Child ASIN of the retail event; asin_parent carries the rollup key."
      asin_brand:
        type: STRING
        threshold: LOW
        note: "Merchant brand name of the item; amc.md records this as the only AMC source of one."
      asin_name: { type: STRING, threshold: LOW }
      asin_parent:
        type: STRING
        threshold: LOW
        note: "Parent ASIN for variation rollups; amc.md records ARP as the only AMC table carrying it."
      currency_code:
        type: STRING
        threshold: LOW
        note: "ISO code governing unit_price; AMC supplies no FX, so never store the amount without it."
      event_id:
        type: STRING
        threshold: VERY_HIGH
        note: "Row key; many event_id values map to one purchase_id. VERY_HIGH, so usable only inside a CTE."
      is_business_flag: { type: BOOLEAN, threshold: LOW }
      is_gift_flag: { type: BOOLEAN, threshold: LOW }
      marketplace_id:
        type: INTEGER
        threshold: INTERNAL
        note: "INTERNAL: unusable anywhere in a query. Use marketplace_name instead."
      marketplace_name:
        type: STRING
        threshold: LOW
        note: "Usable marketplace dimension; values take the AMAZON.COM form, not the amazon.us form used by amazon_live_traffic.site."
      no_3p_trackers: { type: BOOLEAN, threshold: NONE }
      origin_session_id:
        type: STRING
        threshold: VERY_HIGH
        note: "Session in which the item was added to cart, not the one it was bought in; do not confuse with purchase_session_id."
      purchase_date_utc:
        type: DATE
        threshold: LOW
        note: "The only date-typed column; purchase_day_utc, purchase_hour_utc and purchase_month_utc are calendar-part integers, not dates."
      purchase_day_utc: { type: INTEGER, threshold: LOW }
      purchase_dt_hour_utc:
        type: TIMESTAMP
        threshold: LOW
        note: "Hour-truncated timestamp at LOW, unlike full-precision purchase_dt_utc at MEDIUM; prefer this one in output."
      purchase_dt_utc:
        type: TIMESTAMP
        threshold: MEDIUM
        note: "MEDIUM requires 100 distinct users, so selecting it in final output drops far more rows than the date or hour variants."
      purchase_hour_utc: { type: INTEGER, threshold: LOW }
      purchase_id:
        type: STRING
        threshold: VERY_HIGH
        note: "Order-level key, one-to-many against event_id; VERY_HIGH, so usable only inside a CTE."
      purchase_month_utc: { type: INTEGER, threshold: LOW }
      purchase_order_method:
        type: STRING
        threshold: LOW
        note: "Single-character coded enum (S, B, 1); code must map it before anything is displayed."
      purchase_program_name: { type: STRING, threshold: LOW }
      purchase_session_id:
        type: STRING
        threshold: VERY_HIGH
        note: "Session in which the item was bought; do not confuse with origin_session_id."
      purchase_units_sold:
        type: LONG
        threshold: NONE
        note: "One row can carry several units, so unit totals need SUM rather than a row count."
      unit_price:
        type: DECIMAL
        threshold: NONE
        monetary: true
        scale: none
        scale_divisor: 1
        note: "Per-unit price. The page states no scale factor and the type is DECIMAL rather than a scaled integer; amc.md files this concept under the name purchase_unit_price."
      user_id:
        type: STRING
        threshold: VERY_HIGH
        note: "VERY_HIGH: usable inside a CTE for distinct counts, never in final output."
      user_id_type:
        type: STRING
        threshold: LOW
        note: "Page states adUserId is the only value on this table, so there is no device or browser ID space to filter out here."
  amazon_live_traffic:
    source_page: datasources/amazon_live_traffic.md
    verified: 2026-08-19
    grain: One row per Amazon Live product carousel ad event, being a single impression, click or view.
    audience_twin: amazon_live_traffic_for_audiences
    notes: >
      Managed-service Amazon Live media in the US market only, from
      2025-05-01; the signal connection must be arranged with an Amazon Ads
      representative.
      Three columns begin later than the table itself does; see their notes.
      No monetary column of any kind, so spend and ROAS must be sourced from
      the dsp_* or attributed-events tables.
    columns:
      ad_product_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        status: disputed
        dispute: >
          The page states this column always holds amazon_live here, and tells
          you to filter amazon_attributed_events_* on
          ad_product_type = amazon_live. amc.md section 4 gives a closed set of
          four values (sponsored_products, sponsored_brands, sponsored_display,
          sponsored_television) plus NULL for DSP, which omits amazon_live
          entirely; a gate built on that set would reject every Amazon Live
          row. Only a live-instance probe settles the full enumeration.
      advertiser:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      broadcast_date_utc:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        note: "Date the broadcast first aired, which is not the event date: playback and on-demand events carry a later event_date_utc."
      broadcast_id:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: "Populated only for broadcasts dated 2025-05-09 or later; stable across the livestream and its playback events, so it is the key for grouping a video."
      broadcast_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: "Populated only for broadcasts dated after 2025-05-01, so expect NULL on the earliest rows."
      clicks:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: "Per-row flag of 1 or 0, not a count, because each row is exactly one event type; SUM it."
      creative_asin:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: "Populated only for broadcasts dated 2025-07-15 or later; this is the promoted ASIN inside the carousel."
      creative_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      event_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      event_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_dt_hour_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        note: "Hour-truncated timestamp at LOW, unlike full-precision event_dt_utc at MEDIUM; prefer this one in output."
      event_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: "MEDIUM requires 100 distinct users, so selecting it in final output drops far more rows than the date or hour variants."
      event_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: "Join key to traffic_event_id on the amazon_attributed_* tables; VERY_HIGH, so it can only be used inside a CTE."
      household_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: "Available only from 2026-04-10 onward with coverage varying by region; NULL when unresolvable, and CTE-only."
      household_size:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: "HIGH threshold, so it nulls rows below 1000 distinct users; typed STRING with NULL a documented value and the top bucket written 4+."
      impressions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: "Per-row flag of 1 or 0, not a count, because each row is exactly one event type; SUM it."
      site:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: "Retail domain in amazon.us form, which is the marketplace proxy on this table and does not match ARP's AMAZON.COM form."
      slot_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: "Device environment rather than an on-page position; values cover desktop web, mobile web, mobile app and Shop TV app."
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: "Mixes account, device and browser ID spaces; NULL when unresolvable, and CTE-only."
      user_id_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: "Discriminator for the user_id space; NULL on both columns together when no ID could be resolved."
      views:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: "Per-row flag of 1 or 0 for a carousel ad at least half in view for at least a second; SUM it."
  # Segment tables, transcribed 2026-10-08 (business-outcomes slice S0.6). Two pages cover
  # all of them: datasources/dsp_impressions_by_segments.md for the two DSP tables, and
  # datasources/audience_segment_membership_paid.md for the Audience Segment Insights (ASI)
  # tables and segment_metadata.
  dsp_impressions_by_matched_segments:
    source_page: datasources/dsp_impressions_by_segments.md
    verified: 2026-10-08
    grain: One row per DSP impression per segment that both included the user and was targeted by the line item.
    audience_twin: dsp_impressions_by_matched_segments_for_audiences
    # The page documents only the four segment columns added on top of dsp_impressions, the
    # same delta shape as dsp_video_events_feed, so the base surface resolves by inheritance.
    inherits_columns_from: dsp_impressions
    notes: >
      Each impression appears once per matching segment, so a SUM of impressions or of any
      inherited cost column over this table counts an impression once per segment; only a
      per-segment figure, or a distinct count, is meaningful here.
      The page warns that workflows on this table time out over extended periods.
    columns:
      behavior_segment_description: { type: STRING, kind: DIMENSION, threshold: LOW }
      behavior_segment_id:
        type: INTEGER
        kind: DIMENSION
        threshold: LOW
        note: >
          DSP behaviour segment ID. Not the ASI segment_id: P-BO-4 step 1 failed on both amer
          snapshot tables on the STANDARD demo instance, 2026-10-09 (validation/RESULTS.md), so
          the two namespaces stay separate.
      behavior_segment_matched:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: "Always 1 on this table, because it holds only targeted-and-matched segments."
      behavior_segment_name: { type: STRING, kind: DIMENSION, threshold: LOW }
  dsp_impressions_by_user_segments:
    source_page: datasources/dsp_impressions_by_segments.md
    verified: 2026-10-08
    grain: One row per DSP impression per segment the user belonged to at impression time, targeted or not.
    audience_twin: dsp_impressions_by_user_segments_for_audiences
    inherits_columns_from: dsp_impressions
    notes: >
      Same delta shape and the same once-per-segment repetition as
      dsp_impressions_by_matched_segments, over a wider segment set.
      The page warns that workflows on this table time out over extended periods.
    columns:
      behavior_segment_description: { type: STRING, kind: DIMENSION, threshold: LOW }
      behavior_segment_id: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      behavior_segment_matched:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: "1 when the line item targeted the segment, 0 when the user was only a member."
      behavior_segment_name: { type: STRING, kind: DIMENSION, threshold: LOW }
  # ASI membership: one region (amer, apac, eu) and one category (inmarket, lifestyle) per
  # table, each with a monthly _snapshot view. The page gives one schema for the whole
  # family, so the twelve entries share one column block through a YAML anchor rather than
  # twelve copies that could drift. The page says every table has an audience twin but
  # doesn't name them, so no audience_twin is recorded for these.
  audience_segments_amer_inmarket:
    source_page: datasources/audience_segment_membership_paid.md
    verified: 2026-10-08
    paid_feature: true
    grain: &asi_current_grain One row per current user-to-segment association, refreshed daily (a DIMENSION dataset).
    notes: &asi_membership_notes >
      Query one region and one category table per SQL query, and always filter on
      segment_marketplace_id; the page sets both as rules. segment_id is unique only within
      segment_marketplace_id, so every join to segment_metadata matches on both columns.
      The page warns that workflows on these tables time out over extended periods.
    columns: &asi_membership_columns
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      segment_id:
        type: INTEGER
        kind: DIMENSION
        threshold: LOW
        note: "Unique only within segment_marketplace_id, never on its own."
      segment_marketplace_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: >
          LONG here, while dsp_impressions types its segment_marketplace_id INTEGER. The
          governed value comes from the amc.segment_marketplace_id namespace in
          contracts/shared/commerce-identities.yaml, never a literal in a pack.
      segment_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      snapshot_datetime:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        note: "Typed DATE despite the name; the date the snapshot was taken."
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: "CTE-only, for distinct counts and the exposure fence; never in final output."
      user_id_type: { type: STRING, kind: DIMENSION, threshold: LOW }
  audience_segments_amer_lifestyle:
    source_page: datasources/audience_segment_membership_paid.md
    verified: 2026-10-08
