# Out of scope, recorded so nobody transcribes them by accident: amazon_pvc_*,
# amazon_your_garage_all, experian_vehicle_purchases. ncs_cpg_insights_stream is
# discontinued. Every *_for_audiences twin is a distinct namespace used only for
# audience creation and is never queried for measurement.

# Columns that must never be modelled, recorded here so the reason is not
# rediscovered. These are facts about AMC and are owned by docs/sources/amc.md.
do_not_model:
  winning_bid_cost:
    reason: >
      Absent from the dsp_impressions and attributed-events schema pages (re-read
      2026-10-08), yet the media-performance playbook selects it from dsp_impressions
      and amazon_attributed_events_by_traffic_time. AMC's own docs contradict each
      other and no page is dated. Only a live-instance probe settles it.
  tracked_item:
    reason: >
      Polymorphic — an ASIN, a brand store ID, a search keyword or an off-Amazon
      conversion-definition ID depending on event type. Never join it to an ASIN
      without filtering to purchase events first.
