      demand_channel: { type: STRING, kind: DIMENSION, threshold: LOW }
      demand_channel_owner: { type: STRING, kind: DIMENSION, threshold: LOW }
      device_id: { type: STRING, kind: DIMENSION, threshold: VERY_HIGH }
      device_make:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Page warns capitalisation varies for one manufacturer, so normalise before grouping.
      device_model:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Page warns capitalisation varies for one manufacturer, so normalise before grouping.
      device_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Values are Tablet, Phone, TV, PC, ConnectedDevice, Unknown, and NULL.
      dma_code: { type: STRING, kind: DIMENSION, threshold: LOW }
      entity_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      environment_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Values are Web, App, and NULL; NULL means the environment could not be determined.
      household_id:
