      campaign_flight_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: >
          Page states this holds the same value as campaign_id_string on this table. The two are
