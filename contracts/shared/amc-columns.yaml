        threshold: LOW
        note: Array valued; one impression can sit in several frequency groups, so unnest before counting.
      merchant_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      operating_system: { type: STRING, kind: DIMENSION, threshold: LOW }
      os_version: { type: STRING, kind: DIMENSION, threshold: LOW }
      page_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      platform_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: Page states microcents and gives the 100,000,000 divisor explicitly.
      postal_code:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: >
          Prefixed with the country code, and holds the country code alone when the postal code is
          unknown, so a two-character value is not a malformed row.
      product_line: { type: STRING, kind: DIMENSION, threshold: LOW }
      publisher_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      request_tag:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Links this click to the matching impression, view and conversion rows, appearing as
          impression_id on those tables. Page warns duplicates occur, so prefer UNION ALL or
          user_id over joining on it.
      seller_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      seller_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      site: { type: STRING, kind: DIMENSION, threshold: LOW }
      slot_position:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Values are ATF, BTF, UNKNOWN.
      supply_cost:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: Page states microcents and gives the 100,000,000 divisor explicitly.
      supply_source: { type: STRING, kind: DIMENSION, threshold: LOW }
      supply_source_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      user_id: { type: STRING, kind: DIMENSION, threshold: VERY_HIGH }
      user_id_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
