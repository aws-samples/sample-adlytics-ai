      impression_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: MEDIUM }
      impression_dt_hour: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      impression_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      impression_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: MEDIUM }
      impression_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
