        scale: local_currency
        scale_divisor: 1
      brand_halo_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      brand_halo_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      browser_family:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Describes the impression event, not the conversion event.
      campaign:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      campaign_budget_amount:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          Millicents, unlike the microcent fee columns on this same table. A budget,
          not delivered spend, so it can never substitute for cost.
      campaign_end_date:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        note: >
          TIMESTAMP despite the _date name, and documented identically to
          campaign_end_dt. Four near-duplicate variants exist; pick one and pin it.
      campaign_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_end_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_end_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_flight_budget_amount:
        type: LONG
        kind: METRIC
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          The page types this METRIC while the sibling budget columns are DIMENSION;
          recorded verbatim. LOW, so it does not escalate despite being a METRIC.
      campaign_flight_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_flight_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      campaign_flight_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_flight_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: >
          On Amazon DSP rows this matches campaign_id_string exactly. On sponsored
          ads rows it is the Ads API ID, a different identifier from the console ID
          in campaign_id_string, so joining on the wrong one drops rows silently.
      campaign_id_string:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: >
          Use this one. It is the ads-console ID for sponsored ads, and an 18-digit
          numeric campaign ID does not survive JSON integer precision.
      campaign_insertion_order_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_primary_goal: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_start_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_status: { type: STRING, kind: DIMENSION, threshold: LOW }
      city_name:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: >
          HIGH, so literal filters on it are rejected outright and it still needs
          100 distinct users per row. Amazon DSP events only.
      click_cost:
        type: LONG
        kind: METRIC
        threshold: MEDIUM
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          Millicents, unlike the microcent fee columns here. MEDIUM, so selecting it
          lifts the whole query to 100 distinct users per row. Not total spend.
      click_date:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        note: >
          Populated only for click-attributed conversions; NULL on view-attributed
          rows means not-applicable, not missing. Whole click_* family behaves so.
      click_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      click_day: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      click_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      click_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      click_dt_hour:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: The hourly grain that does not escalate. Never truncate click_dt instead.
      click_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      click_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      click_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      click_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      clicks:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          1 or 0 per conversion row, flagging click attribution. It is NOT the
          campaign's click count; summing it counts attributed conversions.
      combined_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Equals total_product_sales plus
          off_amazon_product_sales, so it double-counts if added to either.
      conversion_event_category:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          This is the column to filter on for purchase events. The page's
          tracked_asin description calls it event_category, which does not exist here.
      conversion_event_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      conversion_event_date_utc:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: >
          The window column for this table and the day grain that does not escalate.
          Prefer over conversion_event_dt_utc.
      conversion_event_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      conversion_event_dt_hour: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      conversion_event_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      conversion_event_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      conversion_event_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      conversion_event_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      conversion_event_marketplace_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Where the conversion happened, and can differ from
          traffic_event_marketplace_name on the same row. Includes physical retail
          values, so it is not a pure online-storefront dimension.
      conversion_event_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      conversion_event_source_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          NULL means the conversion happened on Amazon, not that the source is
          unknown. Filtering NULL out silently drops all on-Amazon conversions.
      conversion_event_subtype:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Mixed value space: human-readable strings for on-Amazon events, bare
          numeric codes for off-Amazon ones. Never pattern-match it as one domain.
      conversion_event_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      conversion_event_type_class: { type: STRING, kind: DIMENSION, threshold: LOW }
      conversion_event_type_description: { type: STRING, kind: DIMENSION, threshold: LOW }
      conversions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Always 1, so summing it counts rows selected rather than measuring anything.
      creative: { type: STRING, kind: DIMENSION, threshold: LOW }
      creative_category: { type: STRING, kind: DIMENSION, threshold: LOW }
      creative_duration:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: Seconds, and NULL for non-video formats rather than 0.
      creative_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      creative_is_link_in:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          STRING carrying Y or N, not a BOOLEAN despite the description calling it
          one. Do not cast it like new_to_brand or is_amazon_business.
      creative_size:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Describes the ad; ad_slot_size describes the slot it landed in.
      creative_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      customer_search_term:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          The shopper's typed text, distinct from the advertiser keyword in
          targeting. Sponsored Brands terms only exist from 2022-12-02.
      deal_id:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: NULL for open-auction traffic, meaning no private deal rather than unknown.
      deal_name:
        type: STRING
        kind: METRIC
        threshold: LOW
        note: >
          The page types this METRIC although it is a name; recorded verbatim. NULL
          for open-auction traffic.
      detail_page_view:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          Singular name while purchases and units_sold are plural, and the
          view-attributed sibling stacks to detail_page_view_views. Pin as a literal.
      detail_page_view_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      detail_page_view_views: { type: LONG, kind: METRIC, threshold: NONE }
      device_make:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Device manufacturer, never a merchant brand. Capitalisation varies for the
          same maker, so it needs normalising before grouping.
      device_model: { type: STRING, kind: DIMENSION, threshold: LOW }
      device_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      digital_app_subscription_signup_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      digital_app_subscription_signup_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      digital_app_subscription_signup_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      digital_free_trial_app_subscription_signup_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      digital_free_trial_app_subscription_signup_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      digital_free_trial_app_subscription_signup_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      digital_free_trial_subscription_signup_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      digital_free_trial_subscription_signup_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      digital_free_trial_subscription_signup_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      digital_paid_app_subscription_signup_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      digital_paid_app_subscription_signup_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      digital_paid_app_subscription_signup_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      digital_paid_subscription_signup_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      digital_paid_subscription_signup_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      digital_paid_subscription_signup_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      digital_subscription_signup_purchases:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          Free trial plus paid, so it overlaps the _free_trial_ and _paid_ variants.
          The app-scoped family is a separate overlapping set again.
      digital_subscription_signup_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      digital_subscription_signup_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      dma_code: { type: STRING, kind: DIMENSION, threshold: LOW }
      entity_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      environment_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: NULL means the environment could not be determined, not a third category.
      impression_date:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        note: >
          Populated only for view-attributed conversions; NULL on click-attributed
          rows means not-applicable. Can precede the query window by up to 14 days.
      impression_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      impression_day: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      impression_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      impression_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      impression_dt_hour:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: The hourly grain that does not escalate. Never truncate impression_dt instead.
      impression_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      impression_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      impression_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      impression_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      impressions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          1 or 0 per conversion row, flagging view attribution. It is NOT the
          campaign's impression count and must never feed a reach or CPM figure.
      is_amazon_business:
        type: BOOLEAN
        kind: DIMENSION
        threshold: LOW
        note: >
          Three-valued: true, false, and NULL for every ad product other than
          Sponsored Products and Sponsored Brands. NULL is unsupported-by-channel.
      iso_country_code: { type: STRING, kind: DIMENSION, threshold: LOW }
      iso_state_province_code: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Carries the ad group name on sponsored ads rows, so it is the same concept
          under a DSP name. Modeled conversions are NULL below ad line level.
      line_item_budget_amount:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: Millicents, unlike the microcent fee columns on this table. A budget, not spend.
      line_item_end_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: NULL for sponsored ads events, meaning not-applicable rather than missing.
      line_item_start_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_status: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      match_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: NULL for media that is not keyword-targeted, which is not an unknown match type.
      new_to_brand:
        type: BOOLEAN
        kind: DIMENSION
        threshold: LOW
        note: >
          A dimension, separate from the new_to_brand_* metric family. Applies only
          to purchase events, and rests on a 12-month no-prior-purchase lookback.
      new_to_brand_brand_halo_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. 12-month NTB lookback, and halo
          scope, so it is a subset of brand_halo_product_sales.
      new_to_brand_brand_halo_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_brand_halo_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_brand_halo_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_brand_halo_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. 12-month NTB lookback; a subset of
          product_sales, so it must not be added to it.
      new_to_brand_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Promoted plus halo for NTB
          customers on a 12-month lookback.
      new_to_brand_total_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_total_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      new_to_brand_total_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_total_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      new_to_brand_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      off_amazon_conversion_value:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        note: >
          NOT money. An advertiser-assigned weight for non-purchase off-Amazon
          events, so it must never be summed into revenue or divided by a scale.
      off_amazon_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Populated only where an Events
          Manager solution passes a sales value, so 0 and absent are not distinguishable.
      operating_system: { type: STRING, kind: DIMENSION, threshold: LOW }
      os_version: { type: STRING, kind: DIMENSION, threshold: LOW }
      page_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      placement_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      platform_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          Microcents, 1000x finer than the millicent columns here. Derived as a
          percentage of supply_cost, so it is not independent of it.
      postal_code:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: >
          HIGH, so literal filters on it are rejected and it needs 100 distinct users
          per row. Prefixed with the country code, and country-only when the postal
          code is unknown, so length varies.
      product_line:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Amazon's campaign categorisation, NOT a merchant brand. AMC never names the
          brand anywhere on this table.
      product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Applying a cost divisor here is a
          5-to-8 order-of-magnitude error in every ROAS numerator. Promoted ASINs only.
      product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      purchase_currency:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          The currency of every sales column here. AMC provides no FX, so never store
          a sales amount without it.
      purchase_retail_program: { type: STRING, kind: DIMENSION, threshold: LOW }
      purchase_unit_price:
        type: DECIMAL
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Typed as bare DECIMAL with no
          declared precision, unlike the DECIMAL(38,4) sales columns. Per unit, not
          per order, so it is not product_sales divided by units_sold.
      purchases: { type: LONG, kind: METRIC, threshold: NONE }
      purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      request_tag:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Never outputtable, and the page warns duplicates occur so it is not a safe
          JOIN key. Prefer UNION ALL, or user_id inside a CTE.
      site: { type: STRING, kind: DIMENSION, threshold: LOW }
      supply_cost:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          Microcents, 1000x finer than the millicent columns here. What Amazon DSP
          pays a publisher, so it excludes the fee columns and is not total spend.
      supply_source: { type: STRING, kind: DIMENSION, threshold: LOW }
      targeting:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The advertiser's keyword, distinct from the shopper text in customer_search_term.
      total_add_to_cart: { type: LONG, kind: METRIC, threshold: NONE }
      total_add_to_cart_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      total_add_to_cart_views: { type: LONG, kind: METRIC, threshold: NONE }
      total_detail_page_view: { type: LONG, kind: METRIC, threshold: NONE }
      total_detail_page_view_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      total_detail_page_view_views: { type: LONG, kind: METRIC, threshold: NONE }
      total_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Equals product_sales plus
          brand_halo_product_sales, so adding any of the three together double-counts.
      total_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      total_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      total_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      total_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      total_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      total_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      total_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      total_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      tracked_asin:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Populated only for on-Amazon purchase events; NULL elsewhere is
          not-applicable. Includes same-brand halo products, so it is not a list of
          advertised ASINs. It is a child ASIN; AMC has no parent ASIN here.
      tracked_item:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        do_not_model: true
        note: >
          Polymorphic: an ASIN, a brand store ID, a branded-search keyword, or an
          off-Amazon conversion-definition ID depending on event subtype. Never join
          it to an ASIN without first filtering to purchase events.
      traffic_event_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      traffic_event_date_utc:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: >
          On this table the traffic side is the lagging side and may fall up to 14
          days before the query window.
      traffic_event_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      traffic_event_dt_hour:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: The hourly grain that does not escalate. Never truncate traffic_event_dt instead.
      traffic_event_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      traffic_event_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      traffic_event_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      traffic_event_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      traffic_event_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Join key to sponsored_ads_traffic.event_id, and the documented route from
          attributed conversions back to traffic. VERY_HIGH, so the join must happen
          inside a CTE and the key can never reach output. Sponsored ads only.
      traffic_event_marketplace_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Where the traffic happened, and can differ from
          conversion_event_marketplace_name on the same row, so one row can span two
          marketplaces and neither column alone is a row-level marketplace.
      traffic_event_subtype:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: AD_IMP or AD_CLICK. The dimension form of the clicks and impressions flags.
      traffic_event_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      units_sold:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          Can exceed 1 on a single purchase row, unlike purchases, so the two are not
          interchangeable counts.
      units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          CTE use only, never in output. NULL when Amazon cannot resolve an
          identifier, which is neither a distinct user nor a modeled conversion.
      user_id_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          adUserId, sisDeviceId, adBrowserId or NULL. Mixes ID spaces, so a distinct
          count spans accounts, devices and browsers rather than people.
  amazon_attributed_events_by_traffic_time:
    source_page: datasources/amazon_attributed_events_by_conversion_time.md
    verified: 2026-08-19
    columns_rechecked: 2026-10-08
    grain: one row per attributed conversion event paired with the single traffic event it is credited to
    audience_twin: amazon_attributed_events_by_traffic_time_for_audiences
    shares_schema_with: amazon_attributed_events_by_conversion_time
    notes: >
      This table has no page of its own; the conversion-time page documents both and
      states they carry the same metrics and dimensions, differing only in which
      events are selected.
      Traffic events fall inside the query window while conversions may occur up to
      30 days after it, and AMC automatically extends the conversion range 30 days
      past the window end, so THE SAME WORKFLOW OVER THE SAME WINDOW RETURNS
      DIFFERENT NUMBERS BETWEEN RUNS. Never treat its output as a stable snapshot,
      never diff two runs as if change meant real-world change, and stamp the
      execution time on every load.
      No spend column exists here either, so ROAS must be assembled by UNION ALL
      against a traffic table at a shared aggregate grain.
      ad_product_type NULL means Amazon DSP, and modeled conversions null out every
      grain below ad line.
    columns:
      ad_product_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          NULL means Amazon DSP on this table, not unknown. Filtering on it is
          mandatory before any sponsored-ads figure is reported.
      ad_slot_size:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          The ad slot on the page, populated for Amazon DSP. Easily confused with
          creative_size, which describes the ad itself rather than the slot.
      add_to_cart: { type: LONG, kind: METRIC, threshold: NONE }
      add_to_cart_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      add_to_cart_views: { type: LONG, kind: METRIC, threshold: NONE }
      advertiser:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      advertiser_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: Populated for Amazon DSP events only; NULL for sponsored ads is not unknown.
      advertiser_timezone:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Required to interpret every non-_utc time column on this table. Carry it
          onto every fact as source_timezone.
      appstore_first_opens: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_first_opens_clicks: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_first_opens_views: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_first_session_hours: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_first_session_hours_clicks: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_first_session_hours_views: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_opens: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_opens_clicks: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_opens_views: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_repeat_opens: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_repeat_opens_clicks: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_repeat_opens_views: { type: INTEGER, kind: METRIC, threshold: NONE }
      appstore_repeat_session_hours: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_repeat_session_hours_clicks: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_repeat_session_hours_views: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_usage_hours:
        type: "DECIMAL(38,2)"
        kind: METRIC
        threshold: NONE
        note: Hours, not money. Equals the first-session plus repeat-session hours.
      appstore_usage_hours_clicks: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      appstore_usage_hours_views: { type: "DECIMAL(38,2)", kind: METRIC, threshold: NONE }
      audience_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          Amazon DSP audience-targeting fee. Microcents, so 1000x finer than the
          millicent columns in this same table. currency_name is not on this table;
          pair with purchase_currency or the traffic-side currency.
      bid_price:
        type: LONG
        kind: METRIC
        threshold: MEDIUM
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          MEDIUM, so selecting it lifts the whole query to 100 distinct users per
          row. The only cost column here that escalates alongside click_cost.
      brand_halo_add_to_cart: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_add_to_cart_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_add_to_cart_views: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_detail_page_view: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_detail_page_view_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_detail_page_view_views: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_product_sales:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
        note: >
          Already in local currency. NEVER divide. Covers same-brand products the
          campaign did not promote, so adding it to product_sales counts revenue the
          campaign did not advertise.
      brand_halo_product_sales_clicks:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      brand_halo_product_sales_views:
        type: "DECIMAL(38,4)"
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: local_currency
        scale_divisor: 1
      brand_halo_purchases: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_purchases_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_purchases_views: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_units_sold: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_units_sold_clicks: { type: LONG, kind: METRIC, threshold: NONE }
      brand_halo_units_sold_views: { type: LONG, kind: METRIC, threshold: NONE }
      browser_family:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Describes the impression event, not the conversion event.
      campaign:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      campaign_budget_amount:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          Millicents, unlike the microcent fee columns on this same table. A budget,
          not delivered spend, so it can never substitute for cost.
      campaign_end_date:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        note: >
          TIMESTAMP despite the _date name, and documented identically to
          campaign_end_dt. Four near-duplicate variants exist; pick one and pin it.
      campaign_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_end_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_end_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_flight_budget_amount:
        type: LONG
        kind: METRIC
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          The page types this METRIC while the sibling budget columns are DIMENSION;
          recorded verbatim. LOW, so it does not escalate despite being a METRIC.
      campaign_flight_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_flight_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      campaign_flight_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_flight_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: >
          On Amazon DSP rows this matches campaign_id_string exactly. On sponsored
          ads rows it is the Ads API ID, a different identifier from the console ID
          in campaign_id_string, so joining on the wrong one drops rows silently.
      campaign_id_string:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: >
          Use this one. It is the ads-console ID for sponsored ads, and an 18-digit
          numeric campaign ID does not survive JSON integer precision.
      campaign_insertion_order_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_primary_goal: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_start_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_status: { type: STRING, kind: DIMENSION, threshold: LOW }
      city_name:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: >
          HIGH, so literal filters on it are rejected outright and it still needs
          100 distinct users per row. Amazon DSP events only.
      click_cost:
        type: LONG
        kind: METRIC
        threshold: MEDIUM
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          Millicents, unlike the microcent fee columns here. MEDIUM, so selecting it
          lifts the whole query to 100 distinct users per row. Not total spend.
      click_date:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        note: >
          Populated only for click-attributed conversions; NULL on view-attributed
          rows means not-applicable, not missing. Whole click_* family behaves so.
      click_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      click_day: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      click_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      click_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      click_dt_hour:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: The hourly grain that does not escalate. Never truncate click_dt instead.
      click_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      click_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      click_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      click_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      clicks:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: >
          1 or 0 per conversion row, flagging click attribution. It is NOT the
