# AMC column registry — the machine-readable form of the column facts owned by
# docs/sources/amc.md.
#
# Same relationship metric-dictionary.yaml has with canonical-model.md section 5:
# the prose doc owns the facts and the reasoning, this file is what a program reads.
# Never let the two disagree.
#
# WHY THIS EXISTS
#
# A column's aggregation threshold cannot be inferred from its name. event_hour_utc
# is LOW while event_dt_utc is MEDIUM; event_dt_hour is LOW while event_dt is
# MEDIUM. AMC assigns these per column and the naming follows no convention, so
# every one must be looked up. Without this file, "does this contract's grain force
# a 100-distinct-user threshold?" is a question only a human who has read the
# datasources pages can answer — which means it eventually gets answered wrong, and
# the failure mode is silent row-dropping rather than an error.
#
# HOW THE GATE USES IT
#
# make validate-contracts treats this as an ALLOWLIST:
#   - a contract naming a column absent from here FAILS. An unverified column may
#     not be used, and adding one here is a deliberate act requiring a citation.
#   - a contract whose output includes any MEDIUM or HIGH column and does not
#     declare filtered_metrics_discriminator_column FAILS.
#   - a contract naming a column with `status: disputed` FAILS until the dispute is
#     resolved against a live instance.
#   - a monetary column mapped without its scale_divisor FAILS.
#
# Partial coverage is therefore safe. It is not silently permissive.
#
# EVIDENCE STATUS
#
# Each fact carries the evidence that supports it, and nothing stronger:
#   - verified (table): the date the transcription was made from source_page.
#   - columns_rechecked (table): the date source_page was fetched again and every
#     column here matched it on name, type, kind and threshold. Notes paraphrasing
#     the page are as of the date they were written.
#   - live (column or table): a presence result from a governed probe, per instance
#     type and date, published in validation/RESULTS.md. Recorded only where presence
#     was in question; it is not a list of every live read.
#   - pending (column): a live claim that has no accepted result yet. Not evidence.
#   - status: disputed (column): the docs and live evidence disagree, or the docs
#     contradict themselves. The gate refuses a contract that uses it.
# The reasoning behind each of these is owned by docs/sources/amc.md.
#
# NOT A DESCRIPTION OF AMC. Amazon's own column descriptions are not reproduced
# here; see source_page for each table. Only the facts that change what code must do
# are recorded: type, kind, threshold, scale, and behaviour notes.

version: 1

provenance:
  # The docs site is a client-rendered SPA; a plain fetch of the human URL returns a
  # JS shell. The authoritative Markdown is on the content CDN, and the en-us/
  # prefix is required — omitting it 404s. See docs/sources/amc.md section 2.
  cdn_base: https://d3a0d0y2hgofx6.cloudfront.net/en-us/guides/amazon-marketing-cloud
  threshold_reference: https://advertising.amazon.com/API/docs/en-us/guides/amazon-marketing-cloud/aggregation-threshold
  # No changelog, no per-page dates and no feed exist for these pages, so drift is
  # undetectable without hashing them ourselves. Re-verify on a schedule.
  drift_detection: none available upstream

# The bar a row must clear to be released, set by the STRICTEST column in the query
# output. Facts owned by docs/sources/amc.md section 5.
threshold_classes:
  NONE:
    min_distinct_users: 1
    literal_filter_allowed: true
    outputtable: true
  LOW:
    min_distinct_users: 2
    literal_filter_allowed: true
    outputtable: true
  MEDIUM:
    min_distinct_users: 100
    literal_filter_allowed: true
    outputtable: true
  HIGH:
    min_distinct_users: 100
    literal_filter_allowed: false
    outputtable: true
  VERY_HIGH:
    min_distinct_users: null
    literal_filter_allowed: false
    outputtable: false
    note: Usable only inside a CTE, e.g. COUNT(DISTINCT user_id).
  INTERNAL:
    min_distinct_users: null
    literal_filter_allowed: false
    outputtable: false

# Any output column at MEDIUM or HIGH lifts the whole query's bar from 2 users to
# 100. That is the single check a contract's grain must pass.
threshold_escalates_at: [MEDIUM, HIGH]
# How the three suppression option columns arrived in four controls-on results on
# 2026-10-08, and nothing wider: dsp_impressions on the Sandbox and the STANDARD demo
# instance, one day, every grouped source column LOW so the bar was 2, the table read once
# per query, and the option names rows_suppressed, suppression_reason and
# distinct_user_count, which every governed pack also sets. Facts and scope owned by
# docs/sources/amc.md section 5. The fixture generator writes this shape and its conformance
# check refuses any other; that holds our fixtures to what was observed, and says nothing
# about what AMC delivers outside this scope.
#   - trailing_order: observed for these option names; the create-workflow page states no
#     order, and other names are unverified.
#   - unsuppressed rows: the reason was blank and the user count was the query's bar.
#   - suppressed rows: the reason read "<users> <table> users < <bar> required", the user
#     count equalled <users>, and every source column whose threshold bar exceeds <users> was
#     NULL. Measures and CTE-derived labels survived.
#   - suppressed_reason_format: a docs-vs-live disagreement, not a settled format. The docs
#     quote the source, add "(path i of n)" for a source used more than once and name a count
#     type; 2026-08-21 saw an empty and a truncated reason on attributed events with a HIGH
#     key (docs/sources/amc.md sections 5 and 10). No production or runtime code may parse it.
#   - timestamp_format: every time_window_start and time_window_end cell in those results.
# Outside that scope, 2026-10-09 (two multi-source Sandbox queries, LOW; validation/RESULTS.md
# "Fence structural check, pack 14 at acquisition-date grain, P-BO-3 and P-BO-4"):
#   - the reason read "<users> '<table>' (path <i> of <n>) users < <bar> required";
#   - on both texts, the bar applied per data-source path, so a row with two or more users
#     could be withheld: through conversions on pack 14, and through a touch table,
#     sponsored_ads_traffic, on the fence structural check (structural check, not the exact
#     pack text; outside criterion 7's band; doesn't settle packs 5-7, AC-E1.5 pending Step B);
#   - labels derived from dimension columns, purchase-side sums and currency columns were NULL.
# The values below stay the single-source form. No fixture of a multi-source pack carries a
# suppressed row today; one that does must model the 2026-10-09 form instead.
# A Sandbox prefixes the table with "sandbox."; a fixture models an advertiser instance, so
# it doesn't.
suppression_output:
  observed: 2026-10-08
  source: validation/RESULTS.md#paid-feature-presence-and-forced-suppression--2026-10-08
  trailing_order: [distinct_user_count, suppression_reason, rows_suppressed]
  discriminator_values: ["true", "false"]   # suppressed, then kept
  suppressed_reason_format: "{users} {table} users < {bar} required"
  timestamp_format: "%Y-%m-%dT%H:%M:%S.000Z"

# Divide by these. The divisor is a property of the COLUMN, never the table or the
# platform: dsp_impressions mixes both scales, so a per-table divisor makes every
# DSP fee figure wrong by exactly 1000x while fee-inclusive ROAS still reconciles
# and the headline looks correct.
scale_units:
  millicents: 100000
  microcents: 100000000
  # Attributed sales are already DECIMAL in local currency. Applying a cost divisor
  # to revenue is a 5-to-8 order-of-magnitude error in the numerator of every ROAS.
  local_currency: 1

tables:
  sponsored_ads_traffic:
    source_page: datasources/sponsored_ads_traffic.md
    verified: 2026-08-19
    columns_rechecked: 2026-10-08
    grain: one row per sponsored ads impression event, one row per click event
    audience_twin: sponsored_ads_traffic_for_audiences
    notes: >
      Filter on ad_product_type or Sponsored Display and Sponsored TV mix into
      numbers reported as Sponsored Products. spend is the only monetary column.
      Join to the attributed-events tables on event_id -> traffic_event_id.
    columns:
      ad_group: { type: STRING, kind: DIMENSION, threshold: LOW }
      ad_group_end_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      ad_group_end_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      ad_group_start_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      ad_group_start_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      ad_group_status: { type: STRING, kind: DIMENSION, threshold: LOW }
      ad_group_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      ad_product_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          NULL means DSP in the attributed-events tables. On this table the values
          are sponsored_products, sponsored_brands, sponsored_display and
          sponsored_television.
      advertiser:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      advertiser_timezone:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Carry onto every fact as source_timezone. ADR-004.
      campaign:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      campaign_budget_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_end_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      campaign_end_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      campaign_end_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_end_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        deprecated_for_use: true
        note: >
          Do NOT use. On this table campaign_id and campaign_id_string are different
          identifiers from different systems, both populated, so joining on the
          wrong one drops rows silently instead of erroring. This is the Ads API ID.
      campaign_id_string:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: >
          The ads-console ID, and NOT numeric on this table. Use this one. An
          18-digit numeric ID also does not survive JSON integer precision.
      campaign_start_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      campaign_start_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      campaign_start_dt: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_start_dt_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      clicks: { type: LONG, kind: METRIC, threshold: NONE }
      creative: { type: STRING, kind: DIMENSION, threshold: LOW }
      creative_asin:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          The ADVERTISED ASIN, distinct from tracked_asin on the conversion side.
          Populated only for a subset of Sponsored Products and Sponsored Display
          events; NULL for other ad products, which is not zero.
      creative_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      currency_iso_code:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Required alongside spend. Never store a bare monetary amount.
      currency_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      customer_search_term: { type: STRING, kind: DIMENSION, threshold: LOW }
      entity_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      event_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      event_date_utc:
        type: DATE
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: Prefer over event_dt_utc. Same day grain, bar of 2 users instead of 100.
      event_day: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      event_dt_hour: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      event_dt_hour_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: LOW
        preferred: true
        note: The hourly grain that does not escalate. Never truncate event_dt_utc instead.
      event_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: Escalates the whole query to 100 distinct users per row.
      event_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      event_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Join key to traffic_event_id in the amazon_attributed_* tables. Not
          outputtable, so the join happens inside a CTE.
      five_sec_views: { type: LONG, kind: METRIC, threshold: NONE }
      household_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        available_from: 2026-04-10
        note: >
          CTE use only. Coverage varies by region, so a household-level grain is not
          uniformly populated and an absent household is not a household of one.
      household_size: { type: STRING, kind: DIMENSION, threshold: HIGH }
      impressions: { type: LONG, kind: METRIC, threshold: NONE }
      ip_address: { type: STRING, kind: DIMENSION, threshold: VERY_HIGH }
      is_amazon_business: { type: BOOLEAN, kind: DIMENSION, threshold: LOW }
      line_item:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Mirrors ad_group with identical values. DSP's equivalent name for the same thing.
      line_item_end_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      line_item_price_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item_start_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_status: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      marketplace_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The usable marketplace column. marketplace_id is INTERNAL elsewhere in AMC.
      match_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      matched_behavior_segment_ids: { type: STRING, kind: DIMENSION, threshold: LOW }
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      operating_system: { type: STRING, kind: DIMENSION, threshold: LOW }
      os_version: { type: STRING, kind: DIMENSION, threshold: LOW }
      placement_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      portfolio_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      portfolio_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      spend:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        fee_inclusive: true
        note: >
          The only monetary column on this table, and the sponsored-ads half of
          ad_spend per ADR-017. Some ad products including Sponsored Products incur
          cost only on click events, so a spend of 0 on an impression row is
          expected and is not missing data. There is no media-only equivalent here,
          which is why the fee-inclusive default is the only one computable across
          both channels.
      targeting: { type: STRING, kind: DIMENSION, threshold: LOW }
      unmeasurable_viewable_impressions: { type: LONG, kind: METRIC, threshold: NONE }
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          CTE use only, never in output. NULL when Amazon cannot resolve an
          identifier, which is not the same as a distinct user. Reach is an exact
          COUNT(DISTINCT user_id) computed inside AMC at every grain wanted, and is
          non-additive downstream.
      user_id_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          adUserId, sisDeviceId, adBrowserId or NULL. Mixes ID spaces, so a distinct
          count spans accounts, devices and browsers rather than people.
      video_complete_views: { type: LONG, kind: METRIC, threshold: NONE }
      video_first_quartile_views: { type: LONG, kind: METRIC, threshold: NONE }
      video_midpoint_views: { type: LONG, kind: METRIC, threshold: NONE }
      video_third_quartile_views: { type: LONG, kind: METRIC, threshold: NONE }
      video_unmutes: { type: LONG, kind: METRIC, threshold: NONE }
      view_definition: { type: STRING, kind: DIMENSION, threshold: LOW }
      viewable_impressions: { type: LONG, kind: METRIC, threshold: NONE }

# Tables whose pages have not been transcribed yet. Listed so the gap is visible and
# so nobody assumes an absent table means an absent source. A contract naming any of
# these fails until its page is fetched and its columns recorded here.
  dsp_impressions:
    source_page: datasources/dsp_impressions.md
    verified: 2026-08-19
    columns_rechecked: 2026-10-08
    grain: One row per Amazon DSP impression delivered to a viewer.
    audience_twin: dsp_impressions_for_audiences
    notes: >
      Two money scales coexist here, so read scale_divisor per column and never
      key a divisor on the table.
      This page lists 108 columns.
      winning_bid_cost does not appear anywhere on this page.
    columns:
      ad_slot_size:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Size of the inventory slot that was filled, not of the asset served.
          creative_size is the asset. Easy to confuse.
      advertiser:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      advertiser_account_frequency_group_ids:
        type: "Array[LONG]"
        kind: DIMENSION
        threshold: LOW
        note: >
          Advertiser-account scope. Sibling of
          manager_account_frequency_group_ids, which is a wider scope. One
          impression can carry several IDs, so unnesting multiplies rows.
      advertiser_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      advertiser_timezone: { type: STRING, kind: DIMENSION, threshold: LOW }
      app_bundle: { type: STRING, kind: DIMENSION, threshold: LOW }
      audience_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: Charge for using Amazon audience segments, billed per thousand impressions.
      bid_price:
        type: LONG
        kind: METRIC
        threshold: MEDIUM
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          The only monetary column above NONE. Selecting it needs 100 distinct
          users per row, so it silently costs rows the other cost columns keep.
      browser_family: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      campaign_budget_amount:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          Whole-campaign budget, so it repeats on every impression row. Summing
          it across rows is meaningless.
      campaign_country:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        live:
          - instance: STANDARD
            date: 2026-10-08
            outcome: resolves
            scope: >
              The pack 5 candidate text (Q3), which filters this column against
              CUSTOM_PARAMETER('dsp_campaign_country') through EXTEND_TIME_WINDOW, ran with
              controls on.
            source: validation/RESULTS.md#business-outcome-probes-p-bo-1-step-a-and-p-bo-2--2026-10-08
          - instance: SANDBOX
            date: 2026-10-08
            outcome: absent
            scope: >
              A one-column read from plain dsp_impressions, controls on, was REJECTED with
              "Column 'campaign_country' not found in any table".
            source: validation/RESULTS.md#business-outcome-probes-p-bo-1-step-a-and-p-bo-2--2026-10-08
        pending: >
          Observed representation and population (run 2026-08-26, window 2026-08-10 to
          2026-08-23). validation/RESULTS.md publishes no accepted conclusion for it, so no
          observed value is recorded here. The page's example value is 'US'.
        note: >
          The page sets the value from the campaign-level country setting. Only US is governed
          by the current US commerce scope; any other value fails closed. A query that filters
          this column can't be validated on a Sandbox (docs/sources/amc.md section 10).
      campaign_end_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_flight_budget_amount:
        type: LONG
        kind: METRIC
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          Per-flight budget, and the only budget column the page types as a
          METRIC rather than a DIMENSION. It still repeats per row, so do not sum it.
      campaign_flight_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_flight_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      campaign_flight_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_flight_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: >
          The page states this and campaign_id_string carry the same value on
          this table. Prefer the string form; the 18-digit value does not survive
          JSON integer precision.
      campaign_id_string:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Same value as campaign_id on this table per the page. Use this one, and
          note the pair is NOT interchangeable on sponsored_ads_traffic.
      campaign_insertion_order_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_primary_goal: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_sales_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Splits billable from bonus delivery. Bonus impressions carry no charge,
          so leaving them in deflates any CPM or ROAS.
      campaign_source:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The page gives no semantics beyond the name. Probe before relying on it.
      campaign_start_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_status: { type: STRING, kind: DIMENSION, threshold: LOW }
      city_name:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        status: disputed
        live:
          - instance: SANDBOX
            date: 2026-08-21
            outcome: absent
            scope: >
              A probe selecting it from this table was REJECTED with "Column 'city_name' not
              found in any table".
            source: validation/RESULTS.md#probe-6--suppression_nulls--2026-08-21
        dispute: >
          The dsp_impressions page, re-read 2026-10-08, lists this column on this table (STRING,
          DIMENSION, HIGH), so the transcription is right and the Sandbox schema is narrower
          than the page. No advertiser instance has been probed. No contract uses this column,
          so nothing is blocked; settle it on a STANDARD instance before one does
          (docs/sources/amc.md section 10).
        note: >
          HIGH, so it cannot be compared to a literal anywhere in the query,
          including joins and filters. Output only.
      creative: { type: STRING, kind: DIMENSION, threshold: LOW }
      creative_category: { type: STRING, kind: DIMENSION, threshold: LOW }
      creative_duration:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: Seconds, and NULL for non-video formats rather than zero.
      creative_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      creative_is_link_in:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          A flag carried as STRING 'Y' or 'N', not a BOOLEAN. Do not cast it
          alongside the real boolean columns.
      creative_size:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Asset dimensions, and it can read 'Responsive' rather than a pixel
          pair. Distinct from ad_slot_size.
      creative_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      currency_iso_code: { type: STRING, kind: DIMENSION, threshold: LOW }
      currency_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          The page points every monetary column at this field for its currency.
          No FX is provided, so carry it alongside any amount.
      deal_id:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: NULL for open-auction inventory, so it is populated only on private deals.
      deal_name:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: NULL for open-auction inventory, same condition as deal_id.
      demand_channel:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The page gives no semantics beyond the name. Probe before relying on it.
      demand_channel_owner:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: The page gives no semantics beyond the name. Probe before relying on it.
      device_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Pseudonymous device identifier. Never outputtable; usable only inside a
          CTE. Not recorded in amc.md §4.
      device_make:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Device manufacturer, never a merchant brand. The page warns the same
          maker appears in mixed casing, so grouping needs normalisation first.
      device_model:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Mixed casing for the same model, same normalisation caveat as device_make.
      device_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      dma_code:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          US broadcast markets only, formatted with a US-DMA prefix. LOW, so it
          is the one geo grain finer than country that survives a literal filter.
      entity_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      environment_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: NULL means undeterminable, not a third environment.
      household_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Never outputtable; CTE-only. NULL when Amazon cannot resolve the user
          or household, and it changes if a user moves household. Available from
          2026-04-10 onward, with coverage varying by region.
      household_size:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: >
          HIGH, so no literal comparison. Carried as STRING with a '4+' bucket
          and NULL, so it will not cast to a number.
      impression_cost:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: >
          Millicents like total_cost, unlike every fee column here. This page
          does not state whether fees are included, so amc.md's media-cost-only
          reading is not confirmable from it.
      impression_date: { type: DATE, kind: DIMENSION, threshold: LOW }
      impression_date_utc: { type: DATE, kind: DIMENSION, threshold: LOW }
      impression_day: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      impression_day_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      impression_dt:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: >
          Full timestamp at MEDIUM against LOW for every date, hour and day
          variant. Selecting it in final output drops far more rows.
      impression_dt_hour: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      impression_dt_hour_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      impression_dt_utc:
        type: TIMESTAMP
        kind: DIMENSION
        threshold: MEDIUM
        note: >
          UTC full timestamp, MEDIUM for the same reason as impression_dt. Never
          mix UTC and advertiser-timezone columns in one query.
      impression_hour: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      impression_hour_utc: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      impressions:
        type: LONG
        kind: METRIC
        threshold: NONE
        note: Always 1 on this table, since every row is one impression.
      ip_address:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Pseudonymised, IPv4 or IPv6, NULL when not received. Never outputtable;
          CTE-only. Not recorded in amc.md §4.
      is_amazon_owned: { type: BOOLEAN, kind: DIMENSION, threshold: LOW }
      iso_country_code: { type: STRING, kind: DIMENSION, threshold: LOW }
      iso_state_province_code:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          ISO 3166-2, so it already carries the country prefix. LOW, unlike
          city_name and postal_code.
      line_item: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item_budget_amount:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: Line-item budget, repeated on every row. Do not sum across rows.
      line_item_end_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      line_item_price_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item_start_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      line_item_status: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item_type: { type: STRING, kind: DIMENSION, threshold: LOW }
      managed_service_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: A percentage of supply_cost, charged for Amazon-managed campaign service.
      manager_account_frequency_group_ids:
        type: "Array[LONG]"
        kind: DIMENSION
        threshold: LOW
        note: >
          Manager-account scope, so it spans advertisers. Wider than
          advertiser_account_frequency_group_ids and easy to confuse with it.
      matched_behavior_segment_ids:
        type: "Array[INTEGER]"
        kind: DIMENSION
        threshold: LOW
        note: >
          Only segments both targeted by the line item and matched to the user.
          A strict subset of user_behavior_segment_ids.
      merchant_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: The page gives no semantics beyond the name. Probe before relying on it.
      no_3p_trackers: { type: BOOLEAN, kind: DIMENSION, threshold: NONE }
      ocm_fee:
        type: LONG
        kind: METRIC
        threshold: LOW
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          Omnichannel-measurement fee, a percentage of supply_cost. The only fee
          column at LOW rather than NONE, so it needs 2 distinct users per row.
      operating_system: { type: STRING, kind: DIMENSION, threshold: LOW }
      os_version: { type: STRING, kind: DIMENSION, threshold: LOW }
      page_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Meaningful mainly for Amazon-site placements.
      placement_is_view_aware:
        type: BOOLEAN
        kind: DIMENSION
        threshold: LOW
        note: >
          Placement-level viewability capability. Distinct from
          supply_source_is_view_aware, which is the wider supply-side flag.
      placement_view_rate:
        type: DECIMAL
        kind: DIMENSION
        threshold: LOW
        note: >
          A 0.0-1.0 rate, so it is already a ratio and must not be summed.
          Placement-level twin of supply_source_view_rate.
      platform_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          A percentage of supply_cost, charged for DSP access. Also called the
          technology or console fee elsewhere.
      postal_code:
        type: STRING
        kind: DIMENSION
        threshold: HIGH
        note: >
          HIGH, so no literal comparison anywhere. Prefixed with the country
          code, and holds the country alone when the postal part is unknown, so
          length varies.
      product_line:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Amazon's campaign categorisation, not a merchant brand. The page gives
          no further semantics.
      publisher_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      request_tag:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Links an impression to related view, click and conversion rows, where
          it lands in impression_id. Duplicates occur, so the page advises
          against joining on it without grouping first; prefer UNION ALL. Never
          outputtable.
      segment_marketplace_id: { type: INTEGER, kind: DIMENSION, threshold: LOW }
      seller_id:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Maps to OpenRTB publisher.id. Format is not fixed, so do not assume it
          is numeric.
      seller_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      site: { type: STRING, kind: DIMENSION, threshold: LOW }
      slot_position: { type: STRING, kind: DIMENSION, threshold: LOW }
      supply_cost:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: >
          What DSP pays the publisher side. The base that platform_fee,
          managed_service_fee and ocm_fee are percentages of.
      supply_source: { type: STRING, kind: DIMENSION, threshold: LOW }
      supply_source_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      supply_source_is_view_aware:
        type: BOOLEAN
        kind: DIMENSION
        threshold: LOW
        note: Supply-side viewability capability, wider than placement_is_view_aware.
      supply_source_view_rate:
        type: DECIMAL
        kind: DIMENSION
        threshold: LOW
        note: >
          A 0.0-1.0 rate, not summable. Supply-source twin of
          placement_view_rate.
      third_party_fees:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: Already a sum of external data and technology charges for the impression.
      total_cost:
        type: DOUBLE
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: millicents
        scale_divisor: 100000
        fee_inclusive: true
        note: >
          The spend column for this table, and the only monetary column typed
          DOUBLE rather than LONG. Millicents, so its divisor differs from every
          fee column here by 1000x.
      user_behavior_segment_ids:
        type: "Array[INTEGER]"
        kind: DIMENSION
        threshold: LOW
        note: >
          Every segment the user belonged to at impression time, targeted or not.
          Superset of matched_behavior_segment_ids.
      user_id:
        type: STRING
        kind: DIMENSION
        threshold: VERY_HIGH
        note: >
          Never outputtable; CTE-only, for exact distinct counts. Mixes account,
          device and browser identifier spaces, so read user_id_type with it.
          NULL when Amazon cannot resolve an identifier.
      user_id_type:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          NULL exactly when user_id is NULL. The safe LOW proxy for reasoning
          about identifier coverage.
  dsp_clicks:
    source_page: datasources/dsp_clicks.md
    verified: 2026-08-19
    columns_rechecked: 2026-10-08
    grain: One row per Amazon DSP impression that was clicked, carrying the click detail.
    audience_twin: dsp_clicks_for_audiences
    notes: >
      Page describes this as a subset of dsp_impressions restricted to clicked impressions.
      Two parallel time families are present, click_* and impression_*; pick one deliberately.
      No total_cost and no impression_cost here, so DSP media spend cannot be sourced from this table.
    columns:
      ad_slot_size: { type: STRING, kind: DIMENSION, threshold: LOW }
      advertiser:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      advertiser_account_frequency_group_ids:
        type: "Array[LONG]"
        kind: DIMENSION
        threshold: LOW
        note: Array valued; one impression can sit in several frequency groups, so unnest before counting.
      advertiser_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      advertiser_timezone: { type: STRING, kind: DIMENSION, threshold: LOW }
      app_bundle: { type: STRING, kind: DIMENSION, threshold: LOW }
      audience_fee:
        type: LONG
        kind: METRIC
        threshold: NONE
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: Page states microcents and gives the 100,000,000 divisor explicitly.
      bid_price:
        type: LONG
        kind: METRIC
        threshold: MEDIUM
        monetary: true
        scale: microcents
        scale_divisor: 100000000
        note: Page states microcents and gives the 100,000,000 divisor explicitly.
      browser_family: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: >
          Outputtable. VERIFIED 2026-08-19 by live query against AMC sandbox
          instance SANDBOX_INSTANCE with aggregation controls ON: a final SELECT of
          campaign_id_string, campaign and advertiser with GROUP BY returned real
          names. docs/sources/amc.md section 4 previously recorded these as INTERNAL
          and never outputtable; that was wrong. An INTERNAL column cannot appear in
          a GROUP BY, so the query would have been rejected.
      campaign_budget_amount:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: Page states millicents and gives the 100,000 divisor explicitly.
      campaign_country:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        pending: >
          Observed representation and population (run 2026-08-26, window 2026-08-10 to
          2026-08-23). validation/RESULTS.md publishes no accepted conclusion for it, so no
          observed value is recorded here. The page's example value is 'US'.
        note: >
          The page sets the value from the campaign-level country setting. Only US is governed
          by the current US commerce scope; any other value fails closed. No accepted live
          presence result on this table; the pending run above is its only live read.
      campaign_end_date: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_flight_budget_amount:
        type: LONG
        kind: METRIC
        threshold: LOW
        monetary: true
        scale: millicents
        scale_divisor: 100000
        note: Page states millicents and gives the 100,000 divisor explicitly.
      campaign_flight_end_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_flight_id: { type: LONG, kind: DIMENSION, threshold: LOW }
      campaign_flight_name: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_flight_start_date_utc: { type: TIMESTAMP, kind: DIMENSION, threshold: LOW }
      campaign_id:
        type: LONG
        kind: DIMENSION
        threshold: LOW
        note: >
          Page states this holds the same value as campaign_id_string on this table. The two are
          different identifiers on sponsored_ads_traffic, so do not carry that assumption across.
      campaign_id_string:
        type: STRING
        kind: DIMENSION
        threshold: LOW
        note: Prefer this form; 18-digit IDs do not survive JSON integer precision.
      campaign_insertion_order_id: { type: STRING, kind: DIMENSION, threshold: LOW }
      campaign_primary_goal:
        type: STRING
        kind: DIMENSION
