      ip_address: { type: STRING, kind: DIMENSION, threshold: VERY_HIGH }
      is_amazon_owned: { type: BOOLEAN, kind: DIMENSION, threshold: LOW }
      iso_country_code: { type: STRING, kind: DIMENSION, threshold: LOW }
      iso_state_province_code: { type: STRING, kind: DIMENSION, threshold: LOW }
      line_item:
        type: STRING
