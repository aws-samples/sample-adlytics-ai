version: 1
commerce_scope: amazon_retail_us
marketplace_display_names:
  - target: amazon_us
    value: United States
marketplace_aliases:
  - namespace: amazon.marketplace_id
    value: ATVPDKIKX0DER
    target: amazon_us
    mapping_version: 1
    valid_from: 2000-01-01
  - namespace: amc.marketplace_name
    value: AMAZON.COM
    target: amazon_us
    mapping_version: 2
    valid_from: 2000-01-01
  - namespace: amc.campaign_country
    value: US
    target: amazon_us
    mapping_version: 3
    valid_from: 2000-01-01
  # The ASI segment marketplace. AMC types the column LONG on the ASI tables; the value is
  # its decimal text. Evidence: Amazon's off-Amazon conversions playbook filters
  # audience_segments_amer_inmarket on segment_marketplace_id = 1 and labels it the US
  # marketplace ID [verified 2026-10-08, datasources and playbooks pages; docs/sources/amc.md
  # "Paid features"]. Query-parameter namespace only: never a display label and never matched by
  # bare value (QUERY_PARAMETER_MARKETPLACE_NAMESPACES, src/domain/semantics/commerce_identity.py).
  - namespace: amc.segment_marketplace_id
    value: '1'
    target: amazon_us
    mapping_version: 4
    valid_from: 2000-01-01
  # The Amazon Retail Purchases marketplace, which fills pack 15's arp_marketplace_name parameter
  # (plan D15, design §6.6). The registry records that amazon_retail_purchases.marketplace_name
  # takes the AMAZON.COM form [repo: contracts/shared/amc-columns.yaml, amazon_retail_purchases
  # marketplace_name note]. Whether it equals the sponsored marketplace_name value is
  # [unverified], so pack 15 reads its own parameter, which stays correct either way. Query-
  # parameter namespace only (QUERY_PARAMETER_MARKETPLACE_NAMESPACES).
  - namespace: amc.arp_marketplace_name
    value: AMAZON.COM
    target: amazon_us
    mapping_version: 5
    valid_from: 2000-01-01
product_mappings: []
product_identifier_rules:
  - source_namespace: amc.tracked_asin
    canonical_namespace: amazon_asin
    value_pattern: '^[A-Z0-9]{10}$'
    normalization: lowercase
    mapping_version: 1
    valid_from: 2000-01-01
  - source_namespace: amc.retail_purchase_asin
    canonical_namespace: amazon_asin
    value_pattern: '^[A-Z0-9]{10}$'
    normalization: lowercase
    mapping_version: 1
    valid_from: 2000-01-01
  - source_namespace: vendor.asin
    canonical_namespace: amazon_asin
    value_pattern: '^[A-Z0-9]{10}$'
    normalization: lowercase
    mapping_version: 1
    valid_from: 2000-01-01
  - source_namespace: vendor_data_kiosk.asin
    canonical_namespace: amazon_asin
    value_pattern: '^[A-Z0-9]{10}$'
    normalization: lowercase
    mapping_version: 1
    valid_from: 2000-01-01
