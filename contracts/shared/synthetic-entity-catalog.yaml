# The declared shape of the fictional dev seed (ADR-086). Every generated value is a pure function
# of these declarations and the seed; nothing reads a clock. Decimals are quoted strings. Event
# offsets are days relative to event_anchor; the launch offset is relative to shape_anchor.
# Campaign names are valid from 2025-01-01 so every named campaign has a name on first_day.
shape:
  seed: adlytics-dev-shape-2026-10-04-r1   # r1: the -10-04 seed breached window_roas_band at +7 days (evidence/proj_r9_seed_search.out); never widen a band
  fixture_span: {first_day: "2025-07-01", last_day: "2026-10-06"}   # about 15 months (owner: at least 13); last_day is a literal per landing commit
  shape_anchor: "2026-10-06"           # long-run trend, story, slope, conversion shape, spike, launch; never moved after the first landing
  event_anchor: "2026-10-06"           # the ten short events below; the only date that moves
  event_anchor_slack_days: 2           # shape_anchor <= event_anchor <= last_day <= event_anchor + 2
  story_days: 56
  launch: {campaign: campaign:northstar-dsp-29, first_delivery_offset: -10}
  amc:
    attribution_maturity: {age_0: "1", age_1: "1"}   # {1, 1} in dev whatever RL-2 finds (ADR-086)
    # Pack 1 (amc-new-to-brand-buyers-platform, ADR-099): one platform row per complete ISO week
    # and calendar month. Distinct buyers are 0.80 x the period's credited purchases in the
    # attributed-conversion corpus, rounded down, so buyers never exceed purchases. The ISO week
    # 6 weeks before the shape_anchor week returns only a suppressed one-shopper row, source keys
    # NULL, so its platform cell is written not_returned and reads "not available".
    new_to_brand_buyers: {buyers_per_purchase: "0.80", not_returned_week_offset: -6}
    # Pack 2 (amc-new-to-brand-buyers-channel): one row per ad product with credited purchases,
    # per complete ISO week and calendar month, drawn with pack 1's buyers_per_purchase from that
    # ad product's own purchases, so it never exceeds them or the period's platform buyers. In
    # the ISO week 1 week before the shape_anchor week, sponsored_brands (which has spend that
    # week) returns only a suppressed one-shopper row, keys NULL: it is on the ad-product roster
    # and reads "not available". Pack 1's not-returned week returns one suppressed row here too.
    new_to_brand_buyers_channel: {missing: {ad_product: sponsored_brands, week_offset: -1}}
    # Pack 3 (amc-new-to-brand-buyers-campaign): one row per campaign with credited purchases per
    # calendar month only, drawn with pack 1's buyers_per_purchase from that campaign's own
    # purchases, so it never exceeds them or the month's platform buyers. Every such campaign has
    # spend that month, so it is on the campaign roster. The month 1 before the shape_anchor
    # month drops the first quarter of its campaigns by source key (one merged suppressed row,
    # keys NULL): its roster of 20 or more loses more than a fifth and the grain set is
    # withdrawn, pointing to new buyers per channel. The month 2 before drops northstar-dsp-06
    # only, which reads "not available" while the rest are served.
    new_to_brand_buyers_campaign: {withdrawn: {month_offset: -1, missing_share: "0.25"}, missing: {month_offset: -2, campaign: campaign:northstar-dsp-06}}
    # Pack 4 (amc-dsp-reach, plan D6): one delivery per UTC day, for these three days only, so
    # every earlier DSP day has no reach publication and reads the coverage refusal. Each DSP
    # campaign-day with impressions carries its distinct shoppers, never more than that day's
    # amc-dsp-impressions impressions. On the first day northstar-dsp-05 had one shopper, below
    # the bar of 2: its row comes back suppressed with its keys NULL, and reject_delivery refuses
    # that day's delivery. Only the reach-side row is shaped; that day's impressions corpus isn't,
    # so the bound holds but the implied frequency isn't realistic. The other two days are clean.
    dsp_reach: {day_offsets: [-3, -2, -1], suppressed: {day_offset: -3, campaign: campaign:northstar-dsp-05}}
    # amc-deduplicated-temporal-attribution (dev-seeding §2): one row per day x registered model
    # x ad product with attributed purchases that day. Every model splits the same day total, the
    # attributed corpus's purchases (credit) and halo-inclusive sales (revenue) summed over its
    # ad products, so the headline is the same under each. A model credits an ad product the total
    # times its own measure x its weight below, over the sum of weighted measures. First touch
    # leans to DSP, whose upper-funnel impressions tend to come first; last touch to Sponsored
    # Products, the search ad nearest the purchase; linear weighs each equally, so its credit is
    # the ad product's own measure.
    deduplicated_attribution:
      channel_weights:
        first_touch_v1: {amazon_dsp: "1.50", sponsored_products: "0.80", sponsored_brands: "1.00"}
        last_touch_v1: {amazon_dsp: "0.70", sponsored_products: "1.25", sponsored_brands: "1.00"}
        linear_v1: {amazon_dsp: "1.00", sponsored_products: "1.00", sponsored_brands: "1.00"}
      # First and last touch credit each purchase whole to one touch, so their purchase credit per
      # ad product is a whole number; linear's equal fractions are not.
      whole_credit_models: [first_touch_v1, last_touch_v1]
    # Pack 5 (amc-exposure-groups, ADR-101): one delivery of the 3 x 2 grid (exposure source set x
    # identity space) per complete ISO week and calendar month. A period's DSP and sponsored
    # impressions and raw costs come from the amc-dsp-impressions and amc-reach-frequency corpora
    # over its days: 0.60 of the DSP side to DSP only and the rest to both, 0.70 of the sponsored
    # side to sponsored only and the rest to both, 0.75 of each on account IDs. Shoppers are
    # impressions / 6 rounded down; outcome counts are the rates below of shoppers, device or
    # browser IDs at 0.25 of them. Shaped: 2 weeks before the shape_anchor week the DSP-only
    # device-or-browser cell returns only a suppressed one-shopper row (not available); the
    # month 1 before, the sponsored-only device-or-browser cell held 3 shoppers but one source
    # path had fewer than two, so it comes back withheld with a (path i of n) reason and NULL
    # purchase sums and currency (plan D19); 3 weeks before, that cell holds 2 Sponsored Products
    # shoppers with 3 impressions and one 1.20 billed click each, so its window spend is the
    # clicks' 2.40; 4 weeks before, one row's sponsored currency disagrees with its MIN twin, so
    # the load refuses the delivery and it is never landed.
    exposure_groups: {impressions_per_shopper: 6, group_shares: {dsp: "0.60", sponsored: "0.70"}, account_share: "0.75", rates: {search: "0.12", detail_page_view: "0.30", purchaser: "0.05", ntb_share: "0.40", device_factor: "0.25"}, purchases_per_purchaser: "1.25", order_value: "32.50", not_returned: {week_offset: -2, cell: [dsp, device_or_browser]}, withheld_path: {month_offset: -1, cell: [sponsored, device_or_browser], shoppers: 3}, click_shoppers: {week_offset: -3, cell: [sponsored, device_or_browser], shoppers: 2, click_spend: "1.20"}, currency_disagreement: {week_offset: -4}}
    # Packs 6 and 7 (amc-exposure-frequency-platform and -channel, design §6.3 D2): one delivery
    # of every bucket by two identity spaces (pack 7 per ad product) per complete calendar month
    # and quarter, drawn from the same DSP and sponsored corpora as pack 5 (pack 7 per ad
    # product, DSP as amazon_dsp). Shoppers hold their bucket's impression count (10_plus: 14);
    # bucket_shares split each slice's shoppers, purchaser_rates their purchasers per bucket,
    # device or browser IDs at 0.25 of them. Shaped: the month 2 before the shape_anchor month,
    # the 10_plus device-or-browser bucket (pack 7: of sponsored_products) held 3 shoppers but one
    # source path had fewer than two, so it comes back withheld (plan D19); its slice grades
    # degraded, so the month after is delivered under the coarse scheme (plan D10). The month 4
    # before, one account row's bucket is NULL, so the load refuses it and it is never landed.
    # Packs 9, 13 and 8 (amc-dsp-segment-names, amc-segment-metadata, amc-audience-performance,
    # design §6.5 C1): one delivery per pack per complete calendar month. Pack 8 is per DSP
    # campaign (the amc-dsp-impressions corpus) and DSP segment; segment_shares of a campaign's
    # impressions and raw cost match each segment (overlapping, so they don't sum to 1), with 5
    # impressions per reached shopper and 4 % of them buying. Declared: DSP and ASI segment 41001
    # collide and stay separate rows (ADR-103 point 6); "Demo - Age 25-34" (Amazon) and the
    # Experian LiveRamp segment (third party) are classified in audience-segment-providers.yaml,
    # the two synthetic DSP segments are not ("Provider not recorded"); 41003's name carries an
    # embedded quote, backslash-escaped in the CSV. Shaped: 41004 first matches impressions the
    # month 13 before the shape_anchor month, when its name row comes back withheld, so its name
    # arrives the month after (design §5.4); the month before the shape_anchor month, Northstar
    # DSP 01's row for 41004 comes back withheld per path, a roster gap against the month before.
    audience_segments: {dsp_segments: [{id: "41001", name: "Demo - Age 25-34", description: "Shoppers aged 25 to 34"}, {id: "41002", name: "ExperianDemographicsGenderFemale_LiveRamp", description: "Gender segment from a third-party data provider"}, {id: "41003", name: "Synthetic in-market: \"Trail\" running shoes", description: "Shoppers in market for \"trail\" running shoes"}, {id: "41004", name: "Synthetic lifestyle: weekend gardeners", description: "Shoppers who garden at weekends"}], asi_segments: [{id: "41001", name: "Synthetic ASI in-market: running shoes", description: "Shoppers in market for running shoes", category_level_1: In-market, category_level_2: Sports and outdoors, category_path: "In-market > Sports and outdoors > Running shoes"}, {id: "52001", name: "Synthetic ASI lifestyle: home cooks", description: "Shoppers who cook at home", category_level_1: Lifestyle, category_level_2: Food and cooking, category_path: "Lifestyle > Food and cooking > Home cooks"}], segment_shares: ["0.30", "0.12", "0.18", "0.08"], impressions_per_shopper: 5, purchaser_rate: "0.04", purchases_per_purchaser: "1.25", order_value: "41.00", name_withheld: {month_offset: -13, segment: "41004"}, roster_gap: {month_offset: -1, segment: "41004", campaign: campaign:northstar-dsp}}
    # Packs 10-12 (amc-segment-buyer-profile-inmarket, -lifestyle, -dsp-exposed, design §5.5,
    # §6.5 C2): one delivery per pack per complete calendar month, one row per declared segment
    # and one profiled_total row. 2400 shoppers are profiled, 5 % of them buy in the month and 40 %
    # of those are new to the brand; each segment holds its exposed and buyer shares of the two
    # bases (overlapping, so they don't sum to 1). Declared: in-market 41009 isn't in pack 13's
    # metadata, so it reads by its ID with "name not available yet" (partial enrolment). Shaped:
    # packs 10-11 deliver only from the month 6 before the shape_anchor month, so earlier months
    # carry the standard path alone (ASI absent); the month 2 before, packs 12's and 11's
    # profiled_total rows come back withheld, so those deliveries' shares are not available; the
    # month 3 before, pack 12's row for 41004, and the month before, pack 10's row for 41009, come
    # back withheld per path with 3 and 2 shoppers (plan D19), roster gaps the month after.
    segment_profile: {profiled_exposed: 2400, buyer_rate: "0.05", ntb_share: "0.40", sources: {asi_in_market: {segments: ["41001", "41009"], exposed_shares: ["0.20", "0.10"], buyer_shares: ["0.35", "0.10"]}, asi_lifestyle: {segments: ["52001"], exposed_shares: ["0.25"], buyer_shares: ["0.30"]}, dsp_exposed_only: {segments: ["41001", "41002", "41003", "41004"], exposed_shares: ["0.30", "0.12", "0.18", "0.08"], buyer_shares: ["0.40", "0.12", "0.18", "0.06"]}}, asi_from: {month_offset: -6}, total_withheld: [{month_offset: -2, source: dsp_exposed_only}, {month_offset: -2, source: asi_lifestyle}], segment_withheld: [{month_offset: -3, source: dsp_exposed_only, segment: "41004", shoppers: 3}, {month_offset: -1, source: asi_in_market, segment: "41009", shoppers: 2}]}
    exposure_frequency: {bucket_shares: ["0.30", "0.18", "0.12", "0.09", "0.07", "0.05", "0.04", "0.03", "0.02", "0.10"], ten_plus_impressions: 14, purchaser_rates: ["0.020", "0.030", "0.038", "0.044", "0.048", "0.050", "0.051", "0.052", "0.052", "0.053"], account_share: "0.75", device_factor: "0.25", ntb_share: "0.40", purchases_per_purchaser: "1.25", order_value: "32.50", withheld_path: {month_offset: -2, cell: [10_plus, device_or_browser], shoppers: 3, ad_product: sponsored_products}, null_bucket: {month_offset: -4}}
    # Packs 14 and 15 (amc-acquisition-cohorts and -arp, design §6.6 B3): one delivery per cohort
    # vintage, the 13 calendar months ending with its as_of_month. Every cohort month and
    # acquisition group holds cohort_buyers x its group share, account_share of them Amazon account
    # IDs; repeat_rates[k-1] of a cohort buy again in follow-up month k, first_repeat_share of those
    # for the first time, cumulative repeaters summing the first-time ones; each buys
    # purchases_per_buyer times at order_value. The paid path's repeaters are arp_lift times the
    # account-ID repeat rate of the account IDs; a quarterly cohort's follow-up quarter j repeats at
    # quarter_lift x repeat_rates[j-1]. Shaped vintages (as_of_month offsets from the shape_anchor
    # month): refused (-3), whose one cohort size differs between two follow-up rows, so the load
    # refuses it (REPEATED_TOTAL_MISMATCH) and it is never landed; degraded (-2), monthly, where
    # the absent cohort and group returned no row at any k (out of the loss denominator), one cell
    # of 3 shoppers came back withheld per path with NULL repeat revenue and currency (plan D19),
    # and the oldest cohort's dsp_only follow-ups 7 to 12 didn't come back, so that slice grades
    # degraded; quarterly (-1), delivered under calendar-quarter cohorts because of it (plan D10).
    # Pack 15 follows: degraded vintage monthly, quarterly vintage quarterly; on the degraded
    # vintage its own count of the arp_check_gap cohort is one under pack 14's, so the ARP rate
    # reads "cohort sizes changed between runs".
    acquisition_cohorts: {cohort_buyers: 900, group_shares: ["0.30", "0.50", "0.20"], account_share: "0.75", repeat_rates: ["0.120", "0.100", "0.090", "0.085", "0.080", "0.076", "0.072", "0.070", "0.068", "0.066", "0.064", "0.062"], first_repeat_share: "0.60", purchases_per_buyer: "1.30", order_value: "28.00", arp_lift: "1.50", quarter_lift: "2.00", vintages: {refused: -3, degraded: -2, quarterly: -1}, absent: {cohort_offset: -8, group: dsp_only}, withheld: {cohort_offset: -5, k: 2, group: dsp_and_sponsored, shoppers: 3}, arp_check_gap: {cohort_offset: -10, group: sponsored_only}}
