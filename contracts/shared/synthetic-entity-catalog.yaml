bulk_campaign_scheme:
  count: 1000
  advertiser: advertiser:northstar
  marketplace: amazon_us
  platform: amazon_ads
  channel: amazon_dsp
  ad_product: amazon_dsp
  canonical_pattern: 'campaign:bulk-estate-{ordinal:04d}'
  source_namespace: amc.dsp.campaign_id_string
  source_pattern: '92000000000000{ordinal:04d}'
  name_pattern: 'Fictional Bulk Estate | Campaign {ordinal:04d}'
  valid_from: 2025-01-01
  scenario_cycle:
    - growth_ramp
    - sustained_decline
    - spike_and_fade
    - zero_conversion
    - flat_traffic_rising_conversion
    - coverage_gap
