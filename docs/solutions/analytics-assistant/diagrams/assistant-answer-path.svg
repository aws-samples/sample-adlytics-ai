      <text x="306" y="160">answer streams in</text>
      <text x="650" y="74">invokes as the</text>
      <text x="650" y="90">signed-in user</text>
      <text x="650" y="160">answer as it</text>
      <text x="650" y="176">is written</text>
      <text x="993" y="58">calls through</text>
      <text x="993" y="74">AgentCore</text>
