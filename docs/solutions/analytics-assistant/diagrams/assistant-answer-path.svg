      <text x="960" y="90">AgentCore Gateway</text>
      <text x="960" y="163">figures, or why</text>
      <text x="960" y="177">it can't answer</text>
      <text x="1292" y="76">queries with</text>
      <text x="1292" y="90">Athena</text>
      <text x="1292" y="163">rows from the</text>
      <text x="1292" y="177">published version</text>
      <text x="472" y="236" text-anchor="start">writes one record</text>
