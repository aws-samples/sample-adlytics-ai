    <rect x="1026" y="70" width="200" height="100" rx="10" fill="#f3fbf6" stroke="#2e7d4f"/>
    <path d="M1358 84 V156 A100 14 0 0 0 1558 156 V84" fill="#f2f8fe" stroke="#2f6fb2"/>
