    <text x="64" y="595">Your published data</text>
    <rect x="30" y="610" width="24" height="16" rx="3" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
    <text x="64" y="623">Quality records and checks</text>
    <line x1="30" y1="646" x2="54" y2="646" stroke="#536275" stroke-width="2"/>
