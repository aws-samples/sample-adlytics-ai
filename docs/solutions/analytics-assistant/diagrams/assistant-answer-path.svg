      <text x="472" y="268" text-anchor="start">the answer ends</text>
      <text x="628" y="344">a sample of</text>
      <text x="628" y="358">complete turns</text>
      <text x="960" y="344">scores of</text>
      <text x="960" y="358">sampled turns</text>
      <text x="794" y="490">turn records, read on request</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="1300" y="262" font-size="14" font-weight="bold">Legend</text>
    <rect x="1300" y="280" width="22" height="14" rx="3" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/>
    <text x="1332" y="292">You and your browser</text>
    <rect x="1300" y="304" width="22" height="14" rx="3" fill="#fff7f2" stroke="#b54545" stroke-width="2"/>
