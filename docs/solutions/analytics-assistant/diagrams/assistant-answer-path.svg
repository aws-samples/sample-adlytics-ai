    <text x="1332" y="412">Quality records and checks</text>
    <line x1="1300" y1="432" x2="1322" y2="432" stroke="#536275" stroke-width="2"/>
    <text x="1332" y="436">Request, reply or write</text>
    <line x1="1300" y1="456" x2="1322" y2="456" stroke="#536275" stroke-width="2" stroke-dasharray="3 4"/>
    <text x="1332" y="460">Asynchronous, sampled</text>
  </g>
</svg>
