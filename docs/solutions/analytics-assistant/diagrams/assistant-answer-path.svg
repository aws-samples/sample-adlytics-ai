    <rect x="362" y="330" width="200" height="100" rx="10" fill="#fff4e0" stroke="#c77700"/>
    <rect x="694" y="330" width="200" height="100" rx="10" fill="#fff4e0" stroke="#c77700"/>
    <rect x="1026" y="330" width="200" height="100" rx="10" fill="#fff7f2" stroke="#b54545"/>
  </g>
  <g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#assistant-answer-path-arrow)">
    <line x1="230" y1="100" x2="360" y2="100"/>
    <line x1="362" y1="145" x2="232" y2="145"/>
    <line x1="562" y1="100" x2="692" y2="100"/>
    <line x1="694" y1="145" x2="564" y2="145"/>
    <line x1="894" y1="100" x2="1024" y2="100"/>
    <line x1="1026" y1="145" x2="896" y2="145"/>
    <line x1="1226" y1="100" x2="1356" y2="100"/>
    <line x1="1358" y1="145" x2="1228" y2="145"/>
    <line x1="462" y1="170" x2="462" y2="328"/>
    <line x1="562" y1="370" x2="692" y2="370" stroke-dasharray="3 4"/>
    <line x1="894" y1="370" x2="1024" y2="370"/>
    <path d="M462 430 V470 H1126 V432"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <g font-size="15" font-weight="bold">
      <text x="130" y="104">Browser</text>
      <text x="462" y="100">Conversation API</text>
      <text x="794" y="104">Agent</text>
      <text x="1126" y="104">Governed tools</text>
      <text x="1458" y="118">Published data</text>
      <text x="462" y="362">Audit record</text>
      <text x="794" y="360">Online evaluation</text>
      <text x="1126" y="362">Quality review</text>
    </g>
    <g font-size="13" fill="#536275">
      <text x="130" y="126">You ask on any page</text>
      <text x="130" y="144">Cognito sign-in</text>
      <text x="462" y="120">Lambda</text>
      <text x="462" y="138">checks sign-in, screens</text>
      <text x="462" y="154">with Bedrock Guardrails</text>
      <text x="794" y="126">Amazon Bedrock AgentCore</text>
      <text x="794" y="144">chooses tools, explains</text>
      <text x="1126" y="126">Lambda + Athena</text>
      <text x="1126" y="144">compute every figure</text>
      <text x="1458" y="138">S3 data lake</text>
      <text x="1458" y="154">immutable versions</text>
