<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" focusable="false" aria-labelledby="assistant-answer-path-title assistant-answer-path-desc">
  <title id="assistant-answer-path-title">Call-flow diagram: how the assistant answers a question, and how its answers are checked</title>
  <desc id="assistant-answer-path-desc">A signed-in user asks a question in the browser. The Conversation API checks the sign-in, screens the question with Amazon Bedrock Guardrails and invokes the agent on Amazon Bedrock AgentCore as that user. The agent chooses governed tools and calls them through AgentCore Gateway; the tools compute every figure with Athena from the published data, or say why they cannot answer, and the answer streams back to the browser as it is written. The Conversation API writes one audit record per turn, with no question or answer text, before the answer ends. When optional online evaluation is on, dev only today, it also writes each complete turn's exact question and released answer to the evaluation outbox. Online evaluation scores a sample of those turns, 10% by default, keeps the scores in protected result log groups and raises an alarm when poor scores rise. Entitled operators read redacted turn records and scores through the protected quality review API.</desc>
