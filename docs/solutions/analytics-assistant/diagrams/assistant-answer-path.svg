<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 520" role="img" focusable="false" aria-labelledby="assistant-answer-path-title assistant-answer-path-desc">
  <title id="assistant-answer-path-title">Call-flow diagram: how the assistant answers a question, and how its answers are checked</title>
  <desc id="assistant-answer-path-desc">A signed-in user asks a question in the browser. The Conversation API checks the sign-in, screens the question with Amazon Bedrock Guardrails and invokes the agent on Amazon Bedrock AgentCore as that user. The agent chooses governed tools and calls them through AgentCore Gateway; the tools compute every figure with Athena from the published data, or say why they cannot answer, and the answer streams back to the browser as it is written. The Conversation API writes one audit record per turn, with no question or answer text, before the answer ends. Optional online evaluation, dev only today, scores a sample of complete turns, 10% by default, and raises an alarm when poor scores rise. Entitled operators read redacted turn records and scores through the protected quality review API.</desc>
