<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 130 1440 490" role="img" focusable="false" aria-labelledby="camp-flow-title camp-flow-desc">
  <title id="camp-flow-title">Call-flow diagram: how the Campaigns page gets its figures and insight text, from your data to your browser</title>
  <desc id="camp-flow-desc">Your AMC pipeline, which you run from another AWS account, lands query results in the data lake, where they are checked against the data contracts. Each new version starts a page bake on AWS Lambda and Amazon Athena that computes every campaign for each window and channel and stores the finished pages. The sign-in and page API, on Amazon CloudFront, AWS WAF, Amazon Cognito and Lambda, serves the current page to the Campaigns portfolio, table and campaign detail in your browser. For insight cards, the API gives an Amazon Bedrock model the page's own figures and gets back insight text, kept per page revision; the model follows a prompt version that is active only after its calibration passes. Customer deployments refresh one page at a time; only the dev environment refreshes every affected page as one set.</desc>
  <defs>
    <marker id="camp-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker>
  </defs>
  <rect x="0" y="130" width="1440" height="490" fill="#ffffff"/>
  <g stroke-width="2">
    <rect x="20" y="150" width="160" height="140" rx="10" fill="#ffffff" stroke="#9aa8bb"/>
    <path d="M268 164 V276 A80 14 0 0 0 428 276 V164" fill="#f2f8fe" stroke="#2f6fb2"/>
    <ellipse cx="348" cy="164" rx="80" ry="14" fill="#f2f8fe" stroke="#2f6fb2"/>
    <rect x="516" y="150" width="160" height="140" rx="10" fill="#f3fbf6" stroke="#2e7d4f"/>
    <path d="M764 164 V276 A80 14 0 0 0 924 276 V164" fill="#f2f8fe" stroke="#2f6fb2"/>
    <ellipse cx="844" cy="164" rx="80" ry="14" fill="#f2f8fe" stroke="#2f6fb2"/>
    <rect x="1012" y="150" width="160" height="140" rx="10" fill="#fff7f2" stroke="#b54545"/>
    <rect x="1260" y="150" width="160" height="140" rx="10" fill="#ffffff" stroke="#9aa8bb" stroke-width="3"/>
    <rect x="516" y="360" width="160" height="120" rx="10" fill="#fff4e0" stroke="#c77700"/>
    <rect x="764" y="360" width="160" height="120" rx="10" fill="#f8f5ff" stroke="#6b4fbb"/>
  </g>
  <g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#camp-flow-arrow)">
    <line x1="180" y1="220" x2="266" y2="220"/>
    <line x1="428" y1="220" x2="514" y2="220"/>
    <line x1="676" y1="220" x2="762" y2="220"/>
    <line x1="924" y1="220" x2="1010" y2="220"/>
    <line x1="1172" y1="220" x2="1258" y2="220"/>
    <line x1="676" y1="420" x2="762" y2="420"/>
  </g>
  <g fill="none" stroke="#536275" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#camp-flow-arrow)">
    <path d="M1060 290 V395 H926"/>
    <path d="M924 455 H1124 V292"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <g font-size="19" font-weight="bold">
      <text x="100" y="196">Your AMC</text>
      <text x="100" y="218">pipeline</text>
      <text x="348" y="206">Data lake</text>
      <text x="596" y="196">Page bake</text>
      <text x="844" y="212">Baked pages</text>
      <text x="1092" y="196">Sign-in and</text>
      <text x="1092" y="218">page API</text>
      <text x="1340" y="206">Campaigns</text>
      <text x="596" y="400">Prompt</text>
      <text x="844" y="396">Insight</text>
      <text x="844" y="418">narration</text>
    </g>
    <g font-size="15" fill="#536275">
      <text x="100" y="250">you run it, from</text>
      <text x="100" y="270">another account</text>
      <text x="348" y="238">Amazon S3, Glue;</text>
      <text x="348" y="256">checked against</text>
      <text x="348" y="274">data contracts</text>
      <text x="596" y="228">AWS Lambda,</text>
      <text x="596" y="248">Amazon Athena;</text>
      <text x="596" y="268">every campaign</text>
      <text x="844" y="244">Amazon S3,</text>
      <text x="844" y="264">Amazon DynamoDB</text>
      <text x="1092" y="250">CloudFront, WAF,</text>
      <text x="1092" y="270">Cognito, Lambda</text>
      <text x="1340" y="240">portfolio, table</text>
      <text x="1340" y="260">and detail</text>
      <text x="596" y="428">active only after</text>
      <text x="596" y="448">calibration</text>
      <text x="596" y="468">passes</text>
      <text x="844" y="446">Amazon Bedrock;</text>
      <text x="844" y="466">explains the page</text>
    </g>
    <g font-size="14">
      <text x="224" y="190">query</text>
      <text x="224" y="207">results</text>
      <text x="472" y="190">new</text>
      <text x="472" y="207">version</text>
      <text x="720" y="174">pages per</text>
      <text x="720" y="190">window and</text>
      <text x="720" y="207">channel</text>
      <text x="968" y="190">current</text>
      <text x="968" y="207">page</text>
      <text x="1216" y="190">served</text>
      <text x="1216" y="207">page</text>
      <text x="720" y="410">instructs</text>
      <text x="993" y="387">page figures</text>
      <text x="1024" y="475">insight text per revision</text>
    </g>
    <text x="20" y="525" font-size="15" fill="#536275" text-anchor="start">Customer deployments refresh one page at a time after each new data version. Only the dev environment refreshes every affected page as one set.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033" stroke-width="2">
    <text x="20" y="576" font-weight="bold">Key:</text>
    <rect x="70" y="563" width="26" height="16" rx="3" fill="#ffffff" stroke="#9aa8bb"/>
    <text x="104" y="576">outside system or a page</text>
    <rect x="319" y="563" width="26" height="16" rx="3" fill="#f2f8fe" stroke="#2f6fb2"/>
    <text x="353" y="576">data and storage</text>
    <rect x="506" y="563" width="26" height="16" rx="3" fill="#f3fbf6" stroke="#2e7d4f"/>
    <text x="540" y="576">computes figures, no AI</text>
    <rect x="747" y="563" width="26" height="16" rx="3" fill="#fff7f2" stroke="#b54545"/>
    <text x="781" y="576">sign-in and access control</text>
    <rect x="1011" y="563" width="26" height="16" rx="3" fill="#ffffff" stroke="#9aa8bb" stroke-width="3"/>
    <text x="1045" y="576">this solution's pages</text>
    <rect x="70" y="591" width="26" height="16" rx="3" fill="#f8f5ff" stroke="#6b4fbb"/>
    <text x="104" y="604">AI model, writes text</text>
    <rect x="319" y="591" width="26" height="16" rx="3" fill="#fff4e0" stroke="#c77700"/>
    <text x="353" y="604">quality check</text>
    <line x1="496" y1="599" x2="530" y2="599" stroke="#536275" stroke-dasharray="6 4" marker-end="url(#camp-flow-arrow)"/>
    <text x="540" y="604">runs separately from the bake</text>
  </g>
</svg>
