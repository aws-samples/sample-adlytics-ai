<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 130 1440 470" role="img" focusable="false" aria-labelledby="perf-flow-title perf-flow-desc">
  <title id="perf-flow-title">Call-flow diagram: how the Growth check and Scorecard get their figures, from your data to your browser</title>
  <desc id="perf-flow-desc">Your AMC pipeline, which you run from another AWS account, lands query results in the data lake, where they are checked against the data contracts. Each new version starts a page bake on AWS Lambda and Amazon Athena that computes the Scorecard for each window with the metric layer and stores the finished page. The sign-in and page API, on Amazon CloudFront, AWS WAF, Amazon Cognito and Lambda, serves the current page to the Scorecard in your browser, and serves four pages to the Growth check, which shows them on one screen. A dashed box shows Vendor Central reports, the source of shipped sales, which can't be landed in a customer deployment yet. Customer deployments refresh one page at a time; only the dev environment refreshes every affected page as one set.</desc>
  <defs>
    <marker id="perf-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker>
  </defs>
  <rect x="0" y="130" width="1440" height="470" fill="#ffffff"/>
  <g stroke-width="2">
    <rect x="20" y="150" width="160" height="140" rx="10" fill="#ffffff" stroke="#9aa8bb"/>
    <path d="M268 164 V276 A80 14 0 0 0 428 276 V164" fill="#f2f8fe" stroke="#2f6fb2"/>
    <ellipse cx="348" cy="164" rx="80" ry="14" fill="#f2f8fe" stroke="#2f6fb2"/>
    <rect x="516" y="150" width="160" height="140" rx="10" fill="#f3fbf6" stroke="#2e7d4f"/>
    <path d="M764 164 V276 A80 14 0 0 0 924 276 V164" fill="#f2f8fe" stroke="#2f6fb2"/>
    <ellipse cx="844" cy="164" rx="80" ry="14" fill="#f2f8fe" stroke="#2f6fb2"/>
    <rect x="1012" y="150" width="160" height="140" rx="10" fill="#fff7f2" stroke="#b54545"/>
    <rect x="1260" y="150" width="160" height="140" rx="10" fill="#eef1f5" stroke="#536275" stroke-width="3"/>
    <rect x="20" y="360" width="160" height="120" rx="10" fill="#ffffff" stroke="#9aa8bb" stroke-dasharray="5 4"/>
    <rect x="1260" y="360" width="160" height="120" rx="10" fill="#eef1f5" stroke="#536275" stroke-width="3"/>
  </g>
  <g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#perf-flow-arrow)">
    <line x1="180" y1="220" x2="266" y2="220"/>
    <line x1="428" y1="220" x2="514" y2="220"/>
    <line x1="676" y1="220" x2="762" y2="220"/>
    <line x1="924" y1="220" x2="1010" y2="220"/>
    <line x1="1172" y1="220" x2="1258" y2="220"/>
    <path d="M1092 290 V420 H1258"/>
  </g>
  <g fill="none" stroke="#536275" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#perf-flow-arrow)">
    <path d="M180 420 H348 V292"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <g font-size="19" font-weight="bold">
      <text x="100" y="196">Your AMC</text>
      <text x="100" y="218">pipeline</text>
      <text x="348" y="206">Data lake</text>
      <text x="596" y="196">Page bake</text>
      <text x="844" y="212">Baked pages</text>
      <text x="1092" y="196">Sign-in and</text>
      <text x="1092" y="218">page API</text>
      <text x="1340" y="206">Scorecard</text>
      <text x="100" y="400">Vendor</text>
      <text x="100" y="422">Central</text>
      <text x="1340" y="400">Growth check</text>
    </g>
    <g font-size="15" fill="#536275">
      <text x="100" y="250">you run it, from</text>
      <text x="100" y="270">another account</text>
      <text x="348" y="238">Amazon S3, Glue;</text>
      <text x="348" y="256">checked against</text>
      <text x="348" y="274">data contracts</text>
      <text x="596" y="228">AWS Lambda,</text>
      <text x="596" y="248">Amazon Athena,</text>
      <text x="596" y="268">metric layer</text>
      <text x="844" y="244">Amazon S3,</text>
      <text x="844" y="264">Amazon DynamoDB</text>
      <text x="1092" y="250">CloudFront, WAF,</text>
      <text x="1092" y="270">Cognito, Lambda</text>
      <text x="1340" y="240">in your browser,</text>
      <text x="1340" y="260">after sign-in</text>
      <text x="100" y="450">reports: can't be</text>
      <text x="100" y="468">landed yet</text>
      <text x="1340" y="432">four pages on</text>
      <text x="1340" y="452">one screen</text>
    </g>
    <g font-size="14">
      <text x="224" y="190">query</text>
      <text x="224" y="207">results</text>
      <text x="472" y="190">new</text>
      <text x="472" y="207">version</text>
      <text x="720" y="190">one page</text>
      <text x="720" y="207">per window</text>
      <text x="968" y="190">current</text>
      <text x="968" y="207">page</text>
      <text x="1216" y="190">served</text>
      <text x="1216" y="207">page</text>
      <text x="264" y="410">shipped sales</text>
      <text x="264" y="442">not built yet</text>
      <text x="1175" y="410">four served pages</text>
    </g>
    <text x="20" y="525" font-size="15" fill="#536275" text-anchor="start">Customer deployments refresh one page at a time after each new data version. Only the dev environment refreshes every affected page as one set.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033" stroke-width="2">
    <text x="20" y="576" font-weight="bold">Key:</text>
    <rect x="70" y="563" width="26" height="16" rx="3" fill="#ffffff" stroke="#9aa8bb"/>
    <text x="104" y="576">outside system or a page</text>
    <rect x="319" y="563" width="26" height="16" rx="3" fill="#f2f8fe" stroke="#2f6fb2"/>
    <text x="353" y="576">data and storage</text>
    <rect x="506" y="563" width="26" height="16" rx="3" fill="#f3fbf6" stroke="#2e7d4f"/>
    <text x="540" y="576">computes figures, no AI</text>
    <rect x="747" y="563" width="26" height="16" rx="3" fill="#fff7f2" stroke="#b54545"/>
    <text x="781" y="576">sign-in and access control</text>
    <rect x="1011" y="563" width="26" height="16" rx="3" fill="#ffffff" stroke="#9aa8bb" stroke-dasharray="5 4"/>
    <text x="1045" y="576">not built yet</text>
    <rect x="1175" y="563" width="26" height="16" rx="3" fill="#eef1f5" stroke="#536275" stroke-width="3"/>
    <text x="1209" y="576">this solution's pages</text>
  </g>
</svg>
