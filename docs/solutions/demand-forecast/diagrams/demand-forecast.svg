<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 840" role="img" focusable="false" aria-labelledby="df-title df-desc">
  <title id="df-title">Call-flow diagram: how the Demand forecast page and chat tools get their figures</title>
  <desc id="df-desc">Vendor Central sales and traffic history in the governed data lake feeds the weekly input, which a daily EventBridge Scheduler check starts and Step Functions and AWS Lambda stage per product; a customer deployment can't land Vendor Central reports yet, and the dev environment holds synthetic ones. SageMaker Processing jobs with no network access backtest and forecast each shard with Chronos-2, ETS and SeasonalNaive. The quality gate and publisher, on AWS Lambda, show Chronos-2 only where it beats both simple models, withhold the rest with a reason, and publish one immutable generation to the forecast store in Amazon DynamoDB under one CURRENT pointer. The forecast read function serves stored values through two GET routes on the HTTP API, behind the session authorizer, to the Demand forecast page in the signed-in user's browser. The forecast tool function runs the same read service behind AgentCore Gateway, which carries the user's identity, and returns the stored figures to the Amazon Bedrock AgentCore agent, whose answer appears in chat beside the page. Nothing is computed at read time; display rounding is the only arithmetic.</desc>
