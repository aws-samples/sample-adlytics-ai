      <text x="30" y="640" font-size="15" font-weight="bold">Nothing computed at read time</text>
      <text x="30" y="662">The page, the API and the tools serve only the figures</text>
      <text x="30" y="680">the forecast run stored; display rounding is the only arithmetic.</text>
      <text x="717" y="640" font-size="15" font-weight="bold">Vendor Central history</text>
