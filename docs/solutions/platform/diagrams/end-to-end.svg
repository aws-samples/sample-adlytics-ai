<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 570" role="img" focusable="false" aria-labelledby="end-to-end-title end-to-end-desc">
  <title id="end-to-end-title">Architecture diagram: Adlytics AI end to end, from your AMC data to pages and answers in the browser</title>
  <desc id="end-to-end-desc">Your extraction pipeline, in a separate producer AWS account, runs the declared AMC SQL and lands each result in the deployment's data landing bucket, which accepts AMC query packs only and refuses a delivery that fails its data contract; Vendor Central reports can't be landed yet. A valid delivery is published as an immutable version in the data lake. The metric layer computes figures from it with tested SQL on Athena. Page baking builds pages from those figures, one page at a time in a customer deployment; only the dev environment builds every page as one set. The analytics assistant calls the metric layer as tools. Pages and answers reach the signed-in browser through the secure edge: CloudFront, AWS WAF and Cognito sign-in. Everything except your pipeline and the browser runs in one deployment AWS account created by make deploy-all.</desc>
  <defs>
    <marker id="end-to-end-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker>
  </defs>
  <rect x="0" y="0" width="1480" height="570" fill="#ffffff"/>
  <g fill="none" stroke="#536275" stroke-width="1.5">
    <rect x="16" y="20" width="190" height="390" rx="6"/>
    <rect x="216" y="20" width="1064" height="390" rx="6"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#536275">
    <text x="28" y="44">Your producer</text>
    <text x="28" y="62">AWS account</text>
    <text x="230" y="44">Your deployment AWS account, created by make deploy-all</text>
  </g>
  <g stroke-width="2">
    <rect x="36" y="155" width="150" height="150" rx="10" fill="#ffffff" stroke="#9aa8bb"/>
    <rect x="290" y="155" width="150" height="150" rx="10" fill="#fff4e0" stroke="#c77700"/>
    <path d="M496 169 V291 A75 14 0 0 0 646 291 V169" fill="#f2f8fe" stroke="#2f6fb2"/>
    <ellipse cx="571" cy="169" rx="75" ry="14" fill="#f2f8fe" stroke="#2f6fb2"/>
    <rect x="702" y="155" width="150" height="150" rx="10" fill="#f3fbf6" stroke="#2e7d4f"/>
    <rect x="908" y="50" width="150" height="150" rx="10" fill="#f3fbf6" stroke="#2e7d4f"/>
    <rect x="908" y="250" width="150" height="150" rx="10" fill="#f8f5ff" stroke="#6b4fbb"/>
    <rect x="1114" y="155" width="150" height="150" rx="10" fill="#fff7f2" stroke="#b54545"/>
    <rect x="1330" y="170" width="130" height="120" rx="10" fill="#ffffff" stroke="#9aa8bb"/>
  </g>
  <g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#end-to-end-arrow)">
    <line x1="186" y1="230" x2="288" y2="230"/>
    <line x1="440" y1="230" x2="494" y2="230"/>
    <line x1="646" y1="230" x2="700" y2="230"/>
    <line x1="852" y1="180" x2="906" y2="180"/>
    <line x1="852" y1="275" x2="906" y2="275"/>
    <line x1="1058" y1="180" x2="1112" y2="180"/>
    <line x1="1058" y1="275" x2="1112" y2="275"/>
    <line x1="1264" y1="230" x2="1328" y2="230"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <g font-size="16" font-weight="bold">
      <text x="111" y="186">Your extraction</text>
      <text x="111" y="205">pipeline</text>
      <text x="365" y="188">Data landing</text>
      <text x="571" y="206">Data lake</text>
      <text x="777" y="192">Metric layer</text>
      <text x="983" y="80">Page baking</text>
      <text x="983" y="278">Analytics</text>
      <text x="983" y="297">assistant</text>
      <text x="1189" y="192">Secure edge</text>
      <text x="1395" y="222">Browser</text>
    </g>
    <g font-size="14">
      <text x="111" y="232">runs the declared</text>
      <text x="111" y="250">AMC SQL</text>
      <text x="111" y="274" fill="#536275">Vendor Central</text>
      <text x="111" y="292" fill="#536275">reports: not yet</text>
      <text x="365" y="214">S3 landing bucket.</text>
      <text x="365" y="232">AMC query packs</text>
      <text x="365" y="250">only. Refuses a</text>
      <text x="365" y="268">delivery that fails</text>
      <text x="365" y="286">its data contract</text>
      <text x="571" y="230">immutable versions</text>
      <text x="571" y="248">and a pointer to</text>
      <text x="571" y="266">the current one</text>
      <text x="571" y="288" fill="#536275">S3, Glue, DynamoDB</text>
      <text x="777" y="218">declared metrics,</text>
      <text x="777" y="236">computed by tested</text>
      <text x="777" y="254">SQL</text>
      <text x="777" y="280" fill="#536275">Lambda + Athena</text>
      <text x="983" y="104">rebuilds a page</text>
      <text x="983" y="122">on new data,</text>
      <text x="983" y="140">one page at a time</text>
      <text x="983" y="166" font-style="italic">Dev environment only:</text>
      <text x="983" y="184" font-style="italic">every page as one set</text>
      <text x="983" y="322">writes the words;</text>
      <text x="983" y="340">every figure comes</text>
      <text x="983" y="358">from a metric tool</text>
      <text x="983" y="382" fill="#536275">Amazon Bedrock</text>
      <text x="1189" y="218">CloudFront,</text>
      <text x="1189" y="236">AWS WAF,</text>
      <text x="1189" y="254">Cognito sign-in,</text>
      <text x="1189" y="272">HttpOnly session</text>
      <text x="1189" y="290">cookie</text>
      <text x="1395" y="246">your team,</text>
      <text x="1395" y="264">signed in</text>
    </g>
    <g font-size="12">
      <text x="253" y="222">lands</text>
      <text x="467" y="222">publishes</text>
      <text x="673" y="222">read by</text>
      <text x="879" y="172">figures</text>
      <text x="879" y="267">figures</text>
      <text x="1085" y="172">pages</text>
      <text x="1085" y="267">answers</text>
      <text x="1305" y="222">HTTPS</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="30" y="452" font-weight="bold">Legend</text>
    <rect x="30" y="470" width="30" height="20" rx="4" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/>
    <text x="70" y="485">You, your team or your pipeline</text>
    <rect x="390" y="470" width="30" height="20" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
    <text x="430" y="485">Validation gate</text>
    <rect x="640" y="470" width="30" height="20" rx="4" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/>
    <text x="680" y="485">Data and storage</text>
    <rect x="900" y="470" width="30" height="20" rx="4" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/>
    <text x="940" y="485">Tested computation, no AI</text>
    <rect x="30" y="515" width="30" height="20" rx="4" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/>
    <text x="70" y="530">AI agent: words, never figures</text>
    <rect x="390" y="515" width="30" height="20" rx="4" fill="#fff7f2" stroke="#b54545" stroke-width="2"/>
    <text x="430" y="530">Sign-in and security</text>
    <rect x="640" y="515" width="30" height="20" rx="4" fill="none" stroke="#536275" stroke-width="1.5"/>
    <text x="680" y="530">AWS account boundary</text>
    <line x1="900" y1="525" x2="928" y2="525" stroke="#536275" stroke-width="2" marker-end="url(#end-to-end-arrow)"/>
    <text x="940" y="530">Data or request flow, labelled with what moves</text>
  </g>
</svg>
