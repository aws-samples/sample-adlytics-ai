<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 880" role="img" focusable="false" aria-labelledby="end-to-end-title end-to-end-desc">
  <title id="end-to-end-title">Architecture diagram: Adlytics AI end to end, from your AMC data to pages and answers in the browser</title>
  <desc id="end-to-end-desc">Your extraction pipeline, in a separate producer AWS account, runs the declared AMC SQL and lands each result in the deployment's data landing bucket, which accepts AMC query packs only and refuses a delivery that fails its data contract; Vendor Central reports can't be landed yet. A valid delivery is published as an immutable version in the data lake. The metric layer computes figures from it with tested SQL on Athena. Page baking builds pages from those figures, one page at a time by default; the opt-in operational status plane, once cut over to GRAPH mode, builds every page as one set. Insight narration on Amazon Bedrock writes the text of the insight cards that aren't fixed rules, from a page's own figures, and that text joins the served page by its revision. The analytics assistant calls the metric layer as tools. Pages, card text and answers reach the signed-in browser through the secure edge: CloudFront, AWS WAF and Cognito sign-in. Everything except your pipeline and the browser runs in one deployment AWS account created by make deploy-all.</desc>
  <defs>
    <marker id="end-to-end-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker>
  </defs>
  <rect x="0" y="0" width="1130" height="880" fill="#ffffff"/>
  <g fill="none" stroke="#536275" stroke-width="1.5">
    <rect x="14" y="20" width="212" height="260" rx="6"/>
    <rect x="256" y="20" width="858" height="700" rx="6"/>
  </g>
  <g fill="#ffffff">
    <rect x="221" y="146" width="46" height="19"/>
    <rect x="207" y="493" width="54" height="19"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#536275">
    <text x="26" y="44">Your producer</text>
    <text x="26" y="63">AWS account</text>
    <text x="272" y="46">Your deployment AWS account, created by make deploy-all</text>
  </g>
  <g stroke-width="2">
    <rect x="30" y="80" width="180" height="180" rx="10" fill="#ffffff" stroke="#9aa8bb"/>
    <rect x="280" y="80" width="170" height="180" rx="10" fill="#fff4e0" stroke="#c77700"/>
    <path d="M540 94 V246 A90 14 0 0 0 720 246 V94" fill="#f2f8fe" stroke="#2f6fb2"/>
    <ellipse cx="630" cy="94" rx="90" ry="14" fill="#f2f8fe" stroke="#2f6fb2"/>
    <rect x="800" y="80" width="180" height="180" rx="10" fill="#f3fbf6" stroke="#2e7d4f"/>
    <rect x="800" y="330" width="180" height="170" rx="10" fill="#f3fbf6" stroke="#2e7d4f"/>
    <rect x="540" y="330" width="180" height="132" rx="10" fill="#f8f5ff" stroke="#6b4fbb"/>
    <rect x="800" y="550" width="180" height="150" rx="10" fill="#f8f5ff" stroke="#6b4fbb"/>
    <rect x="280" y="330" width="170" height="370" rx="10" fill="#fff7f2" stroke="#b54545"/>
    <rect x="30" y="445" width="170" height="140" rx="10" fill="#ffffff" stroke="#9aa8bb"/>
  </g>
  <g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#end-to-end-arrow)">
    <line x1="210" y1="170" x2="278" y2="170"/>
    <line x1="450" y1="170" x2="538" y2="170"/>
    <line x1="720" y1="170" x2="798" y2="170"/>
    <line x1="890" y1="260" x2="890" y2="328"/>
    <path d="M980 170 H1040 V625 H982"/>
    <line x1="800" y1="375" x2="722" y2="375"/>
    <line x1="540" y1="375" x2="452" y2="375"/>
    <line x1="800" y1="488" x2="452" y2="488"/>
    <line x1="800" y1="625" x2="452" y2="625"/>
    <line x1="280" y1="515" x2="202" y2="515"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <g font-size="17" font-weight="bold">
      <text x="120" y="112">Your extraction</text>
      <text x="120" y="132">pipeline</text>
      <text x="365" y="112">Data landing</text>
      <text x="630" y="135">Data lake</text>
      <text x="890" y="112">Metric layer</text>
      <text x="890" y="360">Page baking</text>
      <text x="630" y="358">Insight narration</text>
      <text x="890" y="580">Analytics</text>
      <text x="890" y="600">assistant</text>
      <text x="365" y="490">Secure edge</text>
      <text x="115" y="508">Browser</text>
    </g>
    <g font-size="15">
      <text x="120" y="162">runs the declared</text>
      <text x="120" y="181">AMC SQL</text>
      <text x="120" y="216" fill="#536275">Vendor Central</text>
      <text x="120" y="235" fill="#536275">reports: not yet</text>
      <text x="365" y="140">S3 landing bucket.</text>
      <text x="365" y="160">AMC query packs</text>
      <text x="365" y="180">only. Refuses a</text>
      <text x="365" y="200">delivery that fails</text>
      <text x="365" y="220">its data contract</text>
      <text x="630" y="165">immutable versions</text>
      <text x="630" y="185">and a pointer to</text>
      <text x="630" y="205">the current one</text>
      <text x="630" y="235" fill="#536275">S3, Glue, DynamoDB</text>
      <text x="890" y="145">declared metrics,</text>
      <text x="890" y="165">computed by tested</text>
      <text x="890" y="185">SQL</text>
      <text x="890" y="225" fill="#536275">Lambda + Athena</text>
      <text x="890" y="388">rebuilds a page</text>
      <text x="890" y="408">on new data,</text>
      <text x="890" y="428">one page at a time</text>
      <text x="890" y="458" font-style="italic">Opt-in plane in GRAPH:</text>
      <text x="890" y="478" font-style="italic">every page as one set</text>
      <text x="630" y="384">writes the text of</text>
      <text x="630" y="404">cards that aren't</text>
      <text x="630" y="424">fixed rules</text>
      <text x="630" y="450" fill="#536275">Amazon Bedrock</text>
      <text x="890" y="628">writes the words;</text>
      <text x="890" y="648">every figure comes</text>
      <text x="890" y="668">from a metric tool</text>
      <text x="890" y="690" fill="#536275">Amazon Bedrock</text>
      <text x="365" y="518">CloudFront,</text>
      <text x="365" y="538">AWS WAF,</text>
      <text x="365" y="558">Cognito sign-in,</text>
      <text x="365" y="578">HttpOnly session</text>
      <text x="365" y="598">cookie</text>
      <text x="115" y="535">your team,</text>
      <text x="115" y="555">signed in</text>
    </g>
    <g font-size="15">
      <text x="244" y="160">lands</text>
      <text x="494" y="160">publishes</text>
      <text x="759" y="160">read by</text>
      <text x="880" y="300" text-anchor="end">figures</text>
      <text x="1048" y="400" text-anchor="start">figures</text>
      <text x="761" y="366">figures</text>
      <text x="496" y="350">card text,</text>
      <text x="496" y="366">by revision</text>
      <text x="626" y="481">pages</text>
      <text x="626" y="617">answers</text>
      <text x="234" y="507">HTTPS</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033">
    <text x="30" y="760" font-weight="bold">Legend</text>
    <rect x="30" y="774" width="30" height="20" rx="4" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/>
    <text x="70" y="789">You, your team or your pipeline</text>
    <rect x="400" y="774" width="30" height="20" rx="4" fill="#fff4e0" stroke="#c77700" stroke-width="2"/>
    <text x="440" y="789">Validation gate</text>
    <rect x="770" y="774" width="30" height="20" rx="4" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/>
    <text x="810" y="789">Data and storage</text>
    <rect x="30" y="808" width="30" height="20" rx="4" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/>
    <text x="70" y="823">Tested computation, no AI</text>
    <rect x="400" y="808" width="30" height="20" rx="4" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/>
    <text x="440" y="823">AI model: writes words, not figures</text>
    <rect x="770" y="808" width="30" height="20" rx="4" fill="#fff7f2" stroke="#b54545" stroke-width="2"/>
    <text x="810" y="823">Sign-in and security</text>
    <rect x="30" y="842" width="30" height="20" rx="4" fill="none" stroke="#536275" stroke-width="1.5"/>
    <text x="70" y="857">AWS account boundary</text>
    <line x1="400" y1="852" x2="428" y2="852" stroke="#536275" stroke-width="2" marker-end="url(#end-to-end-arrow)"/>
    <text x="440" y="857">Flow, labelled with what moves</text>
  </g>
</svg>
