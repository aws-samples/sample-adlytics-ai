      <text x="1165" y="356">Products and ads</text>
      <text x="478" y="510">Insight narration</text>
    </g>
    <g font-size="13" fill="#536275">
      <text x="135" y="77">Sales, traffic, products and</text>
      <text x="135" y="92">reported totals; can't be</text>
      <text x="135" y="107">landed in a customer</text>
      <text x="135" y="122">deployment yet</text>
      <text x="135" y="212">Your AMC instance: ad</text>
