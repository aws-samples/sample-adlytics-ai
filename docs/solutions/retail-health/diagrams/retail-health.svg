  </g>
  <g fill="none" stroke="#536275" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#rh-arrow)">
    <line x1="478" y1="478" x2="478" y2="423"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <g font-size="16" font-weight="bold">
      <text x="135" y="56">Vendor Central</text>
      <text x="135" y="174">Amazon Marketing</text>
      <text x="135" y="192">Cloud</text>
      <text x="478" y="110">Your extraction</text>
      <text x="478" y="128">pipeline</text>
      <text x="822" y="110">Landing and</text>
      <text x="822" y="128">validation</text>
      <text x="1165" y="132">Governed data lake</text>
      <text x="135" y="344">Page bake</text>
      <text x="478" y="356">Page store</text>
      <text x="822" y="344">Presentation API</text>
