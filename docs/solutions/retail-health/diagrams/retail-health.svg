<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 730" role="img" focusable="false" aria-labelledby="rh-title rh-desc">
  <title id="rh-title">Call-flow diagram: how Retail health and Products and ads get their figures, in a customer deployment</title>
  <desc id="rh-desc">Your extraction pipeline, in a second AWS account, fetches Vendor Central sales, traffic, product and reported-total reports and runs the declared Amazon Marketing Cloud queries, then lands each delivery in the S3 landing bucket, where it is checked against its data contract and published to the governed data lake as an immutable version. A customer deployment can't land Vendor Central reports yet; the dev environment holds synthetic ones. A new published version starts the page bake on AWS Lambda and Amazon Athena, which compares the product rows with Vendor Central's reported totals and writes Retail health, a page per product and each product's ad credit to the page store, with figures or a designed absence. The Presentation API serves each page's latest good version to the signed-in user, and Amazon Bedrock insight narration, attached to the page, explains only the figures it shows. Customer deployments bake one page at a time; building all affected pages as one set runs in the dev environment only.</desc>
