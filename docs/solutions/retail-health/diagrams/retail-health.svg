      <text x="1165" y="394">the signed-in browser</text>
      <text x="478" y="532">Amazon Bedrock; explains</text>
      <text x="478" y="547">only the figures the</text>
      <text x="478" y="562">page already shows</text>
    </g>
    <g font-size="13">
      <text x="300" y="80">reports</text>
      <text x="310" y="212">query results</text>
      <text x="650" y="101">lands each</text>
      <text x="650" y="116">delivery, then</text>
      <text x="650" y="131">registers it</text>
      <text x="993" y="101">publishes a</text>
      <text x="993" y="116">validated,</text>
      <text x="993" y="131">immutable version</text>
      <text x="650" y="246">a new published version starts the bake</text>
      <text x="306" y="336">the built page:</text>
      <text x="306" y="351">figures or a</text>
      <text x="306" y="366">designed absence</text>
      <text x="650" y="336">latest good</text>
      <text x="650" y="351">version of</text>
      <text x="650" y="366">each page</text>
      <text x="993" y="351">page served to</text>
      <text x="993" y="366">the signed-in user</text>
      <text x="490" y="455" text-anchor="start">attached to the page</text>
    </g>
    <g font-size="13" text-anchor="start">
      <text x="717" y="502" font-size="15" font-weight="bold">How pages refresh</text>
      <text x="717" y="524">Customer deployments bake one page at a time;</text>
      <text x="717" y="542">a page that fails keeps its last good version.</text>
      <text x="717" y="560">Dev environment only: all affected pages are built</text>
      <text x="717" y="578">as one set and switch to new data together.</text>
    </g>
  </g>
