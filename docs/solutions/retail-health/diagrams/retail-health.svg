    <ellipse cx="478" cy="324" rx="105" ry="14" fill="#f2f8fe" stroke="#2f6fb2"/>
    <rect x="717" y="310" width="210" height="110" rx="10" fill="#ffffff" stroke="#9aa8bb"/>
    <rect x="1060" y="310" width="210" height="110" rx="10" fill="#ffffff" stroke="#9aa8bb" stroke-width="3"/>
    <rect x="373" y="480" width="210" height="100" rx="10" fill="#f8f5ff" stroke="#6b4fbb"/>
  </g>
