    <rect x="30" y="685" width="26" height="16" rx="3" fill="#ffffff" stroke="#9aa8bb" stroke-width="3"/>
    <text x="64" y="698">The pages this solution adds</text>
    <path d="M340 689 V701 A13 4 0 0 0 366 701 V689" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/>
