<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" focusable="false" aria-labelledby="amc-threshold-title amc-threshold-desc"><title id="amc-threshold-title">Component diagram: AMC sub-threshold row handling</title><desc id="amc-threshold-desc">Inside the Amazon Marketing Cloud service boundary, a result row passes a privacy threshold. Rows at threshold emit unchanged; rows below threshold are silently nulled by default or nulled, re-aggregated, and marked when the discriminator option is set.</desc><defs><marker id="amc-threshold-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1200" height="620" fill="#ffffff"/><rect x="30" y="25" width="1140" height="570" rx="8" fill="none" stroke="#536275" stroke-width="2"/><text x="50" y="55" font-family="Arial, sans-serif" font-weight="bold" fill="#172033">Amazon Marketing Cloud — Amazon account service boundary, before file delivery</text><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#amc-threshold-arrow)"><path d="M600 130 V190"/><path d="M510 250 H220 V350"/><path d="M690 250 H980 V350"/><path d="M980 440 V480"/><path d="M980 550 H770"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><rect x="470" y="70" width="260" height="60" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><polygon points="600,190 690,250 600,310 510,250" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><rect x="110" y="350" width="220" height="90" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><polygon points="980,350 1070,410 980,470 890,410" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><rect x="870" y="480" width="220" height="70" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><rect x="590" y="480" width="220" height="70" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><rect x="360" y="480" width="170" height="70" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="600" y="96" font-weight="bold">Result row</text><text x="600" y="118" font-size="13">[Component: AMC SQL output]</text><text x="600" y="242" font-weight="bold">Threshold test</text><text x="600" y="262" font-size="12">[AMC privacy layer]</text><text x="220" y="382" font-weight="bold">Emitted unchanged</text><text x="220" y="404" font-size="13">[AMC SQL output]</text><text x="980" y="402" font-weight="bold">Extraction option</text><text x="980" y="422" font-size="12">filteredMetricsDiscriminator?</text><text x="980" y="506" font-weight="bold">Nulled</text><text x="980" y="528" font-size="12">offending values only</text><text x="700" y="506" font-weight="bold">Re-aggregated with SUM</text><text x="700" y="528" font-size="12">identical nulled rows merge</text><text x="445" y="506" font-weight="bold">Nulled, silently</text><text x="445" y="528" font-size="12">no flag, no merging</text><text x="300" y="340" font-size="12">at or above threshold</text><text x="810" y="340" font-size="12">below threshold</text><text x="1090" y="445" font-size="12">set</text><text x="1040" y="470" font-size="12">nulled rows</text><text x="810" y="470" font-size="12">merged rows + discriminator</text><text x="540" y="470" font-size="12">default: not set</text></g></svg>
