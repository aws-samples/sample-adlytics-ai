<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" role="img" focusable="false" aria-labelledby="vendor-document-title vendor-document-desc"><title id="vendor-document-title">Component diagram: SP-API report document decomposition</title><desc id="vendor-document-desc">One SP-API JSON report has report specification metadata and sibling aggregate and ASIN arrays that become two Iceberg tables at different grains; specification metadata is lifted onto every row.</desc><defs><marker id="vendor-document-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1100" height="450" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#vendor-document-arrow)"><path d="M250 220 H360 V100"/><path d="M250 220 H360 V220"/><path d="M250 220 H360 V340"/><path d="M590 220 H780"/><path d="M590 340 H780"/><path d="M590 100 H780 V220" stroke-dasharray="5 4"/><path d="M590 100 H780 V340" stroke-dasharray="5 4"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><rect x="30" y="165" width="220" height="110" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><rect x="360" y="55" width="230" height="90" rx="6" fill="#fff4e0" stroke="#c77700" stroke-width="2"/><rect x="360" y="175" width="230" height="90" rx="6" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><rect x="360" y="295" width="230" height="90" rx="6" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><rect x="780" y="175" width="250" height="90" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><rect x="780" y="295" width="250" height="90" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="140" y="198" font-weight="bold">One report document</text><text x="140" y="220" font-size="13">[Component: JSON, SP-API]</text><text x="475" y="85" font-weight="bold">reportSpecification</text><text x="475" y="107" font-size="13">[JSON object: pull metadata]</text><text x="475" y="205" font-weight="bold">salesAggregate[]</text><text x="475" y="227" font-size="13">[JSON array: per period]</text><text x="475" y="325" font-weight="bold">salesByAsin[]</text><text x="475" y="347" font-size="13">[JSON array: ASIN + period]</text><text x="905" y="205" font-weight="bold">Control total</text><text x="905" y="227" font-size="13">[Iceberg: reported_total]</text><text x="905" y="325" font-weight="bold">Fact</text><text x="905" y="347" font-size="13">[Iceberg: by_asin]</text><text x="300" y="155" font-size="12">parsed once</text><text x="650" y="205" font-size="12">one row per period</text><text x="650" y="325" font-size="12">one row per ASIN + period</text><text x="650" y="115" font-size="12">lifted metadata</text></g></svg>
