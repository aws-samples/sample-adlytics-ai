<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 330" role="img" focusable="false" aria-labelledby="business-outcome-flow-title business-outcome-flow-desc"><title id="business-outcome-flow-title">Component diagram: shopper-aggregate path from AMC to a served figure</title><desc id="business-outcome-flow-desc">Shopper query packs count distinct shoppers inside the customer AMC instance and return only thresholded totals and source labels. The customer-owned producer lands them, the Finalizer checks periods and parameters, the load path grades expected cells, and the planner serves each figure at its exact period and grain. No path leads back to Amazon.</desc><defs><marker id="business-outcome-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1850" height="330" fill="#ffffff"/><g id="business-outcome-flow-amc-boundary"><rect x="20" y="40" width="210" height="270" fill="none" stroke="#9aa8bb" stroke-width="2"/><text x="125" y="62" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#536275">Customer AMC instance</text><text x="125" y="78" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#536275">Amazon clean-room boundary</text></g><g id="business-outcome-flow-producer-boundary"><rect x="300" y="40" width="210" height="270" fill="none" stroke="#9aa8bb" stroke-width="2"/><text x="405" y="62" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#536275">Customer extraction account</text><text x="405" y="78" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#536275">customer-owned boundary</text></g><g id="business-outcome-flow-deployment-boundary"><rect x="580" y="40" width="1250" height="270" fill="none" stroke="#9aa8bb" stroke-width="2"/><text x="1205" y="62" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#536275">Customer AWS account: Adlytics deployment boundary</text></g><g id="business-outcome-flow-planned" fill="#ffffff" stroke="#9aa8bb" stroke-width="2" stroke-dasharray="5 4"><rect x="40" y="150" width="170" height="100" rx="6"/></g><rect x="320" y="150" width="170" height="100" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><rect x="600" y="150" width="170" height="100" rx="6" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><rect x="860" y="150" width="170" height="100" rx="6" fill="#fff4e0" stroke="#c77700" stroke-width="2"/><g id="business-outcome-flow-facts" fill="#ffffff" stroke="#9aa8bb" stroke-width="3" stroke-dasharray="5 4"><path d="M1120 162 v76 c0 16 170 16 170 0 v-76"/><ellipse cx="1205" cy="162" rx="85" ry="12"/></g><rect x="1380" y="150" width="170" height="100" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><rect x="1640" y="150" width="170" height="100" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#business-outcome-flow-arrow)"><path d="M210 200 H318"/><path d="M490 200 H598"/><path d="M770 200 H858"/><path d="M1030 200 H1118"/><path d="M1290 200 H1378"/><path d="M1550 200 H1638"/></g><g fill="#172033" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"><text x="125" y="180" font-weight="bold">Shopper query packs</text><text x="125" y="198">[Component: AMC SQL]</text><text x="125" y="216">COUNT DISTINCT inside</text><text x="125" y="234">planned</text><text x="405" y="180" font-weight="bold">AMC producer</text><text x="405" y="198">[External: scheduler]</text><text x="405" y="216">one run per period</text><text x="405" y="234">and grain set</text><text x="685" y="180" font-weight="bold">Finalizer</text><text x="685" y="198">[Component: Lambda]</text><text x="685" y="216">period alignment</text><text x="685" y="234">and parameter checks</text><text x="945" y="180" font-weight="bold">Load path</text><text x="945" y="198">[Component: Semantic V2]</text><text x="945" y="216">suppression policy</text><text x="945" y="234">expected cells, loss</text><text x="1205" y="192" font-weight="bold">Shopper-aggregate</text><text x="1205" y="208" font-weight="bold">facts</text><text x="1205" y="226">[Data store: Iceberg]</text><text x="1205" y="242">planned</text><text x="1465" y="180" font-weight="bold">Planner</text><text x="1465" y="198">[Component: domain]</text><text x="1465" y="216">exact period and grain</text><text x="1465" y="234">one network per outcome</text><text x="1725" y="180" font-weight="bold">Materializers, tools</text><text x="1725" y="198">[Component: Python]</text><text x="1725" y="216">resolved period label</text><text x="1725" y="234">not-available states</text></g><g fill="#536275" font-family="Arial, sans-serif" font-size="11" text-anchor="middle"><text x="265" y="178">totals</text><text x="265" y="192">CSV</text><text x="545" y="178">S3 PUT</text><text x="545" y="192">incoming/</text><text x="815" y="178">manifest last</text><text x="815" y="192">S3 event</text><text x="1075" y="178">cell states</text><text x="1075" y="192">Iceberg write</text><text x="1335" y="178">exact period</text><text x="1335" y="192">Athena read</text><text x="1595" y="178">typed figure</text><text x="1595" y="192">or refusal</text></g></svg>
