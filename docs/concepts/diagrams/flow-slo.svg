<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 520" role="img" focusable="false" aria-labelledby="flow-slo-title flow-slo-desc"><title id="flow-slo-title">Concept diagram: Authority-backed completion and service-level evaluation</title><desc id="flow-slo-desc">An immutable landing starts a root flow. Semantic authority feeds a source cohort gate, which permits artifact publication and pointer commitment. The pointer enables serving. Optional AI enhancement begins from the deterministic artifact but does not gate its completion. Authority timestamps feed baseline measurement and, only for activated objectives, service-level evaluation. Last-good serving is distinct from freshness of the new flow.</desc><defs><marker id="flow-slo-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536275"/></marker></defs><rect width="1420" height="520" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle"><rect x="30" y="80" width="205" height="100" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="132" y="110" font-weight="bold">Immutable landing</text><text x="132" y="133" font-size="13">[Data: versioned S3]</text><text x="132" y="156" font-size="13">starts root flow clock</text><rect x="285" y="80" width="205" height="100" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="387" y="110" font-weight="bold">Semantic authority</text><text x="387" y="133" font-size="13">[Data: S3/Iceberg/DynamoDB]</text><text x="387" y="156" font-size="13">required CURRENT children</text><polygon points="650,70 770,130 650,190 530,130" fill="#fff4e0" stroke="#c77700" stroke-width="3"/><text x="650" y="116" font-weight="bold">Cohort complete?</text><text x="650" y="139" font-size="13">[Gate: dependency roster]</text><text x="650" y="160" font-size="13">current + prior evidence</text><rect x="815" y="80" width="220" height="100" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="925" y="110" font-weight="bold">Artifact authority</text><text x="925" y="133" font-size="13">[Data: S3 + pointer]</text><text x="925" y="156" font-size="13">body-first, pointer-last</text><rect x="1090" y="80" width="205" height="100" rx="7" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="1192" y="110" font-weight="bold">Serving acceptance</text><text x="1192" y="133" font-size="13">[Component: API]</text><text x="1192" y="156" font-size="13">exact returned revision</text><rect x="815" y="275" width="220" height="100" rx="7" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><text x="925" y="305" font-weight="bold">Optional AI children</text><text x="925" y="328" font-size="13">[Component: Bedrock/cache]</text><text x="925" y="351" font-size="13">filled, silent, unavailable</text><rect x="1090" y="275" width="205" height="100" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3"/><text x="1192" y="305" font-weight="bold">Measurement / SLO reducer</text><text x="1192" y="328" font-size="13">[Component: deterministic]</text><text x="1192" y="351" font-size="13">baseline or evaluated result</text><rect x="530" y="300" width="240" height="90" rx="7" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="650" y="330" font-weight="bold">Last-good serving</text><text x="650" y="353" font-size="13">[State: prior artifact]</text><text x="650" y="374" font-size="13">continuity, not freshness</text></g><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#flow-slo-arrow)"><path d="M235 130H285"/><path d="M490 130H530"/><path d="M770 130H815"/><path d="M1035 130H1090"/><path d="M925 180V275" stroke-dasharray="5 4"/><path d="M1035 325H1090" stroke-dasharray="5 4"/><path d="M387 180V420H1192V375" stroke-dasharray="5 4"/><path d="M770 170V300" stroke-dasharray="5 4"/></g><g font-family="Arial, sans-serif" font-size="11" fill="#536275"><text x="250" y="120">exact manifest</text><text x="498" y="120">CURRENT evidence</text><text x="778" y="120">eligible generation</text><text x="1042" y="120">pointer revision</text><text x="940" y="230">artifact revision</text><text x="1050" y="315">optional terminal</text><text x="790" y="410">authority timestamps + outcomes</text><text x="780" y="255">incomplete/failed generation</text></g></svg>
