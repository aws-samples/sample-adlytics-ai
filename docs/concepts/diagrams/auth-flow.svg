<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" focusable="false" aria-labelledby="auth-flow-title auth-flow-desc"><title id="auth-flow-title">Component diagram: browser authentication custody path</title><desc id="auth-flow-desc">Four authentication concepts progress from secure session custody through verification to a protected capability request.</desc><defs><marker id="auth-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1000" height="230" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#auth-flow-arrow)"><path d="M220 115 H290"/><path d="M470 115 H540"/><path d="M720 115 H790"/></g><g fill="#ffffff" stroke="#9aa8bb" stroke-width="2"><rect x="30" y="65" width="190" height="100" rx="6"/><rect x="290" y="65" width="180" height="100" rx="6"/><rect x="540" y="65" width="180" height="100" rx="6"/><rect x="790" y="65" width="180" height="100" rx="6"/></g><g fill="#172033" font-family="Arial, sans-serif" text-anchor="middle"><text x="125" y="95" font-weight="bold">Session custody</text><text x="125" y="117" font-size="13">[Concept]</text><text x="125" y="139" font-size="13">secure cookie transport</text><text x="380" y="95" font-weight="bold">Verification boundary</text><text x="380" y="117" font-size="13">[Concept]</text><text x="380" y="139" font-size="13">claims origin and CSRF</text><text x="630" y="95" font-weight="bold">Verified request identity</text><text x="630" y="117" font-size="13">[Concept]</text><text x="630" y="139" font-size="13">server-owned subject</text><text x="880" y="95" font-weight="bold">Protected behavior</text><text x="880" y="117" font-size="13">[Concept]</text><text x="880" y="139" font-size="13">authorized capability request</text><text x="255" y="100" font-size="12">presented session</text><text x="505" y="100" font-size="12">verified identity</text><text x="755" y="100" font-size="12">authorized request</text></g></svg>
