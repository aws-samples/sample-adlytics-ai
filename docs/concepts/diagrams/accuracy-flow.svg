<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" focusable="false" aria-labelledby="accuracy-flow-title accuracy-flow-desc"><title id="accuracy-flow-title">Component diagram: semantic-accuracy release path</title><desc id="accuracy-flow-desc">Source evidence passes through publication authority and governed computation before customer release, which is validated before it is shown or, for a conversational answer, evaluated after it is shown.</desc><defs><marker id="accuracy-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1000" height="230" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#accuracy-flow-arrow)"><path d="M220 115 H290"/><path d="M470 115 H540"/><path d="M720 115 H790"/></g><g fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"><rect x="30" y="65" width="190" height="100" rx="6"/><rect x="290" y="65" width="180" height="100" rx="6"/><rect x="540" y="65" width="180" height="100" rx="6"/><rect x="790" y="65" width="180" height="100" rx="6"/></g><g fill="#172033" font-family="Arial, sans-serif" text-anchor="middle"><text x="125" y="95" font-weight="bold">Source evidence</text><text x="125" y="117" font-size="13">[Concept: provenance]</text><text x="380" y="95" font-weight="bold">Publication authority</text><text x="380" y="117" font-size="13">[Concept: immutable success + CURRENT]</text><text x="630" y="95" font-weight="bold">Governed computation</text><text x="630" y="117" font-size="13">[Concept: typed plan + selection]</text><text x="880" y="95" font-weight="bold">Customer release</text><text x="880" y="117" font-size="13">[Concept: response]</text><text x="880" y="139" font-size="12">validated or evaluated</text><text x="255" y="100" font-size="12">declared meaning</text><text x="505" y="100" font-size="12">exact successful set</text><text x="755" y="100" font-size="12">typed values + qualifiers</text></g></svg>
