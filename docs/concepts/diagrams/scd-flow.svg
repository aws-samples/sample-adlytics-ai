ight="bold">Complete candidate</text><text x="955" y="165">[Concept: immutable history]</text><text x="1135" y="143" font-weight="bold">Publish</text><text x="1135" y="165">[Concept]</text><text x="270" y="84">version-bound rows</text><text x="270" y="214">prior history</text><text x="565" y="145">complete candidate</text><text x="830" y="145">valid candidate</text><text x="1070" y="145">ordinary contract</text></g></svg>
