<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 360" role="img" focusable="false" aria-labelledby="resolution-flow-title resolution-flow-desc"><title id="resolution-flow-title">Component diagram: semantic request resolution</title><desc id="resolution-flow-desc">An untrusted request becomes a candidate intent, then deterministic scope and measurement resolution, yielding either a typed stop or a canonical request.</desc><defs><marker id="resolution-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1160" height="360" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#resolution-flow-arrow)"><path d="M200 105 H270"/><path d="M470 105 H540"/><path d="M720 105 H790"/><path d="M630 175 V270 H360"/><path d="M880 175 V270 H560"/><path d="M970 105 H1030"/></g><g><rect x="20" y="50" width="180" height="110" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><rect x="270" y="50" width="200" height="110" rx="6" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><rect x="790" y="50" width="180" height="110" rx="6" fill="#fff4e0" stroke="#c77700" stroke-width="2"/><rect x="1030" y="50" width="110" height="110" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/></g><polygon points="630,45 720,105 630,165 540,105" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><rect x="360" y="235" width="200" height="100" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><g fill="#172033" font-family="Arial, sans-serif" text-anchor="middle" font-size="13"><text x="110" y="85" font-weight="bold">Customer request</text><text x="110" y="107">[Concept: text + page capability]</text><text x="370" y="85" font-weight="bold">Candidate intent</text><text x="370" y="107">[Concept: untrusted proposal]</text><text x="630" y="98" font-weight="bold">Scope + entity</text><text x="630" y="116" font-weight="bold">resolution</text><text x="880" y="85" font-weight="bold">Measurement resolution</text><text x="880" y="107">[Concept: metric + period]</text><text x="1085" y="85" font-weight="bold">Resolved</text><text x="1085" y="107">request</text><text x="460" y="270" font-weight="bold">Clarification or refusal</text><text x="460" y="292">[Concept: typed stop]</text><text x="235" y="95">language</text><text x="505" y="95">candidate meanings</text><text x="755" y="95">authorized identity</text><text x="990" y="95">one exact request</text><text x="470" y="228">ambiguous or unavailable</text><text x="670" y="228">unsupported or incompatible</text></g></svg>
