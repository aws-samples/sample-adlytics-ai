<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" focusable="false" aria-labelledby="observability-flow-title observability-flow-desc"><title id="observability-flow-title">Component diagram: managed-path investigation planes</title><desc id="observability-flow-desc">Application telemetry directs operators to protected Harness diagnostics and terminal audit, whose admission reference feeds evaluation.</desc><defs><marker id="observability-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1050" height="360" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#observability-flow-arrow)"><path d="M240 110 H350"/><path d="M130 180 V265 H590"/><path d="M700 265 H810"/></g><g><rect x="20" y="60" width="220" height="120" rx="6" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><rect x="350" y="60" width="220" height="120" rx="6" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><rect x="590" y="215" width="220" height="120" rx="6" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><rect x="810" y="215" width="220" height="120" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/></g><g fill="#172033" font-family="Arial, sans-serif" text-anchor="middle"><text x="130" y="95" font-weight="bold">Application telemetry</text><text x="130" y="117" font-size="13">[Concept: operational plane]</text><text x="130" y="139" font-size="13">bounded boundary health</text><text x="460" y="95" font-weight="bold">Harness diagnostics</text><text x="460" y="117" font-size="13">[Concept: protected plane]</text><text x="460" y="139" font-size="13">managed detail</text><text x="700" y="250" font-weight="bold">Terminal audit</text><text x="700" y="272" font-size="13">[Concept: immutable plane]</text><text x="700" y="294" font-size="13">governed outcome</text><text x="920" y="250" font-weight="bold">Evaluation</text><text x="920" y="272" font-size="13">[Concept: protected plane]</text><text x="920" y="294" font-size="13">quality input</text><text x="295" y="95" font-size="12">W3C carrier</text><text x="330" y="250" font-size="12">persisted locator</text><text x="760" y="250" font-size="12">exact admission reference</text></g></svg>
