<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 640" role="img" focusable="false" aria-labelledby="response-simulation-flow-title response-simulation-flow-desc"><title id="response-simulation-flow-title">Container diagram: read-only path from Amazon sources to the budget simulator</title><desc id="response-simulation-flow-desc">First-party connectors check every call against an operation allowlist, receive read-only API responses from Amazon and hand results to the Finalizer and load path, which copies the bytes unchanged into the raw zone and loads curated tables. Control-plane run plans release exact inputs, submit network-isolated SageMaker Processing jobs for curve fits and Chronos-2, gate the results and publish artifacts. The simulator API answers a brand manager's scenario from published artifacts only and has no path back to any ad platform.</desc><defs><marker id="response-simulation-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1560" height="640" fill="#ffffff"/>
<g id="response-simulation-flow-boundary"><rect x="230" y="40" width="1300" height="570" fill="none" stroke="#9aa8bb" stroke-width="2"/><text x="880" y="64" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#536275">Customer AWS account: Adlytics deployment boundary (customer-owned)</text></g>
<g id="response-simulation-flow-amazon"><rect x="20" y="120" width="170" height="110" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="105" y="152" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Amazon sources</text><text x="105" y="174" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">External system</text><text x="105" y="194" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Ads API, AMC, SP-API</text><text x="105" y="214" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Amazon-owned</text></g>
<g id="response-simulation-flow-user"><rect x="20" y="440" width="170" height="90" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="105" y="476" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Brand manager</text><text x="105" y="498" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Person, web browser</text></g>
<g id="response-simulation-flow-connectors"><rect x="340" y="110" width="190" height="130" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="2" stroke-dasharray="5 4"/><text x="435" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">First-party connectors</text><text x="435" y="162" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Container: one CDK stack each</text><text x="435" y="182" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Pre-send operation allowlist,</text><text x="435" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">own landing role per source</text><text x="435" y="222" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">(planned)</text></g>
<g id="response-simulation-flow-load"><rect x="640" y="110" width="200" height="130" rx="6" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="740" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Finalizer and load path</text><text x="740" y="162" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Container: Lambda</text><text x="740" y="182" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Checks pack, allowlist, prefix;</text><text x="740" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">loads per versioned contract</text><text x="740" y="222" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">(exists; generalised for APIs)</text></g>
<g id="response-simulation-flow-raw"><path d="M660,296 L660,366 A80,14 0 0 0 820,366 L820,296" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><ellipse cx="740" cy="296" rx="80" ry="14" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="740" y="332" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Raw zone</text><text x="740" y="352" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Data store: S3 (exists)</text></g>
<g id="response-simulation-flow-curated"><path d="M950,128 L950,222 A100,16 0 0 0 1150,222 L1150,128" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><ellipse cx="1050" cy="128" rx="100" ry="16" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="1050" y="168" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Curated tables</text><text x="1050" y="190" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Data store: Iceberg</text><text x="1050" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">spend, outcomes, budget state</text></g>
<g id="response-simulation-flow-plans"><rect x="1260" y="110" width="240" height="130" rx="6" fill="#fff4e0" stroke="#c77700" stroke-width="2" stroke-dasharray="5 4"/><text x="1380" y="140" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Run plans and gates</text><text x="1380" y="162" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Container: control plane, Lambda</text><text x="1380" y="182" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Readiness, input build, gates,</text><text x="1380" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">snapshot publication</text><text x="1380" y="222" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">(planned)</text></g>
<g id="response-simulation-flow-jobs"><rect x="1260" y="420" width="240" height="130" rx="6" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2" stroke-dasharray="5 4"/><text x="1380" y="450" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Curve fits and Chronos-2</text><text x="1380" y="472" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Container: SageMaker Processing,</text><text x="1380" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">x86_64, network isolated, no VPC</text><text x="1380" y="510" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">PyMC, Chronos-2 (planned)</text></g>
<g id="response-simulation-flow-artifacts"><path d="M950,438 L950,532 A100,16 0 0 0 1150,532 L1150,438" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2" stroke-dasharray="5 4"/><ellipse cx="1050" cy="438" rx="100" ry="16" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2" stroke-dasharray="5 4"/><text x="1050" y="478" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Curve and forecast artifacts</text><text x="1050" y="500" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Data store: S3 draws,</text><text x="1050" y="520" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">DynamoDB CURRENT (planned)</text></g>
<g id="response-simulation-flow-api"><rect x="640" y="420" width="200" height="130" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3" stroke-dasharray="5 4"/><text x="740" y="450" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Simulator API</text><text x="740" y="472" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Container: Lambda, NumPy</text><text x="740" y="492" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Arithmetic over stored draws;</text><text x="740" y="510" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">no port to any ad platform</text><text x="740" y="532" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">(planned)</text></g>
<g id="response-simulation-flow-page"><rect x="340" y="420" width="190" height="130" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2" stroke-dasharray="5 4"/><text x="435" y="450" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Simulator page</text><text x="435" y="472" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Container: CloudFront SPA</text><text x="435" y="492" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Per-channel totals, labels</text><text x="435" y="512" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#374151">(planned)</text></g>
