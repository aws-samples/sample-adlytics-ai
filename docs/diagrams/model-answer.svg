<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" role="img" focusable="false" aria-labelledby="model-answer-title model-answer-desc"><title id="model-answer-title">Component diagram: figure-computation refusal gates</title><desc id="model-answer-desc">A requested metric must be defined, structurally valid at its grain, viable for the customer, and fully covered before a validated plan can compute and narrate it; any failed gate returns a reasoned refusal.</desc><defs><marker id="model-answer-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1040" height="580" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#model-answer-arrow)"><path d="M520 80 V120"/><path d="M520 210 V250"/><path d="M520 340 V380"/><path d="M520 470 V510"/><path d="M430 165 H180 V450"/><path d="M430 295 H180"/><path d="M430 425 H180"/><path d="M430 555 H180"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><rect x="390" y="20" width="260" height="60" rx="6" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><polygon points="520,120 610,165 520,210 430,165" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><polygon points="520,250 610,295 520,340 430,295" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><polygon points="520,380 610,425 520,470 430,425" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><polygon points="520,510 610,555 520,600 430,555" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><rect x="50" y="410" width="260" height="80" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="520" y="48" font-weight="bold">ROAS by campaign, last week</text><text x="520" y="160" font-weight="bold">Metric defined?</text><text x="520" y="290" font-weight="bold">Grain structurally valid?</text><text x="520" y="420" font-weight="bold">Grain viable for customer?</text><text x="520" y="550" font-weight="bold">Window fully covered?</text><text x="180" y="442" font-weight="bold">Refuse with reason</text><text x="180" y="464" font-size="13">[Typed outcome]</text><text x="360" y="155" font-size="12">no</text><text x="360" y="285" font-size="12">no</text><text x="360" y="415" font-size="12">suppression too high</text><text x="360" y="545" font-size="12">partial coverage</text><text x="630" y="225" font-size="12">yes</text><text x="630" y="355" font-size="12">yes</text><text x="630" y="485" font-size="12">yes</text><text x="630" y="575" font-size="12">validated plan + narrative</text></g></svg>
