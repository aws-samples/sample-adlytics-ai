<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" focusable="false" aria-labelledby="questions-flow-title questions-flow-desc"><title id="questions-flow-title">Component diagram: local request resolution and measurement gates</title><desc id="questions-flow-desc">Customer language is resolved and authorized before a canonical request passes four measurement gates. Each failed gate ends in a typed clarification or measurement refusal; a successful request produces a grounded answer.</desc><defs><marker id="questions-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1200" height="760" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#questions-flow-arrow)"><path d="M600 105 V145"/><path d="M600 235 V275"/><path d="M600 365 V405"/><path d="M600 495 V535"/><path d="M600 625 V675"/><path d="M510 190 H290 V650"/><path d="M510 320 H290"/><path d="M510 450 H290"/><path d="M510 580 H290"/><path d="M690 190 H900 V650"/><path d="M690 320 H900"/><path d="M690 450 H900"/><path d="M690 580 H900"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><rect x="460" y="25" width="280" height="80" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><rect x="460" y="145" width="280" height="90" rx="6" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><rect x="460" y="275" width="280" height="90" rx="6" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><rect x="460" y="675" width="280" height="70" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><rect x="150" y="620" width="280" height="80" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><rect x="800" y="620" width="280" height="80" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><polygon points="600,405 690,450 600,495 510,450" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><polygon points="600,535 690,580 600,625 510,580" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><polygon points="600,275 690,320 600,365 510,320" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><polygon points="600,145 690,190 600,235 510,190" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><text x="600" y="58" font-weight="bold">Customer language</text><text x="600" y="80" font-size="13">[Input: text + opaque page selection]</text><text x="600" y="177" font-weight="bold">Semantic resolution</text><text x="600" y="199" font-size="13">[Component: local boundary]</text><text x="600" y="307" font-weight="bold">Exact canonical request</text><text x="600" y="329" font-size="13">[Component: resolved-only mapping]</text><text x="600" y="444" font-weight="bold">Metric declared?</text><text x="600" y="574" font-weight="bold">Grain viable + covered?</text><text x="290" y="650" font-weight="bold">Clarification or refusal</text><text x="290" y="672" font-size="13">[Current domain outcome]</text><text x="940" y="650" font-weight="bold">Typed measurement refusal</text><text x="940" y="672" font-size="13">[Current domain outcome]</text><text x="600" y="705" font-weight="bold">Grounded answer</text><text x="600" y="727" font-size="13">[Release: coverage + suppression + basis]</text><text x="395" y="180" font-size="12">unresolved or unauthorized</text><text x="780" y="180" font-size="12">one resolved request</text><text x="380" y="310" font-size="12">no</text><text x="780" y="310" font-size="12">exact arguments</text><text x="380" y="440" font-size="12">no</text><text x="780" y="440" font-size="12">yes</text><text x="380" y="570" font-size="12">not viable / partial</text><text x="780" y="570" font-size="12">yes</text></g></svg>
