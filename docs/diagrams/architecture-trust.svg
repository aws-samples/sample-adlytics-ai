<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 360" role="img" focusable="false" aria-labelledby="architecture-trust-title architecture-trust-desc"><title id="architecture-trust-title">Trust-boundary diagram: Conversation Runtime release controls</title><desc id="architecture-trust-desc">A browser request enters the Conversation API boundary, reaches the managed Harness and Tool Gateway, and uses deterministic purpose-built tools; the answer streams back through the Conversation API, which records it.</desc><defs><marker id="architecture-trust-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect width="1500" height="360" fill="#ffffff"/><rect x="220" y="25" width="1250" height="310" rx="8" fill="none" stroke="#b54545" stroke-width="2"/><text x="240" y="55" font-family="Arial, sans-serif" font-weight="bold" fill="#5c1d1d">Repository-owned authority boundary</text><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#architecture-trust-arrow)"><path d="M180 170 H270"/><path d="M480 170 H570"/><path d="M810 170 H900"/><path d="M1140 170 H1230"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><rect x="20" y="115" width="160" height="110" rx="6" fill="#ffffff" stroke="#536275" stroke-width="2"/><rect x="270" y="115" width="210" height="110" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="3"/><rect x="570" y="115" width="240" height="110" rx="6" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><rect x="900" y="115" width="240" height="110" rx="6" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><rect x="1230" y="115" width="190" height="110" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="100" y="145" font-weight="bold">Browser</text><text x="375" y="145" font-weight="bold">Conversation API</text><text x="690" y="145" font-weight="bold">Managed Harness</text><text x="1020" y="145" font-weight="bold">Tool Gateway</text><text x="1325" y="145" font-weight="bold">Purpose-built tools</text></g></svg>
