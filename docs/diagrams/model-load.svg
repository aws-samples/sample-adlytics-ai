<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" focusable="false" aria-labelledby="model-load-title model-load-desc"><title id="model-load-title">Component diagram: landed-file publication gate</title><desc id="model-load-desc">A manifested landed file is read as contract-typed rows, validated at one gate, quarantined on failure, or mapped, published, and recorded on success.</desc><defs><marker id="model-load-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1120" height="360" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#model-load-arrow)"><path d="M180 130 H250"/><path d="M430 130 H490"/><path d="M670 130 H730"/><path d="M890 130 H950"/><path d="M580 190 V270 H250"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><g fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"><rect x="20" y="80" width="160" height="100" rx="6"/><rect x="250" y="80" width="180" height="100" rx="6"/><rect x="730" y="80" width="160" height="100" rx="6"/><rect x="950" y="80" width="150" height="100" rx="6"/></g><polygon points="580,70 670,130 580,190 490,130" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><rect x="140" y="245" width="220" height="80" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="100" y="113" font-weight="bold">File + manifest</text><text x="100" y="135" font-size="13">[Landing: evidence]</text><text x="340" y="113" font-weight="bold">Read</text><text x="340" y="135" font-size="13">[Contract: format]</text><text x="580" y="124" font-weight="bold">Validate + assert</text><text x="810" y="113" font-weight="bold">Map</text><text x="810" y="135" font-size="13">[Source to canonical]</text><text x="1025" y="113" font-weight="bold">Publish + record</text><text x="1025" y="135" font-size="13">[Partition + coverage]</text><text x="250" y="278" font-weight="bold">Quarantine + alarm</text><text x="250" y="300" font-size="13">[Good data stays live]</text><text x="210" y="120" font-size="11">complete delivery</text><text x="450" y="120" font-size="11">typed rows</text><text x="690" y="120" font-size="11">pass</text><text x="910" y="120" font-size="11">canonical rows</text><text x="360" y="260" font-size="11">fail</text></g></svg>
