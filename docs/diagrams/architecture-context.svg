<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 380" role="img" focusable="false" aria-labelledby="architecture-context-title architecture-context-desc"><title id="architecture-context-title">System Context diagram: Adlytics AI external delivery, identity, and model boundaries</title><desc id="architecture-context-desc">An advertiser and external producers interact with Adlytics AI. The system uses Amazon Cognito for managed login and Amazon Bedrock for governed model requests inside the customer AWS account boundary.</desc><defs><marker id="architecture-context-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#536275"/></marker></defs><rect width="1160" height="380" fill="#ffffff"/><rect x="340" y="25" width="790" height="330" rx="8" fill="none" stroke="#536275" stroke-width="2"/><text x="360" y="55" fill="#172033" font-family="Arial, sans-serif" font-weight="bold">Customer AWS account — system boundary</text><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#architecture-context-arrow)"><path d="M230 130 H470"/><path d="M230 260 H470"/><path d="M680 170 H820"/><path d="M680 230 H950"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><rect x="30" y="75" width="200" height="110" rx="6" fill="#ffffff" stroke="#536275" stroke-width="2"/><rect x="30" y="205" width="200" height="110" rx="6" fill="#ffffff" stroke="#536275" stroke-width="2"/><rect x="470" y="120" width="210" height="160" rx="6" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="3"/><rect x="820" y="115" width="190" height="110" rx="6" fill="#ffffff" stroke="#536275" stroke-width="2"/><rect x="950" y="245" width="160" height="80" rx="6" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><text x="130" y="108" font-weight="bold">Advertiser</text><text x="130" y="130" font-size="13">[Person]</text><text x="130" y="152" font-size="13">asks governed questions</text><text x="130" y="238" font-weight="bold">External producers</text><text x="130" y="260" font-size="13">[External systems]</text><text x="130" y="282" font-size="13">deliver governed results</text><text x="575" y="158" font-weight="bold">Adlytics AI</text><text x="575" y="180" font-size="13">[Software system]</text><text x="575" y="202" font-size="13">data, analytical, and</text><text x="575" y="222" font-size="13">conversational capabilities</text><text x="915" y="148" font-weight="bold">Amazon Cognito</text><text x="915" y="170" font-size="13">[External system]</text><text x="915" y="192" font-size="13">identity</text><text x="1030" y="273" font-weight="bold">Amazon Bedrock</text><text x="1030" y="295" font-size="13">[External system: model]</text></g></svg>
