<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 300" role="img" focusable="false" aria-labelledby="repo-hexagon-title repo-hexagon-desc"><title id="repo-hexagon-title">Component diagram: allowed imports across the Python hexagon</title><desc id="repo-hexagon-desc">Python adapters implement ports and pass domain values inward. Ports type domain values and domain code imports only the Python standard library.</desc><defs><marker id="repo-hexagon-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1050" height="300" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#repo-hexagon-arrow)"><path d="M220 100 H320"/><path d="M220 180 H570"/><path d="M480 100 H570"/><path d="M730 140 H830"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><rect x="30" y="90" width="190" height="110" rx="6" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><rect x="320" y="45" width="160" height="110" rx="6" fill="#fff4e0" stroke="#c77700" stroke-width="2"/><rect x="570" y="90" width="160" height="110" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3"/><rect x="830" y="90" width="190" height="110" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="125" y="120" font-weight="bold">Adapters</text><text x="125" y="142" font-size="13">[Component: Python]</text><text x="125" y="164" font-size="13">AWS SDK + external I/O</text><text x="400" y="75" font-weight="bold">Ports</text><text x="400" y="97" font-size="13">[Component: Python Protocol]</text><text x="400" y="119" font-size="13">service-neutral interfaces</text><text x="650" y="120" font-weight="bold">Domain</text><text x="650" y="142" font-size="13">[Component: Python]</text><text x="650" y="164" font-size="13">deterministic rules</text><text x="925" y="120" font-weight="bold">Standard library</text><text x="925" y="142" font-size="13">[External: Python 3.14]</text><text x="270" y="90" font-size="12">implements interfaces</text><text x="385" y="172" font-size="12">passes domain values</text><text x="515" y="90" font-size="12">types with domain values</text><text x="780" y="130" font-size="12">imports only</text></g></svg>
