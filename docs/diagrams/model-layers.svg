<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 270" role="img" focusable="false" aria-labelledby="model-layers-title model-layers-desc"><title id="model-layers-title">Component diagram: five data-model layers</title><desc id="model-layers-desc">Raw and staging source data feed conformed dimensions and domain facts, which feed the semantic layer and deterministic agent tools.</desc><defs><marker id="model-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1180" height="270" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#model-layers-arrow)"><path d="M190 135 H230"/><path d="M400 135 H650"/><path d="M610 205 V160 H650"/><path d="M820 135 H860"/><path d="M1030 135 H1070"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><g fill="#ffffff" stroke="#9aa8bb" stroke-width="1.5"><rect x="20" y="85" width="170" height="100" rx="6"/><rect x="230" y="85" width="170" height="100" rx="6"/></g><g fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"><rect x="440" y="155" width="170" height="100" rx="6"/><rect x="650" y="85" width="170" height="100" rx="6"/><rect x="860" y="85" width="170" height="100" rx="6"/></g><rect x="1070" y="85" width="90" height="100" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="105" y="115" font-weight="bold">1. Raw</text><text x="105" y="137" font-size="13">[Layer: source files]</text><text x="105" y="159" font-size="13">manifested bytes</text><text x="315" y="115" font-weight="bold">2. Staging</text><text x="315" y="137" font-size="13">[Layer: source vocabulary]</text><text x="525" y="185" font-weight="bold">3. Dimensions</text><text x="525" y="207" font-size="13">[Layer: shared vocabulary]</text><text x="735" y="115" font-weight="bold">4. Domain facts</text><text x="735" y="137" font-size="13">[Layer: additive measures]</text><text x="945" y="115" font-weight="bold">5. Semantic</text><text x="945" y="137" font-size="13">[Layer: metric definitions]</text><text x="1115" y="115" font-weight="bold">Tools</text><text x="1115" y="137" font-size="12">[Compute]</text><text x="210" y="125" font-size="11">parsed source vocabulary</text><text x="505" y="125" font-size="11">renamed + re-keyed</text><text x="620" y="195" font-size="11">supplies keys</text><text x="840" y="125" font-size="11">additive measures</text><text x="1050" y="125" font-size="11">defined metric</text></g></svg>
