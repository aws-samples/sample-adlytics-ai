<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 610" role="img" focusable="false" aria-labelledby="flow-status-title flow-status-desc"><title id="flow-status-title">Component diagram: Operational Data-Flow Status direct FIFO projection and operator API</title><desc id="flow-status-desc">Status producers re-attest movement authorities and send content-free events directly to a dedicated FIFO SQS queue. The queue invokes an idempotent projector and redrives exhausted messages to a dedicated dead-letter queue. The projector conditionally updates a DynamoDB operational projection. A separately entitled operator calls a protected API that reads only that projection. A scheduled reconciler sends repairs through the same queue.</desc><defs><marker id="flow-status-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536275"/></marker></defs><rect width="1320" height="610" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle"><rect x="25" y="55" width="245" height="105" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="147" y="85" font-weight="bold">Movement authorities</text><text x="147" y="108" font-size="13">[Components: S3/DynamoDB]</text><text x="147" y="131" font-size="13">landing, attempts, CURRENT, pointers</text><rect x="25" y="220" width="245" height="105" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2" stroke-dasharray="5 4"/><text x="147" y="250" font-weight="bold">Status producers</text><text x="147" y="273" font-size="13">[Components: adapters/Lambda]</text><text x="147" y="296" font-size="13">re-attestation + outbox dispatch</text><rect x="25" y="385" width="245" height="105" rx="7" fill="#fff4e0" stroke="#c77700" stroke-width="2" stroke-dasharray="5 4"/><text x="147" y="415" font-weight="bold">Authority reconciler</text><text x="147" y="438" font-size="13">[Component: scheduled Lambda]</text><text x="147" y="461" font-size="13">cursor and gap repair</text><rect x="350" y="220" width="245" height="105" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="3" stroke-dasharray="5 4"/><text x="472" y="250" font-weight="bold">Status event queue</text><text x="472" y="273" font-size="13">[Component: SQS FIFO]</text><text x="472" y="296" font-size="13">OperationalStatusQueueMessage.v1</text><rect x="350" y="400" width="245" height="90" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2" stroke-dasharray="5 4"/><text x="472" y="430" font-weight="bold">Status event DLQ</text><text x="472" y="453" font-size="13">[Component: SQS FIFO]</text><text x="472" y="476" font-size="13">bounded transport failures</text><rect x="675" y="220" width="230" height="105" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3" stroke-dasharray="5 4"/><text x="790" y="250" font-weight="bold">Status projector</text><text x="790" y="273" font-size="13">[Component: Python Lambda]</text><text x="790" y="296" font-size="13">idempotent transition reduction</text><path d="M675 410v100c0 15 230 15 230 0V410c0-15-230-15-230 0z" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2" stroke-dasharray="5 4"/><ellipse cx="790" cy="410" rx="115" ry="15" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2" stroke-dasharray="5 4"/><text x="790" y="447" font-weight="bold">Operational projection</text><text x="790" y="470" font-size="13">[Container: DynamoDB]</text><text x="790" y="493" font-size="13">snapshot + bounded transitions</text><rect x="1000" y="220" width="260" height="105" rx="7" fill="#fff7f2" stroke="#b54545" stroke-width="3" stroke-dasharray="5 4"/><text x="1130" y="250" font-weight="bold">Protected status API</text><text x="1130" y="273" font-size="13">[Component: API Gateway/Lambda]</text><text x="1130" y="296" font-size="13">operations-status-read</text><rect x="1037" y="420" width="185" height="80" rx="7" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="1129" y="450" font-weight="bold">Operator</text><text x="1129" y="473" font-size="13">[Person: Cognito user]</text></g><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#flow-status-arrow)"><path d="M147 160V220" stroke-dasharray="5 4"/><path d="M270 272H350" stroke-dasharray="5 4"/><path d="M270 437H310V305H350" stroke-dasharray="5 4"/><path d="M595 272H675" stroke-dasharray="5 4"/><path d="M472 325V400" stroke-dasharray="5 4"/><path d="M790 325V395"/><path d="M1000 272H905"/><path d="M1129 420V325"/></g><g font-family="Arial, sans-serif" font-size="11" fill="#536275"><text x="160" y="190">exact authority read</text><text x="292" y="262">SQS SendMessage</text><text x="286" y="393">SQS repair event</text><text x="620" y="262">Lambda event source</text><text x="485" y="365">SQS redrive</text><text x="805" y="365">DynamoDB conditional write</text><text x="930" y="262">DynamoDB Get/Query</text><text x="1142" y="370">cookie HTTPS</text></g></svg>
