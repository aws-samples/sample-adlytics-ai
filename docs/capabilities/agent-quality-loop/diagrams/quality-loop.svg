<svg viewBox="0 0 1320 560" role="img" focusable="false" aria-labelledby="quality-loop-title quality-loop-desc" xmlns="http://www.w3.org/2000/svg"><title id="quality-loop-title">Component diagram: Agent Quality Loop audit and evaluation linkage</title><desc id="quality-loop-desc">AgentCore Runtime writes an immutable audit receipt. The audit processor derives structural findings; a selected protected evaluation path reaches isolated ingress, which attests references and queues only an allowlisted result for immutable companion persistence.</desc><defs><marker id="quality-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1320" height="560" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="12" fill="#172033" text-anchor="middle"><g id="quality-loop-top"><rect x="30" y="85" width="160" height="70" rx="6" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><text x="110" y="110">Agent Runtime<tspan x="110" dy="16">[Container: AgentCore]</tspan><tspan x="110" dy="15">terminal decision</tspan></text><path d="M250 85v60c0 14 190 14 190 0V85c0-14-190-14-190 0z" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><ellipse cx="345" cy="85" rx="95" ry="14" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="345" y="108">Quality audit boundary<tspan x="345" dy="16">[Container: DynamoDB]</tspan><tspan x="345" dy="15">immutable receipts + companions</tspan></text><rect x="505" y="85" width="180" height="70" rx="6" fill="#f3fbf6" stroke="#9ac6aa" stroke-width="2"/><text x="595" y="110">Audit processor<tspan x="595" dy="16">[Component: Python Lambda]</tspan><tspan x="595" dy="15">attest · classify · aggregate</tspan></text><path d="M755 85v60c0 14 180 14 180 0V85c0-14-180-14-180 0z" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><ellipse cx="845" cy="85" rx="90" ry="14" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="845" y="108">Structural findings<tspan x="845" dy="16">[Container: DynamoDB]</tspan><tspan x="845" dy="15">immutable outcomes</tspan></text></g><g id="quality-loop-evaluation"><rect x="30" y="355" width="180" height="70" rx="6" fill="#f3fbf6" stroke="#9ac6aa" stroke-width="2"/><text x="120" y="380">Evaluation writer<tspan x="120" dy="16">[Python Lambda + encrypted SQS]</tspan><tspan x="120" dy="15">protected released pair</tspan></text><rect x="280" y="355" width="180" height="70" rx="6" fill="#f8f5ff" stroke="#b8a6dc" stroke-width="2"/><text x="370" y="380">Online evaluation<tspan x="370" dy="16">[External: AgentCore]</tspan><tspan x="370" dy="15">semantic assessment</tspan></text><rect x="530" y="355" width="180" height="70" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="620" y="380">Result ingress<tspan x="620" dy="16">[Component: Python Lambda]</tspan><tspan x="620" dy="15">in-memory event projection</tspan></text><path d="M780 355v60c0 14 180 14 180 0v-60c0-14-180-14-180 0z" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><ellipse cx="870" cy="355" rx="90" ry="14" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="870" y="378">Safe result queue<tspan x="870" dy="16">[Container: encrypted SQS]</tspan><tspan x="870" dy="15">EvaluationResult.v1 only</tspan></text><rect x="1030" y="355" width="180" height="70" rx="6" fill="#f3fbf6" stroke="#9ac6aa" stroke-width="2"/><text x="1120" y="380">Result persister<tspan x="1120" dy="16">[Component: Python Lambda]</tspan><tspan x="1120" dy="15">conditional immutable write</tspan></text></g><g fill="none" stroke="#9aa8bb" marker-end="url(#quality-loop-arrow)"><path d="M190 120h60"/><path d="M440 120h65" stroke-dasharray="5 4"/><path d="M685 120h70"/><path d="M110 155v200h10"/><path d="M210 390h70"/><path d="M460 390h70" stroke-dasharray="5 4"/><path d="M620 355V215H345v-60"/><path d="M710 390h70" stroke-dasharray="5 4"/><path d="M960 390h70" stroke-dasharray="5 4"/><path d="M1120 355V245H440v-90"/></g><g font-size="10" fill="#536275"><text x="220" y="105">conditional immutable audit receipt</text><text x="470" y="105">audit ID; DynamoDB stream</text><text x="720" y="105">immutable structural finding</text><text x="70" y="260">selected protected pair</text><text x="245" y="375">protected source span</text><text x="495" y="375">subscription event</text><text x="500" y="275">audit + writer attestation</text><text x="745" y="375">allowlisted EvaluationResult.v1</text><text x="995" y="375">safe projection message</text><text x="1050" y="250">immutable result companion</text></g></g></svg>
