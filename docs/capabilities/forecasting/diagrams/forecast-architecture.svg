<svg viewBox="0 0 1300 760" role="img" focusable="false" aria-labelledby="forecast-architecture-title forecast-architecture-desc" xmlns="http://www.w3.org/2000/svg"><title id="forecast-architecture-title">Component diagram: Forecast retained-evidence topology</title><desc id="forecast-architecture-desc">Selected history enters a planned daily workflow inside the operational ML boundary. Retained data is isolated in ForecastDataStack, and narrow readers serve the page and governed conversational tool from its immutable current generation.</desc><defs><marker id="forecast-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1300" height="760" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="13" fill="#172033" text-anchor="middle"><g id="forecast-data-boundary"><rect x="35" y="40" width="350" height="530" fill="none" stroke="#9bbce1" stroke-width="2"/><text x="210" y="65" fill="#172033">ForecastDataStack — retained data boundary</text><path d="M80 145v55c0 13 250 13 250 0v-55c0-13-250-13-250 0z" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><ellipse cx="205" cy="145" rx="125" ry="13" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="205" y="165">Forecast staging bucket<tspan x="205" dy="17">[Container: private S3]</tspan><tspan x="205" dy="16">run input · candidate output</tspan></text><path d="M80 360v55c0 13 250 13 250 0v-55c0-13-250-13-250 0z" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><ellipse cx="205" cy="360" rx="125" ry="13" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="205" y="380">Forecast artifact table<tspan x="205" dy="17">[Container: DynamoDB]</tspan><tspan x="205" dy="16">immutable generations · CURRENT pointer</tspan></text></g><g id="forecast-ml-boundary"><rect x="430" y="40" width="535" height="530" fill="none" stroke="#9aa8bb" stroke-width="2"/><text x="697" y="65" fill="#536275">MlStack — operational ML boundary (planned)</text><g fill="#ffffff" stroke="#9aa8bb" stroke-width="2" stroke-dasharray="5 4"><rect x="465" y="105" width="185" height="65" rx="6"/><rect x="730" y="105" width="185" height="65" rx="6"/><rect x="465" y="260" width="185" height="65" rx="6"/><rect x="730" y="260" width="185" height="65" rx="6"/><rect x="465" y="415" width="185" height="65" rx="6"/><rect x="730" y="415" width="185" height="65" rx="6"/></g><g fill="#172033"><text x="557" y="130">EventBridge Scheduler<tspan x="557" dy="17">[managed scheduler]</tspan><tspan x="557" dy="16">daily state-machine start</tspan></text><text x="822" y="130">Forecast workflow<tspan x="822" dy="17">[Step Functions Standard]</tspan><tspan x="822" dy="16">readiness · publish-or-hold</tspan></text><text x="557" y="285">History coordinator<tspan x="557" dy="17">[Python Lambda]</tspan><tspan x="557" dy="16">selection · eligibility · manifest</tspan></text><text x="822" y="285">Forecast Processing job<tspan x="822" dy="17">[SageMaker Processing]</tspan><tspan x="822" dy="16">Chronos inference + backtest</tspan></text><text x="557" y="440">Quality publisher<tspan x="557" dy="17">[Python Lambda]</tspan><tspan x="557" dy="16">validate · conditionally advance</tspan></text><text x="822" y="440">Forecast alarms<tspan x="822" dy="17">[CloudWatch + SNS]</tspan><tspan x="822" dy="16">failed or held run</tspan></text></g></g><g id="forecast-consumers"><rect x="1020" y="105" width="230" height="65" rx="6" fill="#f3fbf6" stroke="#9ac6aa" stroke-width="2"/><text x="1135" y="130">Forecast presentation route<tspan x="1135" dy="17">[Python Lambda]</tspan><tspan x="1135" dy="16">closed page response</tspan></text><rect x="1020" y="260" width="230" height="65" rx="6" fill="#f3fbf6" stroke="#9ac6aa" stroke-width="2"/><text x="1135" y="285">Forecast read tool<tspan x="1135" dy="17">[Python Lambda]</tspan><tspan x="1135" dy="16">governed artifact lookup</tspan></text><rect x="1020" y="415" width="230" height="65" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="1135" y="440">Forecast page<tspan x="1135" dy="17">[Component: React]</tspan><tspan x="1135" dy="16">history + interval visuals</tspan></text><rect x="1020" y="570" width="230" height="65" rx="6" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><text x="1135" y="595">Conversational Runtime<tspan x="1135" dy="17">[Container: AgentCore Runtime]</tspan><tspan x="1135" dy="16">governed tool results</tspan></text></g><g id="forecast-history"><path d="M80 640v55c0 13 250 13 250 0v-55c0-13-250-13-250 0z" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"/><ellipse cx="205" cy="640" rx="125" ry="13" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="205" y="660">Selected canonical history<tspan x="205" dy="17">[Container: Athena + publications]</tspan><tspan x="205" dy="16">exact CURRENT-backed daily series</tspan></text></g><g fill="none" stroke="#9aa8bb" marker-end="url(#forecast-architecture-arrow)"><path d="M650 137h80" stroke-dasharray="5 4"/><path d="M730 145L650 260"/><path d="M330 672h85V292h50"/><path d="M465 292H385V185H330"/><path d="M915 292h-65"/><path d="M730 292H650V200H330"/><path d="M822 325v55H650V447"/><path d="M730 145v270" stroke-dasharray="5 4"/><path d="M650 447H385V395H330"/><path d="M330 395h690V137h0"/><path d="M330 395h690V292"/><path d="M1250 137v278"/><path d="M1250 292v278"/></g><g font-size="11" fill="#536275"><text x="690" y="120">StartExecution</text><text x="685" y="210">readiness request</text><text x="365" y="650">bound selected history</text><text x="360" y="220">input manifest</text><text x="885" y="280">CreateProcessingJob.sync</text><text x="520" y="185">input/output prefixes</text><text x="770" y="370">candidate manifest</text><text x="700" y="430">candidate location</text><text x="680" y="510">typed failure/hold</text><text x="690" y="380">immutable generation + pointer</text><text x="800" y="125">exact read</text><text x="800" y="285">exact read</text><text x="1230" y="370">closed presentation response</text><text x="1230" y="535">governed forecast evidence</text></g></g></svg>
