<svg viewBox="0 0 1160 510" role="img" focusable="false" aria-labelledby="analytics-discovery-title analytics-discovery-desc" xmlns="http://www.w3.org/2000/svg"><title id="analytics-discovery-title">Component diagram: Analytics Discovery declaration topology</title><desc id="analytics-discovery-desc">Three reviewed declaration data inputs compile into a packaged manifest. The Explore API serves the fixed React page, while a future managed-Harness contract may consume bounded discovery data from the compilation assembly.</desc><defs><marker id="analytics-discovery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1160" height="510" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="13" fill="#172033" text-anchor="middle"><g id="analytics-discovery-inputs" fill="#f2f8fe" stroke="#9bbce1" stroke-width="2"><path d="M25 35v55c0 13 220 13 220 0V35c0-13-220-13-220 0z"/><ellipse cx="135" cy="35" rx="110" ry="13" fill="#f2f8fe" stroke="#2f6fb2"/><path d="M25 205v55c0 13 220 13 220 0v-55c0-13-220-13-220 0z"/><ellipse cx="135" cy="205" rx="110" ry="13" fill="#f2f8fe" stroke="#2f6fb2"/><path d="M25 375v55c0 13 220 13 220 0v-55c0-13-220-13-220 0z"/><ellipse cx="135" cy="375" rx="110" ry="13" fill="#f2f8fe" stroke="#2f6fb2"/></g><g><text x="135" y="55">Discovery declaration<tspan x="135" dy="17">[Data: versioned YAML + manifest]</tspan><tspan x="135" dy="16">questions · category order</tspan></text><text x="135" y="225">Metric catalog<tspan x="135" dy="17">[Data: packaged declaration]</tspan><tspan x="135" dy="16">definitions · caveats · grains</tspan></text><text x="135" y="395">Page declarations<tspan x="135" dy="17">[Data: packaged declaration]</tspan><tspan x="135" dy="16">purpose · page actions</tspan></text></g><g id="analytics-discovery-compiler"><rect x="345" y="205" width="240" height="70" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3"/><text x="465" y="230">Discovery compiler<tspan x="465" dy="17">[Component: build-time Python]</tspan><tspan x="465" dy="16">reference closure</tspan></text></g><g id="analytics-discovery-consumers"><rect x="675" y="35" width="205" height="65" rx="6" fill="#f3fbf6" stroke="#9ac6aa" stroke-width="2"/><text x="777" y="60">ExploreFunction<tspan x="777" dy="17">[Component: Python Lambda]</tspan><tspan x="777" dy="16">declaration-only API</tspan></text><rect x="940" y="35" width="190" height="65" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="1035" y="60">Explore page<tspan x="1035" dy="17">[Component: React]</tspan><tspan x="1035" dy="16">fixed categories · search</tspan></text><rect x="675" y="330" width="205" height="65" rx="6" fill="#f3fbf6" stroke="#9ac6aa" stroke-width="2"/><text x="777" y="355">Future orientation contract<tspan x="777" dy="17">[Boundary: proposed]</tspan><tspan x="777" dy="16">bounded directory</tspan></text><rect x="940" y="330" width="190" height="65" rx="6" fill="#f8f5ff" stroke="#b8a6dc" stroke-width="2"/><text x="1035" y="355">Managed Harness<tspan x="1035" dy="17">[Service: AgentCore]</tspan><tspan x="1035" dy="16">future orientation input</tspan></text></g><g fill="none" stroke="#9aa8bb" marker-end="url(#analytics-discovery-arrow)"><path d="M245 67h50v173h50"/><path d="M245 237h100"/><path d="M245 407h50V240h50"/><path d="M585 240h45V67h45"/><path d="M880 67h60"/><path d="M585 240h45v122h45"/><path d="M880 362h60"/><path d="M585 255h280v107h75"/></g><g font-size="11" fill="#536275"><text x="285" y="135">compiled discovery manifest</text><text x="285" y="225">resolved metric references</text><text x="285" y="370">resolved page/action references</text><text x="635" y="150">packaged manifest</text><text x="900" y="25">AnalyticsDiscovery.v1</text><text x="635" y="410">packaged manifest</text><text x="900" y="320">destination directory</text><text x="770" y="470">server-built discovery assembly</text></g></g></svg>
