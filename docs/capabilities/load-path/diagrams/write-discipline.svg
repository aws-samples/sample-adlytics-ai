<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" focusable="false" aria-labelledby="wd-title wd-desc"><title id="wd-title">Component diagram: two-phase semantic ingestion with table-scoped write units and atomic projection finalization</title><desc id="wd-desc">A delivery invocation on the standard ingestion queue parses once, writes immutable S3 authority, advances CURRENT, and submits one durable generation-independent plan intent. A scheduled PlanIntentReconciler claims each due intent, assigns the next generation, persists the write plan with its recorded lifecycle, and alone sends and admits one write unit per physical Iceberg table to a FIFO queue keyed by table. A table writer acquires the table lease, reads immutable objects, runs consolidated merges, verifies once, and uses one DynamoDB transaction to check the exact lease, advance required servable pointers, attest the unit, and increment the plan. It releases the lease only after that transaction and then attempts plan completion. Serving and the dependency router read the servable pointer.</desc><defs><marker id="wd-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536275"/></marker></defs><rect width="1400" height="560" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle"><rect x="30" y="60" width="230" height="110" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="145" y="90" font-weight="bold">Delivery queue</text><text x="145" y="113" font-size="13">[SQS standard, existing]</text><text x="145" y="136" font-size="13">one landed manifest</text><rect x="310" y="60" width="250" height="110" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3"/><text x="435" y="90" font-weight="bold">Phase 1: publish authority</text><text x="435" y="113" font-size="13">[Lambda: ingest_delivery]</text><text x="435" y="136" font-size="13">parse, gates, lease, CURRENT</text><rect x="620" y="60" width="230" height="110" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="735" y="90" font-weight="bold">Immutable authority</text><text x="735" y="113" font-size="13">[S3 + DynamoDB publications]</text><text x="735" y="136" font-size="13">objects, attempts, CURRENT</text><rect x="900" y="60" width="230" height="110" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="1015" y="90" font-weight="bold">Intent + write plan</text><text x="1015" y="113" font-size="13">[DynamoDB: publications table]</text><text x="1015" y="136" font-size="13">intents, plans, units, counters</text><rect x="1180" y="60" width="190" height="110" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="1275" y="90" font-weight="bold">PlanIntentReconciler</text><text x="1275" y="113" font-size="13">[Lambda: 1-minute schedule]</text><text x="1275" y="136" font-size="13">claim, persist, send, admit</text><rect x="310" y="240" width="250" height="110" rx="7" fill="#fff4e0" stroke="#c77700" stroke-width="2"/><text x="435" y="270" font-weight="bold">Write queue</text><text x="435" y="293" font-size="13">[SQS FIFO, new]</text><text x="435" y="316" font-size="13">MessageGroupId = physical table</text><rect x="620" y="240" width="230" height="110" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3"/><text x="735" y="270" font-weight="bold">Phase 2: project</text><text x="735" y="293" font-size="13">[Lambda: table_writer]</text><text x="735" y="316" font-size="13">lease, merge, verify, finalize</text><rect x="900" y="240" width="230" height="110" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="1015" y="270" font-weight="bold">Iceberg tables</text><text x="1015" y="293" font-size="13">[Athena: source, candidate, current]</text><text x="1015" y="316" font-size="13">derived exact projection</text><rect x="620" y="410" width="230" height="100" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="3"/><text x="735" y="440" font-weight="bold">Atomic finalization</text><text x="735" y="463" font-size="13">[DynamoDB transaction]</text><text x="735" y="486" font-size="13">pointers + unit + META</text><rect x="900" y="410" width="230" height="100" rx="7" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="1015" y="440" font-weight="bold">Serving and router</text><text x="1015" y="463" font-size="13">[Component: readers]</text><text x="1015" y="486" font-size="13">read servable, never authority</text><rect x="1180" y="240" width="190" height="110" rx="7" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="1275" y="270" font-weight="bold">Table lease</text><text x="1275" y="293" font-size="13">[DynamoDB: leases table]</text><text x="1275" y="316" font-size="13">transaction fence</text></g><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#wd-arrow)"><path d="M260 115H310"/><path d="M560 115H620"/><path d="M850 115H900"/><path d="M1130 115H1180"/><path d="M1275 170L560 250" stroke-dasharray="5 4"/><path d="M560 295H620" stroke-dasharray="5 4"/><path d="M850 295H900"/><path d="M735 350V410"/><path d="M850 460H900"/><path d="M1130 295H1180"/><path d="M1180 325L850 445"/></g><g font-family="Arial, sans-serif" font-size="11" fill="#536275"><text x="265" y="105">manifest</text><text x="565" y="105">fenced txn</text><text x="855" y="105">submit intent</text><text x="1135" y="105">due intent</text><text x="920" y="215">send + admit units</text><text x="565" y="285">FIFO group</text><text x="855" y="285">MERGE, SELECT</text><text x="1135" y="285">acquire/release</text><text x="745" y="385">one finalization txn</text><text x="855" y="450">servable pointer</text><text x="980" y="390">exact lease check</text></g></svg>
