<svg viewBox="0 0 1100 450" role="img" focusable="false" aria-labelledby="quality-review-title quality-review-desc" xmlns="http://www.w3.org/2000/svg"><title id="quality-review-title">Component diagram: Protected Quality Review API authorization topology</title><desc id="quality-review-desc">An entitled reviewer sends a cookie or bearer request to CloudFront, whose function refuses a non-canonical API path; a planned web ACL and origin-verify header are shown dashed. The HTTP API stage sends the route key and credential to the route authorizer, which verifies the review-level claim the Cognito token trigger adds to the Cognito-signed token. The stage then invokes the review function with the authorizer context, the function reads the quality record tables with key-bounded reads, and the stage writes each request's reviewer and attribution flag to the reviewer access log.</desc><defs><marker id="quality-review-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1100" height="450" fill="#ffffff"/><g font-family="system-ui, sans-serif" font-size="13" fill="#172033" text-anchor="middle"><rect x="20" y="190" width="160" height="80" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="100" y="218">Entitled reviewer<tspan x="100" dy="17">[Person: Cognito user]</tspan><tspan x="100" dy="16">cookie or bearer</tspan></text><rect x="250" y="30" width="170" height="70" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2" stroke-dasharray="5 4"/><text x="335" y="55">Web ACL + origin-verify<tspan x="335" dy="17">[Planned: WAF + header]</tspan><tspan x="335" dy="16">edge entry</tspan></text><rect x="250" y="190" width="170" height="80" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="335" y="218">Edge path check<tspan x="335" dy="17">[Component: CloudFront]</tspan><tspan x="335" dy="16">canonical path only</tspan></text><rect x="480" y="190" width="200" height="80" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="580" y="218">HTTP API stage<tspan x="580" dy="17">[Component: API Gateway]</tspan><tspan x="580" dy="16">two review routes</tspan></text><rect x="480" y="30" width="200" height="70" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="580" y="55">Route authorizer<tspan x="580" dy="17">[Component: Python Lambda]</tspan><tspan x="580" dy="16">route-key entitlement</tspan></text><rect x="770" y="30" width="200" height="70" rx="6" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="870" y="55">Cognito token trigger<tspan x="870" dy="17">[Component: Python Lambda]</tspan><tspan x="870" dy="16">groups → levels claim</tspan></text><rect x="870" y="190" width="200" height="80" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="970" y="218">Review function<tspan x="970" dy="17">[Component: Python Lambda]</tspan><tspan x="970" dy="16">entitled sections only</tspan></text><path d="M880 345v70c0 15 180 15 180 0V345c0-15-180-15-180 0z" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><ellipse cx="970" cy="345" rx="90" ry="15" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="970" y="377">Quality record tables<tspan x="970" dy="17">[Container: DynamoDB]</tspan><tspan x="970" dy="16">immutable minimized records</tspan></text><rect x="480" y="340" width="200" height="75" rx="6" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="580" y="366">Reviewer access log<tspan x="580" dy="17">[Container: CloudWatch Logs]</tspan><tspan x="580" dy="16">retained, deletion protected</tspan></text></g><g fill="none" stroke="#9aa8bb" marker-end="url(#quality-review-arrow)"><path d="M180 230H250"/><path d="M420 230H480"/><path d="M580 190V100"/><path d="M680 230H870"/><path d="M970 270V330"/><path d="M580 270V340"/><path d="M770 65H680" stroke-dasharray="5 4"/><path d="M335 100V190" stroke-dasharray="5 4"/></g><g font-family="system-ui, sans-serif" font-size="11" fill="#536275"><text x="215" y="220" text-anchor="middle">HTTPS</text><text x="215" y="248" text-anchor="middle">POST</text><text x="450" y="220" text-anchor="middle">raw path</text><text x="590" y="150">route key + credential</text><text x="775" y="220" text-anchor="middle">authorizer context:</text><text x="775" y="248" text-anchor="middle">levels + subject</text><text x="980" y="305">key-bounded reads</text><text x="590" y="310">reviewer + attribution</text><text x="725" y="55" text-anchor="middle">claim in signed</text><text x="725" y="85" text-anchor="middle">access token</text><text x="345" y="150">planned</text></g></svg>
