<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" focusable="false" aria-labelledby="adr003-tree-title adr003-tree-desc"><title id="adr003-tree-title">Decision tree: channel-specific concept attachment</title><desc id="adr003-tree-desc">A channel-specific concept is classified as a private attribute, an optional field group, a custom subtype fact, or a presentation-hidden value based on its entity relationship, additivity, and grain.</desc><defs><marker id="adr003-tree-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#536275"/></marker></defs><rect x="0" y="0" width="1100" height="680" fill="#ffffff"/><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#adr003-tree-arrow)"><path d="M550 100 V145"/><path d="M460 205 H220 V290"/><path d="M640 205 H550 V275"/><path d="M460 335 H220 V420"/><path d="M640 335 H550 V405"/><path d="M460 465 H220 V550"/><path d="M640 465 H550 V550"/><path d="M310 590 H800"/><path d="M550 590 H800"/><path d="M310 460 V590"/></g><g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033"><rect x="400" y="30" width="300" height="70" rx="6" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><polygon points="550,145 640,205 550,265 460,205" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><polygon points="550,275 640,335 550,395 460,335" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><polygon points="550,405 640,465 550,525 460,465" fill="#fff4e0" stroke="#c77700" stroke-width="2.5"/><rect x="110" y="290" width="220" height="80" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><rect x="110" y="420" width="220" height="80" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><rect x="110" y="550" width="220" height="80" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><rect x="800" y="550" width="220" height="80" rx="6" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="550" y="58" font-weight="bold">Channel-specific concept</text><text x="550" y="80" font-size="13">[Input: canonical-model decision]</text><text x="550" y="200" font-weight="bold">Descriptive entity attribute?</text><text x="550" y="330" font-weight="bold">Additive at core fact grain?</text><text x="550" y="460" font-weight="bold">Core analogue at any grain?</text><text x="220" y="320" font-weight="bold">1. Private attribute</text><text x="220" y="342" font-size="13">[Dimension extension]</text><text x="220" y="450" font-weight="bold">2. Field group</text><text x="220" y="472" font-size="13">[Core fact: optional]</text><text x="220" y="580" font-weight="bold">3. Custom subtype fact</text><text x="220" y="602" font-size="13">[Own grain + table]</text><text x="910" y="580" font-weight="bold">4. Hide at presentation</text><text x="910" y="602" font-size="13">[Private cube/view label]</text><text x="360" y="195" font-size="12">yes</text><text x="685" y="265" font-size="12">no</text><text x="360" y="325" font-size="12">yes</text><text x="685" y="395" font-size="12">no</text><text x="360" y="455" font-size="12">different/no analogue</text><text x="685" y="525" font-size="12">hide where inapplicable</text></g></svg>
