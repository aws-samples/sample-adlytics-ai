<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" focusable="false" aria-labelledby="gc-title gc-desc"><title id="gc-title">Focused Module diagram: generation lifecycle states and the writers that move them</title><desc id="gc-desc">A relevant CURRENT transition opens a generation or joins the open one. When every required dependency is covered the router freezes it and derives the expected revision. Equal to the current pointer ends in completed_no_change. Otherwise the generation is dispatched and the materializer moves it to materializing, then to completed_advanced in one transaction with the pointer, or to failed. A relevant transition after freezing supersedes a non-terminal generation, whose materializer abandons its work, and opens a successor.</desc><defs><marker id="gc-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#536275"/></marker></defs><rect width="1400" height="420" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle"><rect x="30" y="150" width="180" height="80" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="120" y="185" font-weight="bold">open</text><text x="120" y="208" font-size="13">router: open / join</text><polygon points="380,120 480,190 380,260 280,190" fill="#fff4e0" stroke="#c77700" stroke-width="3"/><text x="380" y="185" font-weight="bold">cohort complete?</text><text x="380" y="207" font-size="13">[Gate: required roster]</text><rect x="540" y="150" width="180" height="80" rx="7" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="630" y="185" font-weight="bold">frozen</text><text x="630" y="208" font-size="13">expected revision derived</text><polygon points="880,120 980,190 880,260 780,190" fill="#fff4e0" stroke="#c77700" stroke-width="3"/><text x="880" y="185" font-weight="bold">= pointer revision?</text><text x="880" y="207" font-size="13">[Gate: no-change]</text><rect x="1040" y="40" width="200" height="70" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="1140" y="70" font-weight="bold">completed_no_change</text><text x="1140" y="93" font-size="13">router, no measurement</text><rect x="1040" y="150" width="200" height="80" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3"/><text x="1140" y="185" font-weight="bold">materializing</text><text x="1140" y="208" font-size="13">materializer claim</text><rect x="1040" y="290" width="200" height="70" rx="7" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="1140" y="320" font-weight="bold">completed_advanced</text><text x="1140" y="343" font-size="13">one txn with pointer</text><rect x="790" y="290" width="180" height="70" rx="7" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="880" y="320" font-weight="bold">failed</text><text x="880" y="343" font-size="13">typed reason</text><rect x="540" y="290" width="180" height="70" rx="7" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="630" y="320" font-weight="bold">superseded</text><text x="630" y="343" font-size="13">successor opened</text><rect x="290" y="290" width="180" height="70" rx="7" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="380" y="320" font-weight="bold">abandoned</text><text x="380" y="343" font-size="13">materializer saw superseded</text></g><g fill="none" stroke="#536275" stroke-width="2" marker-end="url(#gc-arrow)"><path d="M210 190H280"/><path d="M480 190H540"/><path d="M720 190H780"/><path d="M930 155L1040 80"/><path d="M980 190H1040"/><path d="M1140 230V290"/><path d="M1040 220L970 300"/><path d="M630 230V290" stroke-dasharray="5 4"/><path d="M1060 240L720 320" stroke-dasharray="5 4"/><path d="M540 325H470" stroke-dasharray="5 4"/></g><g font-family="Arial, sans-serif" font-size="11" fill="#536275"><text x="215" y="180">transition</text><text x="485" y="180">yes</text><text x="725" y="180">derive</text><text x="985" y="110">yes</text><text x="985" y="180">no: dispatch</text><text x="1150" y="265">pointer ADVANCED</text><text x="990" y="270">budget / evidence</text><text x="635" y="265">late transition</text><text x="890" y="285">late transition</text><text x="475" y="315">at checkpoint</text><text x="380" y="105">no: generation stays open</text></g></svg>
