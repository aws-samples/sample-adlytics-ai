<svg viewBox="0 0 1120 320" role="img" focusable="false" aria-labelledby="narration-prompt-title narration-prompt-desc" xmlns="http://www.w3.org/2000/svg"><title id="narration-prompt-title">Component diagram: Visual Narration Harness prompt composition</title><desc id="narration-prompt-desc">A shared governed narration policy is composed at deployment with either the global conversation task or the visual narration task. The browser invokes neither prompt composition path.</desc><defs><marker id="narration-prompt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1120" height="320" fill="#ffffff"/><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172033"><rect x="35" y="115" width="220" height="85" rx="8" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><text x="145" y="143" font-size="14">GovernedNarrationBase.v1<tspan x="145" dy="18" font-size="12">[Prompt: immutable policy]</tspan><tspan x="145" dy="16" font-size="12">evidence · qualifiers · limits</tspan></text><rect x="355" y="45" width="220" height="80" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="465" y="73" font-size="14">GlobalConversationTask.v1<tspan x="465" dy="18" font-size="12">[Prompt: tool-using chat]</tspan></text><rect x="355" y="195" width="220" height="80" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="465" y="223" font-size="14">VisualNarrationTask.v1<tspan x="465" dy="18" font-size="12">[Prompt: no tools]</tspan></text><rect x="700" y="45" width="190" height="80" rx="8" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><text x="795" y="73" font-size="14">Conversation Harness<tspan x="795" dy="18" font-size="12">[Service: AgentCore]</tspan></text><rect x="700" y="195" width="190" height="80" rx="8" fill="#f8f5ff" stroke="#6b4fbb" stroke-width="2"/><text x="795" y="223" font-size="14">Visual Narration Harness<tspan x="795" dy="18" font-size="12">[Service: AgentCore]</tspan></text><rect x="970" y="115" width="115" height="85" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="1027" y="143" font-size="14">Browser<tspan x="1027" dy="18" font-size="12">[Actor]</tspan><tspan x="1027" dy="16" font-size="12">no prompt authority</tspan></text><path d="M255 135H355M255 175H355M575 85H700M575 235H700" fill="none" stroke="#9aa8bb" marker-end="url(#narration-prompt-arrow)"/><path d="M970 158H890M970 158V235H890" fill="none" stroke="#9aa8bb" stroke-dasharray="5 4"/><text x="305" y="120" font-size="11" fill="#536275">deployment composition</text><text x="305" y="192" font-size="11" fill="#536275">deployment composition</text><text x="635" y="70" font-size="11" fill="#536275">immutable configured prompt</text><text x="635" y="220" font-size="11" fill="#536275">immutable configured prompt</text><text x="930" y="145" font-size="11" fill="#536275">opaque reference only</text></g></svg>
