<svg viewBox="0 0 1140 360" role="img" focusable="false" aria-labelledby="narration-flow-title narration-flow-desc" xmlns="http://www.w3.org/2000/svg"><title id="narration-flow-title">Call-flow diagram: Visual narration lifecycle</title><desc id="narration-flow-desc">A user selects a rendered visual, the browser sends an opaque narration reference, the server validates owner and artifact lineage, constructs typed narration context, calls a no-tools narration harness, validates its response, and streams visual narration blocks. Selecting another visual aborts the prior stream.</desc><defs><marker id="narration-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1140" height="360" fill="#ffffff"/><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172033"><text x="105" y="35" font-size="13">Browser visual</text><text x="380" y="35" font-size="13">Narration API</text><text x="660" y="35" font-size="13">Context/artifact store</text><text x="980" y="35" font-size="13">Narration Harness</text><path d="M105 55V325M380 55V325M660 55V325M980 55V325" stroke="#9aa8bb" stroke-dasharray="5 4"/><path d="M105 85H380M380 115H660M380 150H980M980 190H380M380 225H105M105 285H380" fill="none" stroke="#9aa8bb" marker-end="url(#narration-flow-arrow)"/><text x="242" y="78" font-size="11" fill="#536275">POST session + opaque narration reference</text><text x="520" y="108" font-size="11" fill="#536275">validate owner/session/expiry/revision</text><text x="680" y="143" font-size="11" fill="#536275">server-built typed visual context</text><text x="680" y="183" font-size="11" fill="#536275">bounded structured narration output</text><text x="242" y="218" font-size="11" fill="#536275">validated stream: observed/perspective/hypothesis/limit</text><text x="242" y="278" font-size="11" fill="#536275">metric switch aborts old stream; page artifact remains</text></g></svg>
