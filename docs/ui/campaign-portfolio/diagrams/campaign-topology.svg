<svg viewBox="0 0 1180 530" role="img" focusable="false" aria-labelledby="campaign-topology-title campaign-topology-desc" xmlns="http://www.w3.org/2000/svg"><title id="campaign-topology-title">Component diagram: Campaign Portfolio presentation topology</title><desc id="campaign-topology-desc">A React campaign route calls an authorized presentation API. The API issues and validates opaque campaign capabilities, reads authorized catalog and measurement evidence, persists artifacts, and returns a typed public artifact to a strict frontend decoder and renderer.</desc><defs><marker id="campaign-topology-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1180" height="530" fill="#ffffff"/><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172033"><rect x="30" y="205" width="200" height="90" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="130" y="235" font-size="14">Campaign route<tspan x="130" dy="18" font-size="12">[Component: React controller]</tspan><tspan x="130" dy="16" font-size="12">safe signature + UI state</tspan></text><rect x="330" y="205" width="220" height="90" rx="8" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3"/><text x="440" y="235" font-size="14">Presentation API<tspan x="440" dy="18" font-size="12">[Component: Python Lambda]</tspan><tspan x="440" dy="16" font-size="12">authorizer-derived owner</tspan></text><rect x="670" y="65" width="210" height="80" rx="8" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="775" y="95" font-size="14">Capability + artifact store<tspan x="775" dy="18" font-size="12">[Data: DynamoDB]</tspan><tspan x="775" dy="16" font-size="12">owner · session · expiry · parent</tspan></text><rect x="670" y="205" width="210" height="90" rx="8" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="775" y="235" font-size="14">Campaign presentation handler<tspan x="775" dy="18" font-size="12">[Component: Python adapter]</tspan><tspan x="775" dy="16" font-size="12">fixed V1/V2 measurement plan</tspan></text><rect x="970" y="205" width="180" height="90" rx="8" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="1060" y="235" font-size="14">Governed evidence<tspan x="1060" dy="18" font-size="12">[Data: semantic facts]</tspan><tspan x="1060" dy="16" font-size="12">catalog + measurement results</tspan></text><rect x="30" y="385" width="200" height="80" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="130" y="415" font-size="14">Strict decoder + renderer<tspan x="130" dy="18" font-size="12">[Component: TypeScript + React]</tspan><tspan x="130" dy="16" font-size="12">state · chart · evidence</tspan></text><path d="M230 250H330" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-topology-arrow)"/><path d="M550 250H670" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-topology-arrow)"/><path d="M775 205V145" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-topology-arrow)"/><path d="M880 250H970" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-topology-arrow)"/><path d="M440 295V425H230" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-topology-arrow)"/><text x="280" y="235" font-size="11" fill="#536275">POST intent only</text><text x="610" y="235" font-size="11" fill="#536275">validated capability</text><text x="845" y="180" font-size="11" fill="#536275">mint/read parent custody</text><text x="925" y="235" font-size="11" fill="#536275">fixed plans + evidence</text><text x="300" y="410" font-size="11" fill="#536275">typed public artifact envelope</text></g></svg>
