<svg viewBox="0 0 1180 360" role="img" focusable="false" aria-labelledby="campaign-state-title campaign-state-desc" xmlns="http://www.w3.org/2000/svg"><title id="campaign-state-title">State-transition diagram: Campaign Portfolio UI lifecycle</title><desc id="campaign-state-desc">The Campaign Portfolio UI transitions from list loading to a typed list outcome, selection loading, typed detail, or classified issue. Expired or invalid capabilities refresh the list, and stale responses are discarded.</desc><defs><marker id="campaign-state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1180" height="360" fill="#ffffff"/><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172033"><rect x="35" y="145" width="150" height="65" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="110" y="171" font-size="13">List loading<tspan x="110" dy="17" font-size="11">route/session/window change</tspan></text><rect x="275" y="145" width="165" height="65" rx="8" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="357" y="171" font-size="13">Typed list outcome<tspan x="357" dy="17" font-size="11">choices | empty | insufficient</tspan></text><rect x="530" y="145" width="165" height="65" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="612" y="171" font-size="13">Detail loading<tspan x="612" dy="17" font-size="11">safe signature retained</tspan></text><rect x="785" y="145" width="165" height="65" rx="8" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="867" y="171" font-size="13">Typed detail<tspan x="867" dy="17" font-size="11">selected | insufficient</tspan></text><rect x="1000" y="45" width="145" height="65" rx="8" fill="#fff7f2" stroke="#b54545" stroke-width="2"/><text x="1072" y="71" font-size="13">Page issue<tspan x="1072" dy="17" font-size="11">dependency | invariant</tspan></text><rect x="1000" y="250" width="145" height="65" rx="8" fill="#fff4e0" stroke="#c77700" stroke-width="2"/><text x="1072" y="276" font-size="13">Refresh list<tspan x="1072" dy="17" font-size="11">expired | invalid capability</tspan></text><path d="M185 177H275M440 177H530M695 177H785M950 160L1000 105M950 195L1000 270M1000 282H440" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-state-arrow)"/><text x="230" y="160" font-size="11" fill="#536275">strict list decode</text><text x="485" y="160" font-size="11" fill="#536275">select capability</text><text x="740" y="160" font-size="11" fill="#536275">strict detail decode</text><text x="985" y="130" font-size="11" fill="#536275">classified error</text><text x="980" y="235" font-size="11" fill="#536275">validation / local expiry</text><text x="720" y="300" font-size="11" fill="#536275">new capabilities; stale async response discarded</text></g></svg>
