<svg viewBox="0 0 1160 390" role="img" focusable="false" aria-labelledby="campaign-flow-title campaign-flow-desc" xmlns="http://www.w3.org/2000/svg"><title id="campaign-flow-title">Call-flow diagram: Campaign Portfolio list and detail lifecycle</title><desc id="campaign-flow-desc">The browser requests campaign choices, receives safe labels and capabilities, redeems one selection reference, receives a typed detail artifact, and refreshes choices when the capability expires or validation fails.</desc><defs><marker id="campaign-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1160" height="390" fill="#ffffff"/><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172033"><text x="125" y="35" font-size="13">Browser route</text><text x="405" y="35" font-size="13">Presentation API</text><text x="700" y="35" font-size="13">Capability/artifact store</text><text x="1010" y="35" font-size="13">Catalog + measurement</text><path d="M125 55V350M405 55V350M700 55V350M1010 55V350" stroke="#9aa8bb" stroke-dasharray="5 4"/><path d="M125 85H405" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-flow-arrow)"/><path d="M405 115H700" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-flow-arrow)"/><path d="M405 145H125" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-flow-arrow)"/><path d="M125 195H405" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-flow-arrow)"/><path d="M405 225H700" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-flow-arrow)"/><path d="M405 255H1010" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-flow-arrow)"/><path d="M405 290H125" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-flow-arrow)"/><path d="M125 335H405" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-flow-arrow)"/><text x="265" y="78" font-size="11" fill="#536275">POST campaigns: session + optional temporal selection</text><text x="550" y="108" font-size="11" fill="#536275">persist parent + capabilities</text><text x="265" y="138" font-size="11" fill="#536275">safe choices + opaque references + expiry</text><text x="265" y="188" font-size="11" fill="#536275">POST detail: session + selection reference</text><text x="550" y="218" font-size="11" fill="#536275">validate owner/session/expiry/parent</text><text x="705" y="248" font-size="11" fill="#536275">catalog revalidation + fixed evidence plan</text><text x="265" y="283" font-size="11" fill="#536275">typed detail artifact or classified error</text><text x="265" y="328" font-size="11" fill="#536275">expired/invalid selection → refresh list</text></g></svg>
