<svg viewBox="0 0 960 190" role="img" focusable="false" aria-labelledby="campaign-journey-title campaign-journey-desc" xmlns="http://www.w3.org/2000/svg"><title id="campaign-journey-title">User journey diagram: Campaign Portfolio review</title><desc id="campaign-journey-desc">A practitioner chooses a safely identified campaign, reviews outcome and delivery evidence, then follows an optional declared channel-context action.</desc><defs><marker id="campaign-journey-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="960" height="190" fill="#ffffff"/><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172033"><rect x="35" y="55" width="210" height="80" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="140" y="84" font-size="14">Practitioner<tspan x="140" dy="18" font-size="12">[Actor: authenticated user]</tspan></text><rect x="375" y="55" width="210" height="80" rx="8" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="2"/><text x="480" y="84" font-size="14">Campaign detail<tspan x="480" dy="18" font-size="12">[Surface: governed evidence]</tspan></text><rect x="715" y="55" width="210" height="80" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="820" y="84" font-size="14">Channel context<tspan x="820" dy="18" font-size="12">[Surface: declared destination]</tspan></text><path d="M245 95H375" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-journey-arrow)"/><path d="M585 95H715" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-journey-arrow)"/><text x="310" y="80" font-size="11" fill="#536275">select opaque capability</text><text x="650" y="80" font-size="11" fill="#536275">optional declared action</text></g></svg>
