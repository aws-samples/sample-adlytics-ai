<svg viewBox="0 0 1160 450" role="img" focusable="false" aria-labelledby="campaign-custody-title campaign-custody-desc" xmlns="http://www.w3.org/2000/svg"><title id="campaign-custody-title">Component diagram: Campaign capability and artifact custody</title><desc id="campaign-custody-desc">The presentation API mints a parent list artifact and one opaque campaign capability. A detail request validates that capability, parent artifact, owner, session, expiry, and current catalog identity before it constructs a child detail artifact.</desc><defs><marker id="campaign-custody-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa8bb"/></marker></defs><rect width="1160" height="450" fill="#ffffff"/><g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172033"><rect x="40" y="175" width="190" height="80" rx="8" fill="#ffffff" stroke="#9aa8bb" stroke-width="2"/><text x="135" y="204" font-size="14">Browser<tspan x="135" dy="18" font-size="12">[Component: React]</tspan><tspan x="135" dy="16" font-size="12">selection reference only</tspan></text><rect x="330" y="175" width="210" height="80" rx="8" fill="#f3fbf6" stroke="#2e7d4f" stroke-width="3"/><text x="435" y="204" font-size="14">Campaign handler<tspan x="435" dy="18" font-size="12">[Component: Python]</tspan><tspan x="435" dy="16" font-size="12">revalidation gate</tspan></text><path d="M650 70v75c0 16 220 16 220 0V70c0-16-220-16-220 0z" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><ellipse cx="760" cy="70" rx="110" ry="16" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="760" y="94" font-size="14">Parent list artifact<tspan x="760" dy="18" font-size="12">[Data: artifact record + V1/V2]</tspan></text><path d="M650 280v75c0 16 220 16 220 0v-75c0-16-220-16-220 0z" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><ellipse cx="760" cy="280" rx="110" ry="16" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="760" y="304" font-size="14">Campaign capability<tspan x="760" dy="18" font-size="12">[Data: owner · session · expiry]</tspan><tspan x="760" dy="16" font-size="12">canonical identity server-only</tspan></text><rect x="960" y="175" width="170" height="80" rx="8" fill="#f2f8fe" stroke="#2f6fb2" stroke-width="2"/><text x="1045" y="204" font-size="14">Authorized catalog<tspan x="1045" dy="18" font-size="12">[Data: campaign alias]</tspan><tspan x="1045" dy="16" font-size="12">current safe signature</tspan></text><path d="M230 215H330" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-custody-arrow)"/><path d="M540 195H650" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-custody-arrow)"/><path d="M540 235H650" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-custody-arrow)"/><path d="M870 215H960" fill="none" stroke="#9aa8bb" marker-end="url(#campaign-custody-arrow)"/><text x="280" y="198" font-size="11" fill="#536275">session + opaque reference</text><text x="595" y="178" font-size="11" fill="#536275">parent type/version/expiry</text><text x="595" y="258" font-size="11" fill="#536275">owner/session/expiry/signature</text><text x="915" y="198" font-size="11" fill="#536275">current identity revalidation</text></g></svg>
